# CI only: the workflow's own token, handed to the one image build that reaches
# the GitHub API, as a BuildKit secret (never a build argument, so it is in no
# layer, no image history and no log).
#
# The Mendelian randomization engine installs its pinned R packages from GitHub;
# `remotes` resolves their `Remotes:` through api.github.com, whose unauthenticated
# limit (60 requests an hour per address) a shared runner exhausted on about every
# other run. Applied by the `docker-hosted` job's build step alone, with
# GITHUB_TOKEN set from `github.token` on that step. It is an overlay, and not in
# deploy/web/docker-compose.yml, because a build with no such variable (a host
# build, a fork) must not be asked for one: the Dockerfile's mount is optional.
#
# Not a deployment file: it is in no release manifest and no release carries it.
services:
  evimed-mr-agent:
    build:
      secrets:
        - github_token

secrets:
  github_token:
    environment: GITHUB_TOKEN
