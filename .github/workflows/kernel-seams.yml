# The kernel's seams, checked against its published packages whenever the pin or the manifest of what we read off it moves.
#
# Why a workflow of its own and not a step of `web`. `verify-harness-seams.mjs` installs the whole pinned closure (about
# 500 MB, two minutes) and reads its shipped code, which is the only thing that notices upstream renaming a seam and the
# only thing that reports a wire method nobody classified — and it ran on a nightly schedule and by hand, so the pull
# request that moved the pin was green and the night after it was red (the first 0.2 candidate shipped five unclassified methods,
# the third time a pin move found its own new surface late). A path filter is the one trigger that needs no third-party
# action and no shell diff: the job exists on exactly the changes that can move a seam.
#
# What it runs is the same script the nightly matrix runs, against the same closure the image installs (one cutoff, computed
# from the closure by `kernel-install.mjs cutoff`, and checked here to be the recorded one).
name: kernel-seams

on:
  pull_request:
    paths:
      - "OpenScience/deps-version.json"
      - "OpenScience/packages/harness-port/seam-manifest.json"
      - "OpenScience/packages/contracts/dsh/**"
      - "OpenScience/deploy/runtime-dsh/dump-config.baseline.json"
      - "OpenScience/packages/domain/src/runtimeUiSurface.mjs"
      - "OpenScience/scripts/ops/verify-harness-seams.mjs"
      - "OpenScience/scripts/ops/kernel-install.mjs"
      - "OpenScience/scripts/ops/wire-surface.mjs"
      - ".github/workflows/kernel-seams.yml"
  push:
    branches: ["main", "master", "codex/**"]
    paths:
      - "OpenScience/deps-version.json"
      - "OpenScience/packages/harness-port/seam-manifest.json"
      - "OpenScience/packages/contracts/dsh/**"
      - "OpenScience/deploy/runtime-dsh/dump-config.baseline.json"
      - ".github/workflows/kernel-seams.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: OpenScience

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seams:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      # The recorded cutoff is the closure's, not a hand-written instant: the "CLI's publish time plus an hour" rule
      # fenced a member out of the first 0.2 candidate (a subpackage was re-published an hour and twenty minutes later).
      - name: The recorded registry cutoff is the pinned closure's
        run: node scripts/ops/kernel-install.mjs cutoff --check

      - name: Verify the seams against the pinned closure
        run: node scripts/ops/verify-harness-seams.mjs --install
