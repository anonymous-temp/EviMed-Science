# The nightly compatibility matrix.
#
# One job for every tracked upstream, because four copies of the same discipline
# is four things to keep in step. It never upgrades anything: it reports whether
# each pin's contract still passes and whether upstream has moved, so an upgrade
# PR starts from a verdict instead of from a search.
#
# A failing row means the pin may not move yet, and names the seam that moved. A
# row that is merely behind is information — treating that as a failure trains
# everyone to ignore the job.
name: upstream-matrix

on:
  schedule:
    # 02:00 UTC, which is outside the peak model-pricing window and outside the
    # hours a reviewer would be reading the result.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: OpenScience

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: OpenScience/package.json

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
          cache-dependency-path: OpenScience/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the matrix
        id: matrix
        working-directory: OpenScience
        run: node scripts/ops/upstream-compat-matrix.mjs --out compat-matrix.json

      # The matrix reads registries and replays golden frames; this reads the
      # shipped code. It is the only step that notices upstream renaming a seam,
      # which is the failure DSH's own README promises before its first tag.
      - name: Verify the seams against a real harness install
        working-directory: OpenScience
        run: node scripts/ops/verify-harness-seams.mjs --install

      # Both outputs, because the second one is the only thing that can ever
      # answer a project's "is there a plugin update". The web image ships a
      # permanently 1970-dated placeholder at `/app/plugin-availability.json`,
      # so a deployment reads `unknown` until an operator bind-mounts a real
      # record over it — and this run is where that record comes from. Uploading
      # only `compat-matrix.json` meant the plugin lane observed availability
      # nightly and threw the answer away.
      #
      # It is uploaded, not committed: a recorded observation carries a
      # timestamp, and one committed into the repository would make every image
      # built inside the 72-hour freshness window report a build-time answer as
      # a current one.
      - name: Upload the matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-matrix
          path: |
            OpenScience/compat-matrix.json
            OpenScience/plugin-availability.json

  # How far behind the pin is, and what moving it would touch. Report only.
  #
  # The matrix above tests the versions we pinned and says so ("it does not test latest"), so nothing said that the
  # kernel had moved twenty days until a person looked. This job is the tier that was missing: it installs the
  # candidates the dist-tags name (latest, next, alpha) with `--ignore-scripts`, diffs the web profile their CLI
  # composes against ours, runs the seam check against their shipped code (an unclassified wire method is listed by
  # name), checks the third-party bundles' peer ranges against what they install, and polls every other pin.
  #
  # It is a job of its own so that a crash here cannot hide the matrix's verdict and the matrix's cannot hide this one.
  # It exits 0 for every verdict, "blocked" included — a blocked candidate is information, and a job that goes red on
  # information gets ignored. It never opens a pull request and never writes to the repository.
  candidates:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Check the kernel candidates and poll the pins
        id: candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/ops/kernel-candidate-check.mjs --out candidate-check.json | tee candidate-check.txt
          { echo '```'; cat candidate-check.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Uploaded, not committed, for the reason the matrix's own artifact is: it is an observation with a timestamp.
      - name: Upload the candidate check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-check
          path: |
            OpenScience/candidate-check.json
            OpenScience/candidate-check.txt
