name: web

on:
  pull_request:
  push:
    branches: ["main", "master", "codex/**"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: OpenScience

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16.14-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: evimed_test_auth
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: Install test system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-venv postgresql-client python3-yaml python3-cryptography r-base-core
          # Match the scientific imports exercised by deployment-smoke with
          # the reviewed versions shipped in deploy/runtime-dsh/Dockerfile.
          python3 -m pip install numpy==2.2.6 pandas==2.2.3 scipy==1.15.3

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: OpenScience/package.json

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
          cache-dependency-path: OpenScience/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch bundled ai4s-skills pack
        shell: bash
        run: bash scripts/dev/fetch-skills.sh

      - name: Build and smoke the pinned public dataset
        run: python3 runtime/mcp/evimed-research/build_sider_cache.py

      - name: Test domain, port, socket and upstream contracts
        run: CI=true pnpm test:packages

      # Every test file under `evals/capability-audit/` is named here, because
      # `unittest discover` is given a literal filename per script and a file
      # nobody names is collected by nothing. `deploy.test.mjs` fails if a
      # `test_*.py` lands there without a script, and the `ci:web` step list
      # test fails if a script lands without a step here.
      - name: Test the capability audit suites
        run: |
          pnpm test:acceptance-ledger
          pnpm test:eval-briefs
          pnpm test:specialist-driver
          pnpm test:release-audit
          pnpm test:phi-masking

      - name: Check generated artifacts are current
        run: |
          pnpm check:capabilities
          pnpm check:skill-vocabulary
          pnpm check:skill-digests
          pnpm check:composition-references
          pnpm check:kernel-defaults
          pnpm check:pin-inventory

      # The gates `ci:web` runs and this workflow did not. CI is the only thing
      # standing on PRs and main, and it ran no ESLint at all: a lint failure, a
      # server type error, a committed secret, an unvendored community skill or
      # a SaaS-alignment drift could all merge. `apps/server/test/deploy.test.mjs`
      # now fails if this list falls behind `ci:web` again.
      - name: Lint, typecheck and audit
        run: |
          pnpm lint
          pnpm typecheck:domain
          pnpm typecheck:port
          pnpm typecheck:socket
          pnpm typecheck:server
          pnpm audit:source-secrets
          pnpm check:community-skills
          pnpm audit:saas-alignment

      - name: Test private memory engine logging boundary
        run: python3 -m unittest discover -s deploy/memos-engine -p 'test_*.py'

      - name: Test Hosted Web API
        run: |
          CI=true pnpm test:mcp
          CI=true pnpm --filter @ai4s/server test

      - name: Test shared authentication state
        env:
          OPEN_SCIENCE_TEST_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/evimed_test_auth
        run: node --test apps/server/test/postgresStore.integration.test.mjs

      - name: Test durable product state
        env:
          OPEN_SCIENCE_TEST_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/evimed_test_product
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -c 'CREATE DATABASE evimed_test_product'
          node scripts/ops/test-product-state.mjs

      - name: Test DeepSeek compatibility and release gates
        run: >-
          CI=true pnpm --filter @ai4s/server exec node --test
          test/deepseekCompatibility.test.mjs
          test/deepseekKernelReleaseGate.test.mjs

      - name: Test mock hosted API contract
        run: CI=true pnpm --filter @ai4s/server test:contract

      - name: Audit hosted compliance and monitoring baseline
        run: pnpm audit:hosted-compliance

      - name: Audit production dependencies
        run: pnpm audit:dependencies

      - name: Typecheck frontend
        run: pnpm --filter @ai4s/web typecheck

      - name: Test frontend
        run: CI=true pnpm --filter @ai4s/web test

      - name: Build hosted frontend
        run: CI=true VITE_OPEN_SCIENCE_API_URL=/api pnpm --filter @ai4s/web build

  docker-hosted:
    runs-on: ubuntu-24.04
    needs: web
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        working-directory: OpenScience
        shell: /usr/local/bin/evimed-ci-root-shell {0}
    env:
      COMPOSE_PARALLEL_LIMIT: "1"
      EVIMED_FULL_RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/release-') && contains(github.event.head_commit.message, '[full-release]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: OpenScience/package.json

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Prepare the disposable Docker host operator shell
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          # Preserve the action-installed Node/pnpm PATH across sudo's secure_path.
          # Every subsequent run step owns and reads the same private 0600 files.
          cat > "$RUNNER_TEMP/evimed-ci-root-shell" <<'SH'
          #!/usr/bin/env bash
          exec sudo -E env "PATH=$PATH" bash --noprofile --norc -eo pipefail "$1"
          SH
          sudo install -o 0 -g 0 -m 0755 "$RUNNER_TEMP/evimed-ci-root-shell" /usr/local/bin/evimed-ci-root-shell

      - name: Install dependencies and pinned skills for this job
        run: |
          test "$(id -u)" = 0
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Keep the operator-owned store separate from setup-pnpm's user cleanup.
          pnpm install --frozen-lockfile --store-dir "$RUNNER_TEMP/evimed-ci-root-pnpm-store"
          bash scripts/dev/fetch-skills.sh

      - name: Verify full sandbox support before building images
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import os from 'node:os';
          import { validateSandboxPrerequisites } from './scripts/ops/host-preflight.mjs';
          console.log(validateSandboxPrerequisites(os.release(), fs.readFileSync('/sys/kernel/security/lsm', 'utf8')));
          JS

      - name: Define immutable CI release
        run: |
          echo "OPEN_SCIENCE_DATA_VOLUME=open-science-data" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_POSTGRES_BACKUP_STATUS_DIR=$RUNNER_TEMP/evimed-postgres-backup/status" >> "$GITHUB_ENV"
          install -d -m 0700 "$RUNNER_TEMP/evimed-postgres-backup"
          install -d -m 0755 "$RUNNER_TEMP/evimed-postgres-backup/status"
          echo "OPEN_SCIENCE_APP_VERSION=0.1.3" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_RELEASE_ID=evimed-${GITHUB_SHA:0:12}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_SOURCE_REVISION=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_BUILD_CREATED=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_WEB_CONTAINER_IMAGE=open-science-web:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          # One agent runtime image, under the one variable the server reads
          # (`config.mjs` resolves `runtimeContainerImage` from it and nothing
          # else). There were two names while two kernels shipped, and this one
          # carried the OpenCode image — so the control plane was handed a kernel
          # image that no longer exists while the DSH image sat under the other
          # name, verified by a later step and then never launched.
          echo "OPEN_SCIENCE_RUNTIME_CONTAINER_IMAGE=open-science-runtime:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_DSH_VERSION=$(node -p "require('./deps-version.json').dsh.version")" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_CADDY_VERSION=2.11.4-alpine" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_OPERATOR_METRICS_TOKEN=ci-metrics-token-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-0123456789abcdef" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_GRAFANA_ADMIN_PASSWORD=ci-grafana-password-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-0123456789" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_ALERT_WEBHOOK_URL=https://alerts.example.test/open-science-ci" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_BOOTSTRAP_PASSWORD_FILE=${GITHUB_WORKSPACE}/OpenScience/deploy/web/secrets/bootstrap-password.txt" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_BACKUP_PASSPHRASE_FILE=${GITHUB_WORKSPACE}/OpenScience/deploy/web/secrets/backup-passphrase.txt" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_PRODUCTION_STATE_SECRETS_DIR=${GITHUB_WORKSPACE}/OpenScience/deploy/web/secrets" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_POSTGRES_PASSWORD_HOST_FILE=${GITHUB_WORKSPACE}/OpenScience/deploy/web/secrets/postgres-password.txt" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_DATABASE_URL_HOST_FILE=${GITHUB_WORKSPACE}/OpenScience/deploy/web/secrets/database-url.txt" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_MEMOS_DSN_HOST_FILE=${GITHUB_WORKSPACE}/OpenScience/deploy/web/secrets/memos-dsn.txt" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_MEMOS_ADMIN_PASSWORD_HOST_FILE=${GITHUB_WORKSPACE}/OpenScience/deploy/web/secrets/memos-admin-password.txt" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_EVIMED_API_KEY_HOST_FILE=${GITHUB_WORKSPACE}/OpenScience/deploy/web/secrets/evimed-api-key.txt" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_DEEPSEEK_API_KEY_HOST_FILE=${GITHUB_WORKSPACE}/OpenScience/deploy/web/secrets/deepseek-api-key.txt" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_MODEL_GATEWAY_SIGNING_SECRET_HOST_FILE=${GITHUB_WORKSPACE}/OpenScience/deploy/web/secrets/model-gateway-signing-key.txt" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_MATERIALS_PROJECT_API_KEY_HOST_FILE=${GITHUB_WORKSPACE}/OpenScience/deploy/web/secrets/materials-project-api-key.txt" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_EVIMED_WORKLOAD_SIGNING_SECRET_HOST_FILE=${GITHUB_WORKSPACE}/OpenScience/deploy/web/secrets/evimed-workload-signing-key.txt" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_DEEPSEEK_RELEASE_RECEIPT_HOST_FILE=${GITHUB_WORKSPACE}/OpenScience/deploy/web/secrets/deepseek-release-receipt.json" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_DOCKER_SOCKET_GID=$(stat -c '%g' /var/run/docker.sock)" >> "$GITHUB_ENV"

      - name: Write CI Compose environment
        run: |
          mkdir -p deploy/web/secrets
          umask 077
          printf '%s\n' 'ci-fake-evimed-evidence-key-no-external-calls' > deploy/web/secrets/evimed-api-key.txt
          printf '%s\n' 'ci-fake-deepseek-key-no-external-calls' > deploy/web/secrets/deepseek-api-key.txt
          printf '%s\n' 'ci-model-gateway-signing-secret-0123456789abcdef' > deploy/web/secrets/model-gateway-signing-key.txt
          printf '%s\n' 'ci-fake-materials-project-key-no-external-calls' > deploy/web/secrets/materials-project-api-key.txt
          printf '%s\n' 'ci-evimed-workload-signing-secret-0123456789abcdef' > deploy/web/secrets/evimed-workload-signing-key.txt
          printf '%s\n' '{}' > deploy/web/secrets/deepseek-release-receipt.json
          {
            echo "NODE_ENV=production"
            echo "OPEN_SCIENCE_PUBLIC_URL=https://localhost"
            echo "OPEN_SCIENCE_DOMAIN=localhost"
            echo "OPEN_SCIENCE_CADDY_VERSION=${OPEN_SCIENCE_CADDY_VERSION}"
            echo "OPEN_SCIENCE_PREFLIGHT_MONITORING=true"
            echo "OPEN_SCIENCE_PREFLIGHT_ALERT_DELIVERY=false"
            echo "OPEN_SCIENCE_PREFLIGHT_OBJECT_STORAGE=false"
            echo "OPEN_SCIENCE_PREFLIGHT_MIN_FREE_BYTES=10737418240"
            echo "OPEN_SCIENCE_DATA_VOLUME=${OPEN_SCIENCE_DATA_VOLUME}"
            echo "OPEN_SCIENCE_POSTGRES_BACKUP_STATUS_DIR=${OPEN_SCIENCE_POSTGRES_BACKUP_STATUS_DIR}"
            echo "OPEN_SCIENCE_APP_VERSION=${OPEN_SCIENCE_APP_VERSION}"
            echo "OPEN_SCIENCE_RELEASE_ID=${OPEN_SCIENCE_RELEASE_ID}"
            echo "OPEN_SCIENCE_SOURCE_REVISION=${OPEN_SCIENCE_SOURCE_REVISION}"
            echo "OPEN_SCIENCE_BUILD_CREATED=${OPEN_SCIENCE_BUILD_CREATED}"
            echo "OPEN_SCIENCE_WEB_CONTAINER_IMAGE=${OPEN_SCIENCE_WEB_CONTAINER_IMAGE}"
            echo "OPEN_SCIENCE_RUNTIME_CONTAINER_IMAGE=${OPEN_SCIENCE_RUNTIME_CONTAINER_IMAGE}"
            echo "OPEN_SCIENCE_RELEASE_MANIFEST_HOST_FILE=./release-manifest.json"
            echo "OPEN_SCIENCE_DOCKER_SOCKET_GID=${OPEN_SCIENCE_DOCKER_SOCKET_GID}"
            echo "OPEN_SCIENCE_AUTH_MODE=local"
            echo "OPEN_SCIENCE_BOOTSTRAP_USER=ci-admin"
            echo "OPEN_SCIENCE_BOOTSTRAP_PASSWORD="
            echo "OPEN_SCIENCE_BOOTSTRAP_PASSWORD_FILE=${OPEN_SCIENCE_BOOTSTRAP_PASSWORD_FILE}"
            echo "OPEN_SCIENCE_PRODUCTION_STATE_SECRETS_DIR=${OPEN_SCIENCE_PRODUCTION_STATE_SECRETS_DIR}"
            echo "OPEN_SCIENCE_POSTGRES_PASSWORD_HOST_FILE=${OPEN_SCIENCE_POSTGRES_PASSWORD_HOST_FILE}"
            echo "OPEN_SCIENCE_DATABASE_URL_HOST_FILE=${OPEN_SCIENCE_DATABASE_URL_HOST_FILE}"
            echo "OPEN_SCIENCE_MEMOS_DSN_HOST_FILE=${OPEN_SCIENCE_MEMOS_DSN_HOST_FILE}"
            echo "OPEN_SCIENCE_MEMOS_ADMIN_PASSWORD_HOST_FILE=${OPEN_SCIENCE_MEMOS_ADMIN_PASSWORD_HOST_FILE}"
            echo "OPEN_SCIENCE_MEMOS_ADMIN_USER=evimed-memory"
            echo "OPEN_SCIENCE_MEMOS_PUBLIC_URL=https://localhost/memos"
            echo "OPEN_SCIENCE_OPERATOR_METRICS_TOKEN=${OPEN_SCIENCE_OPERATOR_METRICS_TOKEN}"
            echo "OPEN_SCIENCE_BACKUP_MODE=local"
            echo "OPEN_SCIENCE_BACKUP_ENCRYPTION_ACK=true"
            echo "OPEN_SCIENCE_BACKUP_DIR=/backups"
            echo "OPEN_SCIENCE_BACKUP_RETENTION_DAYS=7"
            echo "OPEN_SCIENCE_BACKUP_PASSPHRASE_FILE=${OPEN_SCIENCE_BACKUP_PASSPHRASE_FILE}"
            echo "OPEN_SCIENCE_BACKUP_INTERVAL_SECONDS=3600"
            echo "OPEN_SCIENCE_BACKUP_HEALTH_GRACE_SECONDS=600"
            echo "OPEN_SCIENCE_BACKUP_RETRY_SECONDS=10"
            echo "OPEN_SCIENCE_BACKUP_MAX_FAILURES=3"
            echo "OPEN_SCIENCE_BACKUP_RESTORE_DRILL_EVERY=1"
            echo "OPEN_SCIENCE_RESTORE_DRILL_ACK=true"
            echo "OPEN_SCIENCE_RUNTIME_MODE=kernel"
            echo "OPEN_SCIENCE_RUNTIME_SANDBOX_MODE=docker"
            echo "OPEN_SCIENCE_RUNTIME_TRANSPORT=unix"
            echo "OPEN_SCIENCE_RUNTIME_NETWORK_MODE=open-science-runtime-internal"
            echo "OPEN_SCIENCE_RUNTIME_INTERNAL_NETWORK_NAME=open-science-runtime-internal"
            echo "OPEN_SCIENCE_DEEPSEEK_PROVIDER_ENABLED=false"
            echo "OPEN_SCIENCE_REQUIRE_ALL_SPECIALIST_ADAPTERS=false"
            echo "OPEN_SCIENCE_DEEPSEEK_API_KEY_HOST_FILE=${OPEN_SCIENCE_DEEPSEEK_API_KEY_HOST_FILE}"
            echo "OPEN_SCIENCE_MODEL_GATEWAY_SIGNING_SECRET_HOST_FILE=${OPEN_SCIENCE_MODEL_GATEWAY_SIGNING_SECRET_HOST_FILE}"
            echo "OPEN_SCIENCE_MATERIALS_PROJECT_API_KEY_HOST_FILE=${OPEN_SCIENCE_MATERIALS_PROJECT_API_KEY_HOST_FILE}"
            echo "OPEN_SCIENCE_EVIMED_WORKLOAD_SIGNING_SECRET_HOST_FILE=${OPEN_SCIENCE_EVIMED_WORKLOAD_SIGNING_SECRET_HOST_FILE}"
            echo "OPEN_SCIENCE_DEEPSEEK_RELEASE_RECEIPT_HOST_FILE=${OPEN_SCIENCE_DEEPSEEK_RELEASE_RECEIPT_HOST_FILE}"
            echo "OPEN_SCIENCE_RUNTIME_REQUIRE_IMAGE_LOCAL=true"
            echo "OPEN_SCIENCE_ENABLE_KERNEL=true"
            echo "OPEN_SCIENCE_KERNEL_SANDBOX_MODE=docker"
            echo "OPEN_SCIENCE_TRUST_PROXY=true"
            echo "OPEN_SCIENCE_MONITORING_SECRETS_DIR=./secrets"
          } > deploy/web/.env.ci
          chmod 600 deploy/web/.env.ci

      - name: Generate and validate local-auth secret
        run: |
          pnpm configure:local-auth
          pnpm check:local-auth

      - name: Generate and validate PostgreSQL and Memos secrets
        run: |
          pnpm configure:production-state
          pnpm check:production-state

      - name: Reserve space on the disposable CI builder
        run: |
          # These preinstalled SDKs are unused by this Linux web/runtime build.
          # Never run this cleanup against a saved runner or a serving host.
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build hosted Web and agent runtime images
        env:
          OPEN_SCIENCE_MEMOS_ENGINE_PROVIDER_CONFIG_HOST_FILE: /tmp/ci-unused-memos-provider.json
          OPEN_SCIENCE_MEMOS_NEO4J_AUTH_HOST_FILE: /tmp/ci-unused-neo4j-auth
          OPEN_SCIENCE_DOCUMENT_PARSER_TOKEN_HOST_FILE: /tmp/ci-unused-parser-token
          OPEN_SCIENCE_OPENLIST_ADMIN_PASSWORD_HOST_FILE: /tmp/ci-unused-openlist-password
        run: |
          # This is an ephemeral CI builder, never the serving host. Stop before
          # builds or exports exhaust the filesystem; no production volume exists here.
          test "$(df -B1 --output=avail / | tail -1)" -ge 21474836480
          docker buildx create --name evimed-ci --driver docker-container --driver-opt default-load=true --use
          export BUILDX_BUILDER=evimed-ci
          extra_compose=(-f deploy/web/docker-compose.memos-engine.yml -f deploy/web/docker-compose.ingestion.yml)
          build_flags=()
          if [ "$EVIMED_FULL_RELEASE" = "true" ]; then
            build_flags=(--no-cache)
          fi
          docker compose --env-file deploy/web/.env.ci \
            -f deploy/web/docker-compose.yml \
            -f deploy/web/docker-compose.local-auth.yml \
            -f deploy/web/docker-compose.backup.yml \
            "${extra_compose[@]}" \
            --profile backup --profile runtime-image build "${build_flags[@]}" &
          build_pid=$!
          while kill -0 "$build_pid" 2>/dev/null; do
            if [ "$(df -B1 --output=avail / | tail -1)" -lt 10737418240 ]; then
              kill "$build_pid" 2>/dev/null || true
              timeout 15 docker buildx stop evimed-ci || true
              wait "$build_pid" || true
              echo "CI build stopped at the 10 GiB capacity floor" >&2
              exit 1
            fi
            sleep 5
          done
          wait "$build_pid"
          # Images were loaded into the daemon; discard only this job's owned
          # BuildKit cache before pulling dependencies or creating an archive.
          # Buildx's short API deadline expired deleting the full-build cache
          # after all twelve images had loaded. Remove that exact volume with
          # the Docker CLI under a separate bounded cleanup deadline.
          docker buildx rm --keep-state evimed-ci
          timeout 300 docker volume rm buildx_buildkit_evimed-ci0_state
          remaining_cache_volume="$(docker volume ls -q --filter name='^buildx_buildkit_evimed-ci0_state$')"
          test -z "$remaining_cache_volume"

      - name: Test Memos private DSN before privilege drop
        run: >-
          docker run --rm --network none --user 0 --entrypoint sh
          -v "$GITHUB_WORKSPACE/记忆模块/scripts:/entrypoint-tests:ro"
          evimed-memos:0.31.1-evimed /entrypoint-tests/entrypoint_test.sh

      # The kernel is installed as an npm global, not as a fetched binary, so
      # what is checked is that the launcher resolves, that its version is the
      # pinned one, and that the composed profile the image pre-initialized is
      # still there — a profile that failed to build at image time would
      # otherwise only surface as a container that starts and answers nothing.
      - name: Verify runtime binaries and preserved licenses
        run: >-
          docker run --rm --network none -e OPEN_SCIENCE_DSH_VERSION
          "${OPEN_SCIENCE_RUNTIME_CONTAINER_IMAGE}"
          sh -ec 'test -x /usr/local/bin/uv &&
          test -x /usr/local/bin/open-science-dsh-serve &&
          test -s /usr/share/licenses/uv/LICENSE-MIT &&
          test -s /opt/evimed/dump-config.baseline.json &&
          dsh --version &&
          test "$(node -p "require(\"/usr/local/lib/node_modules/@deepseek-ai/dsh/package.json\").version")" = "${OPEN_SCIENCE_DSH_VERSION}" &&
          uv --version'

      - name: Pull the pinned manifest dependencies
        run: |
          set -euo pipefail
          test "$(df -B1 --output=avail / | tail -1)" -ge 21474836480
          timeout 300 docker pull "caddy:${OPEN_SCIENCE_CADDY_VERSION}"
          mapfile -t images < <(node - <<'JS'
          const d = require('./deps-version.json');
          console.log(d.ollama.image + ':' + d.ollama.version + '@' + d.ollama.imageDigest);
          console.log(d.openlist.image + ':v' + d.openlist.version + '@' + d.openlist.imageDigest);
          JS
          )
          for image in "${images[@]}"; do
            test "$(df -B1 --output=avail / | tail -1)" -ge 21474836480
            timeout 900 docker pull "$image" &
            pull_pid=$!
            while kill -0 "$pull_pid" 2>/dev/null; do
              if [ "$(df -B1 --output=avail / | tail -1)" -lt 10737418240 ]; then
                kill "$pull_pid" 2>/dev/null || true
                wait "$pull_pid" || true
                echo "CI dependency pull stopped at the 10 GiB capacity floor" >&2
                exit 1
              fi
              sleep 5
            done
            wait "$pull_pid"
          done

      - name: Generate and verify deployment release manifest
        run: |
          pnpm release:manifest
          pnpm verify:release-manifest

      - name: Generate monitoring secrets
        run: |
          pnpm configure:monitoring
          node scripts/ops/configure-monitoring.mjs --prepare-container-secrets
          pnpm check:monitoring

      - name: Generate and validate backup secret
        run: |
          pnpm configure:backup
          chmod 0400 "$OPEN_SCIENCE_BACKUP_PASSPHRASE_FILE"
          pnpm check:backup

      - name: Retain the verified runtime image before preflight
        run: >-
          docker compose --env-file deploy/web/.env.ci
          -f deploy/web/docker-compose.yml
          --profile runtime-image up --no-build --pull never --no-start dsh-runtime-image

      - name: Verify production host prerequisites
        run: pnpm preflight:host --env-file deploy/web/.env.ci

      - name: Seed the synthetic CI pharmacy reference
        run: |
          # This test-only database stays in the disposable CI volume. It is
          # never placed in an image or in the full-release image artifact.
          python3 -B - <<'PYCODE'
          import hashlib, os, pathlib, sqlite3, sys
          sys.path.insert(0, 'runtime/mcp/evimed-research')
          from build_pharmacy_reference import DDL
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ci-pharmacy-reference.sqlite'
          with sqlite3.connect(output) as db:
              db.executescript(DDL)
              db.execute('INSERT INTO metadata VALUES (?, ?)', ('kind', 'synthetic-ci-fixture'))
              db.execute('INSERT INTO datasets VALUES (?, ?, ?, ?, ?)', ('ci-fixture', 'ci-fixture.csv', hashlib.sha256(b'synthetic-ci').hexdigest(), 1, '["label"]'))
              db.execute('INSERT INTO records VALUES (?, ?, ?, ?, ?)', (1, 'ci-fixture', 1, '{"label":"synthetic CI record, not clinical data"}', 'synthetic CI record'))
              db.execute("INSERT INTO records_fts(records_fts) VALUES ('rebuild')")
              assert db.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
          PYCODE
          docker volume create "$OPEN_SCIENCE_DATA_VOLUME"
          # Initialize the canonical empty user tree before the backup-first
          # startup dependency; restore integrity uses the actual archive inventory.
          docker run --rm --network none --user 0 --entrypoint sh \
            -v "${OPEN_SCIENCE_DATA_VOLUME}:/data" \
            -v "$RUNNER_TEMP/ci-pharmacy-reference.sqlite:/ci-fixture.sqlite:ro" \
            "$OPEN_SCIENCE_RUNTIME_CONTAINER_IMAGE" \
            -ec 'test ! -e /data/pharmacy-reference.sqlite; mkdir -p /data/users; chmod 700 /data/users; cp /ci-fixture.sqlite /data/pharmacy-reference.sqlite; chmod 444 /data/pharmacy-reference.sqlite'

      - name: Start production Compose stack
        run: >-
          docker compose --env-file deploy/web/.env.ci
          -f deploy/web/docker-compose.yml
          -f deploy/web/docker-compose.local-auth.yml
          -f deploy/web/docker-compose.backup.yml
          -f deploy/web/docker-compose.monitoring.yml
          --profile backup --profile monitoring --profile tls up -d

      - name: Verify actual PostgreSQL backup and restore before readiness
        run: |
          # Liveness starts after application initialization; readiness itself
          # requires the real backup receipt that this step is about to create.
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null; then
              break
            fi
            test "$attempt" -lt 90 || exit 1
            sleep 2
          done
          EVIMED_POSTGRES_BACKUP_DIR="$RUNNER_TEMP/evimed-postgres-backup" \
          EVIMED_POSTGRES_PASSPHRASE_FILE="$OPEN_SCIENCE_BACKUP_PASSPHRASE_FILE" \
            python3 -B scripts/ops/postgres-backup.py

      - name: Wait for API and monitoring readiness
        run: |
          compose=(docker compose --env-file deploy/web/.env.ci -f deploy/web/docker-compose.yml -f deploy/web/docker-compose.local-auth.yml -f deploy/web/docker-compose.backup.yml -f deploy/web/docker-compose.monitoring.yml --profile backup --profile monitoring --profile tls)
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8787/api/ready >/dev/null \
              && curl -kfsS https://localhost/api/ready >/dev/null \
              && curl -fsS http://127.0.0.1:9090/-/ready >/dev/null \
              && curl -fsS http://127.0.0.1:9093/-/ready >/dev/null \
              && curl -fsS http://127.0.0.1:3000/api/health >/dev/null \
              && "${compose[@]}" exec -T open-science-backup node scripts/ops/backup-scheduler.mjs health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          "${compose[@]}" ps
          exit 1

      - name: Trust CI Caddy root and verify public HTTPS preflight
        run: |
          compose=(docker compose --env-file deploy/web/.env.ci -f deploy/web/docker-compose.yml -f deploy/web/docker-compose.local-auth.yml -f deploy/web/docker-compose.backup.yml -f deploy/web/docker-compose.monitoring.yml --profile backup --profile monitoring --profile tls)
          "${compose[@]}" cp caddy:/data/caddy/pki/authorities/local/root.crt /tmp/open-science-caddy-root.crt
          test -s /tmp/open-science-caddy-root.crt
          NODE_EXTRA_CA_CERTS=/tmp/open-science-caddy-root.crt pnpm preflight:host --env-file deploy/web/.env.ci --online

      - name: Verify Docker socket privilege boundary
        run: |
          compose=(docker compose --env-file deploy/web/.env.ci -f deploy/web/docker-compose.yml -f deploy/web/docker-compose.local-auth.yml -f deploy/web/docker-compose.backup.yml -f deploy/web/docker-compose.monitoring.yml --profile backup --profile monitoring --profile tls)
          web_id="$("${compose[@]}" ps -q open-science-web)"
          controller_id="$("${compose[@]}" ps -q open-science-runtime-controller)"
          backup_id="$("${compose[@]}" ps -q open-science-backup)"
          test -n "$web_id" && test -n "$controller_id" && test -n "$backup_id"
          if [ "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$web_id")" != "true" ]; then
            echo "Web API root filesystem must be read-only" >&2
            exit 1
          fi
          docker inspect --format '{{range .HostConfig.CapDrop}}{{println .}}{{end}}' "$web_id" | grep -Fx ALL
          docker inspect --format '{{range .HostConfig.SecurityOpt}}{{println .}}{{end}}' "$web_id" | grep -Fx no-new-privileges:true
          if docker inspect --format '{{range .Mounts}}{{println .Destination}}{{end}}' "$web_id" | grep -Fx /var/run/docker.sock; then
            echo "Web API container must not mount /var/run/docker.sock" >&2
            exit 1
          fi
          control_mount_rw="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/run/open-science-controller"}}{{.RW}}{{end}}{{end}}' "$web_id")"
          if [ "$control_mount_rw" != "false" ]; then
            echo "Web API controller mount must be read-only" >&2
            exit 1
          fi
          docker inspect --format '{{range .Mounts}}{{println .Destination}}{{end}}' "$controller_id" | grep -Fx /var/run/docker.sock
          docker inspect --format '{{range .HostConfig.GroupAdd}}{{println .}}{{end}}' "$controller_id" | grep -Fx "$OPEN_SCIENCE_DOCKER_SOCKET_GID"
          if docker inspect --format '{{range .Mounts}}{{println .Destination}}{{end}}' "$backup_id" | grep -Fx /var/run/docker.sock; then
            echo "Backup container must not mount /var/run/docker.sock" >&2
            exit 1
          fi
          test "$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/backups"}}{{.RW}}{{end}}{{end}}' "$web_id")" = "false"
          test "$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/data"}}{{.RW}}{{end}}{{end}}' "$backup_id")" = "false"
          "${compose[@]}" exec -T open-science-web test -S /run/open-science-controller/controller.sock

      - name: Smoke real hosted runtime and kernel boundaries
        env:
          NODE_EXTRA_CA_CERTS: /tmp/open-science-caddy-root.crt
          OPEN_SCIENCE_SMOKE_BASE_URL: https://localhost
          OPEN_SCIENCE_SMOKE_USERNAME: ci-admin
          OPEN_SCIENCE_SMOKE_METRICS_TOKEN_FILE: deploy/web/secrets/operator-metrics-token.txt
          OPEN_SCIENCE_SMOKE_RUNTIME: "true"
          OPEN_SCIENCE_SMOKE_RUNTIME_PROMPT: "false"
          OPEN_SCIENCE_SMOKE_KERNEL: "true"
          OPEN_SCIENCE_SMOKE_REQUIRE_DOCKER_KERNEL: "true"
        run: |
          OPEN_SCIENCE_SMOKE_PASSWORD="$(tr -d '\r\n' < deploy/web/secrets/bootstrap-password.txt)" \
            pnpm smoke:deployment

      - name: Verify runtime and kernel cleanup
        run: |
          test -z "$(docker ps -aq --filter label=open-science.web.runtime=true)"
          test -z "$(docker ps -aq --filter label=open-science.web.kernel=true)"

      - name: Verify scheduled encrypted backup
        run: >-
          docker compose --env-file deploy/web/.env.ci
          -f deploy/web/docker-compose.yml
          -f deploy/web/docker-compose.local-auth.yml
          -f deploy/web/docker-compose.backup.yml
          --profile backup exec -T open-science-backup
          node -e "const fs=require('node:fs');const names=fs.readdirSync('/backups');process.exit(names.some(n=>n.endsWith('.tar.gz.enc'))&&names.includes('.open-science-backup-state.json')?0:1)"

      - name: Package verified full-release images
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/release-') && contains(github.event.head_commit.message, '[full-release]')
        env:
          OPEN_SCIENCE_MEMOS_ENGINE_PROVIDER_CONFIG_HOST_FILE: /tmp/ci-unused-memos-provider.json
          OPEN_SCIENCE_MEMOS_NEO4J_AUTH_HOST_FILE: /tmp/ci-unused-neo4j-auth
          OPEN_SCIENCE_DOCUMENT_PARSER_TOKEN_HOST_FILE: /tmp/ci-unused-parser-token
          OPEN_SCIENCE_OPENLIST_ADMIN_PASSWORD_HOST_FILE: /tmp/ci-unused-openlist-password
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evimed-release"
          docker compose --env-file deploy/web/.env.ci \
            -f deploy/web/docker-compose.yml \
            -f deploy/web/docker-compose.local-auth.yml \
            -f deploy/web/docker-compose.backup.yml \
            -f deploy/web/docker-compose.memos-engine.yml \
            -f deploy/web/docker-compose.ingestion.yml \
            --profile backup --profile runtime-image config --format json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("\n".join(sorted({s["image"] for s in d["services"].values() if s.get("build") and (not s.get("profiles") or set(s["profiles"]) & {"backup", "runtime-image"})})))' \
            > "$RUNNER_TEMP/evimed-release/images.txt"
          test -s "$RUNNER_TEMP/evimed-release/images.txt"
          export EVIMED_IMAGE_LIST="$RUNNER_TEMP/evimed-release/images.txt"
          export EVIMED_IMAGE_ARCHIVE="$RUNNER_TEMP/evimed-release/images.tar.gz"
          test "$(df -B1 --output=avail / | tail -1)" -ge 21474836480
          setsid bash -euo pipefail -c 'mapfile -t images < "$EVIMED_IMAGE_LIST"; docker save "${images[@]}" | gzip -1 > "$EVIMED_IMAGE_ARCHIVE"' &
          export_pid=$!
          while kill -0 "$export_pid" 2>/dev/null; do
            if [ "$(df -B1 --output=avail / | tail -1)" -lt 10737418240 ]; then
              kill -- "-$export_pid" 2>/dev/null || true
              wait "$export_pid" || true
              echo "CI export stopped at the 10 GiB capacity floor" >&2
              exit 1
            fi
            sleep 5
          done
          wait "$export_pid"
          gzip -t "$EVIMED_IMAGE_ARCHIVE"
          (cd "$RUNNER_TEMP/evimed-release" && sha256sum images.tar.gz > images.tar.gz.sha256)
          python3 - <<'PY'
          import hashlib, json, os, pathlib, tarfile
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "evimed-release"
          with tarfile.open(root / "images.tar.gz", "r:gz") as archive:
              manifest = json.load(archive.extractfile("manifest.json"))
              images = []
              for entry in manifest:
                  content = archive.extractfile(entry["Config"]).read()
                  config = json.loads(content)
                  images.append({"references": entry["RepoTags"], "configDigest": "sha256:" + hashlib.sha256(content).hexdigest(),
                                 "platform": config.get("os", "") + "/" + config.get("architecture", ""),
                                 "rootfs": config.get("rootfs"), "labels": config.get("config", {}).get("Labels", {})})
          report = {"sourceRevision": os.environ["GITHUB_SHA"], "releaseId": os.environ["OPEN_SCIENCE_RELEASE_ID"],
                    "workflowRun": os.environ["GITHUB_RUN_ID"], "workflowAttempt": os.environ["GITHUB_RUN_ATTEMPT"], "images": images}
          (root / "manifest.json").write_text(json.dumps(report, indent=2) + "\n")
          PY

      - name: Upload verified full-release images
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/release-') && contains(github.event.head_commit.message, '[full-release]')
        uses: actions/upload-artifact@v4
        with:
          name: evimed-full-release-${{ github.sha }}
          path: ${{ runner.temp }}/evimed-release/
          compression-level: 0
          retention-days: 3

      - name: Print Compose logs on failure
        if: failure()
        run: >-
          docker compose --env-file deploy/web/.env.ci
          -f deploy/web/docker-compose.yml
          -f deploy/web/docker-compose.local-auth.yml
          -f deploy/web/docker-compose.backup.yml
          -f deploy/web/docker-compose.monitoring.yml
          --profile backup --profile monitoring --profile tls logs --no-color

      - name: Stop Compose stack
        if: always()
        run: >-
          docker compose --env-file deploy/web/.env.ci
          -f deploy/web/docker-compose.yml
          -f deploy/web/docker-compose.local-auth.yml
          -f deploy/web/docker-compose.backup.yml
          -f deploy/web/docker-compose.monitoring.yml
          --profile runtime-image --profile backup --profile monitoring --profile tls down -v --remove-orphans

  hosted-production-e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: OpenScience/package.json

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test real deployed agent runtime, DeepSeek, specialist, Memos, RAG, and kernels
        env:
          OPEN_SCIENCE_E2E_BASE_URL: ${{ secrets.OPEN_SCIENCE_E2E_BASE_URL }}
          OPEN_SCIENCE_E2E_USERNAME: ${{ secrets.OPEN_SCIENCE_E2E_USERNAME }}
          OPEN_SCIENCE_E2E_PASSWORD: ${{ secrets.OPEN_SCIENCE_E2E_PASSWORD }}
        run: pnpm test:web:e2e
