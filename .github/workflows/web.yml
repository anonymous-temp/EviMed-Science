name: web

on:
  pull_request:
  push:
    branches: ["main", "master", "codex/**"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: OpenScience

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    services:
      postgres:
        # The production image (deps-version.json `pgvector`), so the
        # knowledge-base index's vector leg is tested where it will run.
        image: pgvector/pgvector:0.8.6-pg16-bookworm@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: evimed_test_auth
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: Install test system dependencies
        run: |
          sudo apt-get update
          # Jammy keeps the math faces in fonts-texgyre; the runtime's newer
          # Debian/Ubuntu bases split them into fonts-texgyre-math.
          sudo apt-get install -y python3 python3-pip python3-venv postgresql-client python3-yaml python3-cryptography r-base-core libgmp10 zlib1g fonts-noto-cjk fonts-texgyre ripgrep
          # Match the scientific imports exercised by deployment-smoke with
          # the reviewed versions shipped in deploy/runtime-dsh/Dockerfile.
          python3 -m pip install numpy==2.2.6 pandas==2.2.3 scipy==1.15.3

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: OpenScience/package.json

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
          cache-dependency-path: OpenScience/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the runtime document renderer
        shell: bash
        run: |
          python3 -m venv --system-site-packages "$RUNNER_TEMP/evimed-renderer"
          "$RUNNER_TEMP/evimed-renderer/bin/python" -m pip install Pillow==10.4.0 playwright==1.58.0 pypdf==6.7.0
          echo "$RUNNER_TEMP/evimed-renderer/bin" >> "$GITHUB_PATH"
          pandoc_version="$(node -p 'require("./deps-version.json").$runtimeTools.pandoc.version')"
          pandoc_amd64="$(node -p 'require("./deps-version.json").$runtimeTools.pandoc.debSha256.amd64')"
          pandoc_arm64="$(node -p 'require("./deps-version.json").$runtimeTools.pandoc.debSha256.arm64')"
          sudo env PANDOC_VERSION="$pandoc_version" PANDOC_SHA256_AMD64="$pandoc_amd64" PANDOC_SHA256_ARM64="$pandoc_arm64" \
            bash deploy/runtime-dsh/install-runtime.sh renderer
          sudo env PATH="$RUNNER_TEMP/evimed-renderer/bin:$PATH" bash deploy/runtime-dsh/install-runtime.sh browser
          sudo env PATH="$RUNNER_TEMP/evimed-renderer/bin:$PATH" bash deploy/runtime-dsh/install-runtime.sh verify-tools

      - name: Fetch bundled ai4s-skills pack
        shell: bash
        run: bash scripts/dev/fetch-skills.sh

      - name: Build and smoke the pinned public dataset
        run: python3 runtime/mcp/evimed-research/build_sider_cache.py

      - name: Test domain, port, socket and upstream contracts
        run: CI=true pnpm test:packages

      # Every test file under `evals/capability-audit/` is named here, because
      # `unittest discover` is given a literal filename per script and a file
      # nobody names is collected by nothing. `deploy.test.mjs` fails if a
      # `test_*.py` lands there without a script, and the `ci:web` step list
      # test fails if a script lands without a step here.
      - name: Test the capability audit suites
        run: |
          pnpm test:acceptance-ledger
          pnpm test:eval-briefs
          pnpm test:specialist-driver
          pnpm test:release-audit
          pnpm test:judge-sites
          pnpm test:phi-masking

      # The host scripts under `scripts/ops/` (the Postgres backup, the recovery
      # volume, the image archive inventory, the usememos retirement) carry
      # their own Python suites, and until this step nothing ran them: a
      # regression in the backup script would first be seen on the host.
      # `deploy.test.mjs` fails if a `test_*.py` lands there that `test:ops`
      # does not collect.
      - name: Test the ops scripts
        run: pnpm test:ops

      # The design language has one table and six generated artifacts, read by
      # this repository AND by the Vue shell in another one. A generated file
      # nobody checks is exactly how the two tables drifted before there was a
      # generator, so a stale artifact fails here, and so does a contrast
      # promise the table stopped keeping.
      - name: Check the design tokens
        run: |
          pnpm tokens:check
          CI=true pnpm test:tokens
          pnpm lint:tokens
          pnpm typecheck:tokens

      # The DTCG export against the community group's own schemas (spec §11.6,
      # appendix E.6 #11). The rules are also written down as code
      # (dtcgFormat.test.mjs, above, no network); this adds the published
      # 2025.10 files, fetched here so the test itself never reaches the
      # network and the package gains no dependency. A download that fails is
      # a warning — the export did not change — and a schema that was fetched
      # and does not validate fails the job.
      - name: Validate the DTCG export against the official schema
        shell: bash
        run: |
          dir="$RUNNER_TEMP/dtcg-2025.10"
          mkdir -p "$dir"
          fetched=true
          for name in format resolver; do
            curl -fsSL --retry 3 --max-time 30 -o "$dir/$name.json" "https://www.designtokens.org/schemas/2025.10/$name.json" \
              && node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$dir/$name.json" \
              || fetched=false
          done
          if [ "$fetched" != true ]; then
            echo "::warning::The DTCG 2025.10 schemas could not be downloaded; the export was checked against the rules in dtcgFormat.test.mjs only."
            exit 0
          fi
          sha256sum "$dir"/*.json
          DTCG_SCHEMA_DIR="$dir" node --test packages/design-tokens/test/dtcgSchema.test.mjs

      - name: Check generated artifacts are current
        run: |
          pnpm check:capabilities
          pnpm check:skill-vocabulary
          pnpm check:skill-digests
          pnpm check:skill-packages
          pnpm check:composition-references
          pnpm check:kernel-defaults
          pnpm check:pin-inventory

      # The gates `ci:web` runs and this workflow did not. CI is the only thing
      # standing on PRs and main, and it ran no ESLint at all: a lint failure, a
      # server type error, a committed secret, an unvendored community skill or
      # a SaaS-alignment drift could all merge. `apps/server/test/deploy.test.mjs`
      # now fails if this list falls behind `ci:web` again.
      - name: Lint, typecheck and audit
        run: |
          pnpm lint
          pnpm typecheck:domain
          pnpm typecheck:port
          pnpm typecheck:socket
          pnpm typecheck:server
          pnpm audit:source-secrets
          pnpm check:community-skills
          pnpm audit:saas-alignment

      # The CDISC pilot's ADTTE is the one real, SAS-written ADaM file the import is checked against,
      # and CDISC's terms forbid modifying it, so it is downloaded here and never committed
      # (`runtime/mcp/evimed-research/test/fixtures/vcr_imports/provenance.json`). The reference
      # check names it through EVIMED_CDISC_PILOT_ADTTE and skips when the variable is unset, so a
      # download that fails or does not match the pinned digest leaves the check skipped, not red.
      - name: Fetch the CDISC pilot ADTTE for the ADaM import's reference check
        continue-on-error: true
        run: |
          set -u
          target="$RUNNER_TEMP/cdiscpilot-adtte.xpt"
          curl --fail --silent --show-error --location --retry 3 --max-time 60 --output "$target" \
            "https://raw.githubusercontent.com/cdisc-org/sdtm-adam-pilot-project/master/updated-pilot-submission-package/900172/m5/datasets/cdiscpilot01/analysis/adam/datasets/adtte.xpt"
          echo "68513fc4126744b6b2c7328eb70eb7b9683865d12c58b36539325f3c0c0ab93d  $target" | sha256sum --check --status
          echo "EVIMED_CDISC_PILOT_ADTTE=$target" >> "$GITHUB_ENV"

      - name: Test Hosted Web API
        run: |
          CI=true pnpm test:mcp
          CI=true pnpm --filter @ai4s/server test

      - name: Test actual managed browser frame isolation
        env:
          OPEN_SCIENCE_MANAGED_BROWSER_TEST_CHROME: /usr/bin/chromium
          EVIMED_MANAGED_BROWSER_DOM: "1"
        run: |
          test -x "$OPEN_SCIENCE_MANAGED_BROWSER_TEST_CHROME"
          node --test --test-concurrency=1 apps/server/test/managedBrowserService.integration.test.mjs apps/server/test/managedBrowserHttp.integration.test.mjs packages/harness-port/test/runtimeUiManagedBrowser.chromium.test.mjs

      - name: Test shared authentication state
        env:
          OPEN_SCIENCE_TEST_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/evimed_test_auth
        run: node --test apps/server/test/postgresStore.integration.test.mjs

      - name: Prepare immutable extension acceptance inputs
        timeout-minutes: 35
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import { prepareExtensionAcceptance } from './scripts/ops/prepare-extension-acceptance.mjs';
          import { readAcceptanceInputs, readPreparedCatalogueSnapshot } from './scripts/ops/extension-saas-acceptance-inputs.mjs';
          const prepared = await prepareExtensionAcceptance({ platform: 'linux/amd64' });
          const inputs = await readAcceptanceInputs(prepared.inputsFile);
          await readPreparedCatalogueSnapshot(inputs);
          const values = {
            EVIMED_EXTENSION_ACCEPTANCE_INPUTS: prepared.inputsFile,
            COWORK_TEST_IMAGE: inputs.images.coworkImageId,
            COWORK_TEST_INTEGRITY: inputs.artifact.integrity,
            COWORK_TEST_CLOSURE_SHA256: inputs.artifact.closureExpectedSHA,
            NATIVE_SKILL_VALIDATOR_IMAGE: inputs.images.nativeSdkImageId,
            NATIVE_EXTENSION_TEST_IMAGE: inputs.images.nativeKernelImageId,
            NATIVE_SKILL_CATALOGUE_SNAPSHOT: path.join(inputs.preparedRoot, inputs.fixtures.catalogueSnapshotPath),
            OPEN_SCIENCE_TEST_PERSONAL_SKILL_IMAGE: inputs.images.nativeSdkImageId,
            EVIMED_SKILL_VALIDATION_TEST_IMAGE: inputs.images.nativeSdkImageId,
            EVIMED_SKILL_VALIDATION_TEST_DATA: path.resolve('../.evimed-local/extensions/build/fixtures'),
          };
          if (Object.values(values).some(value => typeof value !== 'string' || /[\r\n]/.test(value))) throw new Error('Invalid prepared CI inputs');
          await fs.appendFile(process.env.GITHUB_ENV, Object.entries(values).map(([key, value]) => `${key}=${value}\n`).join(''));
          NODE

      - name: Test durable product state
        env:
          OPEN_SCIENCE_TEST_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/evimed_test_product
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -c 'CREATE DATABASE evimed_test_product'
          node scripts/ops/test-product-state.mjs

      # Placed before the extension steps: it depends on none of them, and a
      # red extension step would otherwise skip the only database run two of
      # these suites get.
      # Financial policy activation and retries intentionally touch a whole
      # ledger. Keep each billing suite in its own disposable database.
      - name: Test research billing with isolated account and wallet state
        shell: bash
        run: |
          for suite in settlement http store composition; do
            psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE evimed_test_billing_${suite}"
          done
          OPEN_SCIENCE_TEST_POSTGRES_URL=postgresql://postgres@127.0.0.1:5432/evimed_test_billing_settlement \
            node --test --test-concurrency=1 apps/server/test/evimedCredits.integration.test.mjs apps/server/test/researchBillingReview.test.mjs
          OPEN_SCIENCE_TEST_POSTGRES_URL=postgresql://postgres@127.0.0.1:5432/evimed_test_billing_http \
            node --test apps/server/test/researchAllowance.integration.test.mjs
          OPEN_SCIENCE_TEST_POSTGRES_URL=postgresql://postgres@127.0.0.1:5432/evimed_test_billing_store \
            node --test apps/server/test/projectAccountGeneration.test.mjs
          OPEN_SCIENCE_TEST_POSTGRES_URL=postgresql://postgres@127.0.0.1:5432/evimed_test_billing_composition \
            node --test apps/server/test/researchBillingComposition.test.mjs

      - name: Test actual contained and native extension boundaries
        timeout-minutes: 10
        env:
          OPEN_SCIENCE_TEST_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/evimed_test_product
        run: |
          node --test --test-concurrency=1 --test-timeout=180000 \
            apps/server/test/extensionOperation.docker.test.mjs \
            apps/server/test/extensionToolController.docker.test.mjs \
            apps/server/test/extensionNativeRuntime.docker.test.mjs
          node --test --test-concurrency=1 --test-timeout=180000 \
            scripts/ops/test/prepareExtensionAcceptance.test.mjs \
            scripts/ops/test/extensionSaas*.test.mjs
          node scripts/ops/extension-saas-acceptance.mjs > "$RUNNER_TEMP/extension-boundary-campaign.json"

      - name: Export exact prepared extension assessment images
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/release-') && contains(github.event.head_commit.message, '[full-release]')
        timeout-minutes: 20
        run: |
          set -euo pipefail
          node scripts/ops/export-extension-acceptance-inputs.mjs
          export EVIMED_ASSESSMENT_EXPORT="$RUNNER_TEMP/evimed-extension-assessment"
          # One export deduplicates the SDK/kernel identity and all shared layers.
          test "$(df -B1 --output=avail / | tail -1)" -ge 10737418240
          setsid bash -euo pipefail -c 'mapfile -t images < "$EVIMED_ASSESSMENT_EXPORT/images.txt"; docker save "${images[@]}" | gzip -1 > "$EVIMED_ASSESSMENT_EXPORT/images.tar.gz"' &
          export_pid=$!
          export_started=$SECONDS
          trap 'kill -- "-$export_pid" 2>/dev/null || true; wait "$export_pid" || true' EXIT
          while kill -0 "$export_pid" 2>/dev/null; do
            if [ "$(df -B1 --output=avail / | tail -1)" -lt 5368709120 ] || \
               [ "$(stat -c %s "$EVIMED_ASSESSMENT_EXPORT/images.tar.gz" 2>/dev/null || echo 0)" -gt 3221225472 ] || \
               [ "$((SECONDS - export_started))" -gt 900 ]; then
              echo "Assessment export exceeded its capacity, byte or time bound" >&2
              exit 1
            fi
            sleep 5
          done
          wait "$export_pid"
          trap - EXIT
          chmod 400 "$EVIMED_ASSESSMENT_EXPORT/images.tar.gz"
          python3 scripts/ops/extension-acceptance-archive.py

      - name: Upload prepared extension assessment closure
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/release-') && contains(github.event.head_commit.message, '[full-release]')
        uses: actions/upload-artifact@v4
        with:
          name: evimed-extension-assessment-${{ github.sha }}
          path: ${{ runner.temp }}/evimed-extension-assessment/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Retain extension component evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-component-evidence-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/extension-boundary-campaign.json
            .evimed-local/extensions/acceptance-preparation/run-*/publication-*/acceptance-inputs.json
            .evimed-local/extensions/acceptance-preparation/run-*/publication-*/preparation-record.json
            .evimed-local/extensions/acceptance-preparation/run-*/recovery-required.json
            .evimed-local/extensions/acceptance-preparation/run-*/logs/*.log

      - name: Test DeepSeek compatibility and release gates
        run: >-
          CI=true pnpm --filter @ai4s/server exec node --test
          test/deepseekCompatibility.test.mjs
          test/deepseekKernelReleaseGate.test.mjs

      - name: Test mock hosted API contract
        run: CI=true pnpm --filter @ai4s/server test:contract

      - name: Audit hosted compliance and monitoring baseline
        run: pnpm audit:hosted-compliance

      - name: Audit production dependencies
        run: pnpm audit:dependencies

      - name: Typecheck frontend
        run: pnpm --filter @ai4s/web typecheck

      - name: Test frontend
        run: CI=true pnpm --filter @ai4s/web test

      - name: Build hosted frontend
        run: CI=true VITE_OPEN_SCIENCE_API_URL=/api pnpm --filter @ai4s/web build

  # The component gallery, photographed in both themes and diffed against the
  # checked-in references (fusion plan §6.3, audit F-G9): changing a
  # component's look is a review with a picture in it, and a change nobody
  # re-recorded is a red check rather than a surprise three pages later.
  #
  # Same OS image and font package the references were recorded with
  # (Ubuntu 24.04, fonts-noto-cjk — the Chinese faces are system fonts by
  # design), and the same pinned playwright-core, installed outside the
  # lockfile: a browser download does not belong in every install or in the
  # runtime image. The page is a production build that registers /__gallery
  # (`VITE_EVIMED_GALLERY=1`, never deployed), served by `vite preview`.
  gallery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_CORE_VERSION: 1.58.2
      GALLERY_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4

      - name: Install the fonts the references were recorded with
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: OpenScience/package.json

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
          cache-dependency-path: OpenScience/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the pinned headless browser
        run: |
          npm install --prefix "$RUNNER_TEMP/playwright" --no-save --no-package-lock "playwright-core@${PLAYWRIGHT_CORE_VERSION}"
          node "$RUNNER_TEMP/playwright/node_modules/playwright-core/cli.js" install --with-deps chromium

      - name: Build and serve the gallery
        run: |
          CI=true VITE_EVIMED_GALLERY=1 VITE_OPEN_SCIENCE_API_URL=/api pnpm --filter @ai4s/web exec vite build --outDir dist-gallery
          nohup pnpm --filter @ai4s/web exec vite preview --outDir dist-gallery --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/gallery-preview.log" 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS -o /dev/null "$GALLERY_URL/__gallery" && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/gallery-preview.log"
          exit 1

      - name: Compare the gallery with its references
        env:
          OPEN_SCIENCE_PLAYWRIGHT_CORE: ${{ runner.temp }}/playwright/node_modules/playwright-core
        run: |
          pnpm gallery:check --url "$GALLERY_URL"
          pnpm gallery:check --url "$GALLERY_URL" --theme dark

      - name: Keep the photographs that did not match
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-${{ github.sha }}
          path: OpenScience/apps/web/src/test/__screenshots__/*.actual.png
          if-no-files-found: ignore

  # 「虚拟临研」's statistics engine (项目代码/vcr-engine), on the operating
  # system and R it ships with. Three jobs, because the R library is the slow
  # part and the two things that need it are independent:
  #
  #   vcr-r-library  builds the engine's R library from its two package locks
  #                  (Posit Package Manager's dated snapshot, as binaries where
  #                  it has them), proves the library is exactly the locks, and
  #                  caches it under a key made of what it is built from.
  #   vcr-engine     the engine's own suites on that library: every numeric
  #                  acceptance case (the ones the `web` job cannot run — they
  #                  need R, and 40-60 minutes), and the service's tests.
  #   vcr-seam       the two integration tests where the control plane meets
  #                  the real engine: they need R, the service's Python
  #                  requirements and a PostgreSQL, and are left out of the
  #                  `web` job's generic durable-state step for that reason.
  #
  # `VCR_ENGINE_TESTS=required` is what makes a missing R a red job here. On a
  # machine without R those tests skip, and a skipped test is a green run that
  # proved nothing; in these jobs there is no such machine. The R library's path
  # is `VCR_R_LIBS`, set once per job, with no default anywhere.
  vcr-r-library:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VCR_R_LIBS: ${{ github.workspace }}/.vcr-rlib
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      - name: Install R and the libraries the locked packages link against
        run: bash scripts/vcr/ci-system-deps.sh

      - name: Name the library by what it is built from
        id: key
        run: echo "key=$(bash scripts/vcr/r-library.sh key)" >> "$GITHUB_OUTPUT"

      - name: Restore the R library
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCR_R_LIBS }}
          key: ${{ steps.key.outputs.key }}

      # On a cache hit this installs nothing and only proves the restored
      # library still is the locks and still loads on this image.
      - name: Install what the locks need and prove the library is exactly the locks
        run: bash scripts/vcr/r-library.sh install

      - name: Keep the library
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCR_R_LIBS }}
          key: ${{ steps.key.outputs.key }}

  vcr-engine:
    needs: vcr-r-library
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      VCR_R_LIBS: ${{ github.workspace }}/.vcr-rlib
      VCR_ENGINE_TESTS: required
    steps:
      - uses: actions/checkout@v4

      - name: Install R and the libraries the locked packages link against
        run: bash scripts/vcr/ci-system-deps.sh

      - name: Restore the R library the previous job built
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCR_R_LIBS }}
          key: ${{ needs.vcr-r-library.outputs.key }}
          fail-on-cache-miss: true

      - name: Prove the library is exactly the locks
        run: bash scripts/vcr/r-library.sh verify

      # The protocol-agreement cases run the domain package under Node, and
      # there is no `pnpm install` here: the modules they import use Node's own
      # libraries only.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      # Every method the engine dispatches needs a reference case that the validation evidence can record. The deployed evidence once
      # covered 12 of 24 methods because a hand-written table named 15 cases and nothing noticed the rest; the methods are read from
      # the engine's own registry, so a method added later fails here, in seconds, and not after the numeric run.
      - name: Check every dispatched method has a reference case
        run: node scripts/vcr/check-method-references.mjs

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 项目代码/vcr-engine/requirements.txt

      # The service's own requirements, and the two test-only packages
      # requirements.txt leaves out on purpose.
      - name: Install the engine service's Python requirements
        run: python3 -m pip install -r ../项目代码/vcr-engine/requirements.txt pytest==8.4.2 httpx==0.28.1

      # The Parquet bridge is a child of R, and R prepends its own library directories to
      # LD_LIBRARY_PATH: a setup-python interpreter then loads the system libpython, starts
      # without its site-packages and cannot import what pip installed (measured on this
      # runner: the same python3 imports pyarrow from a shell and does not from inside R).
      # The image runs the system interpreter, so the cases do too.
      - name: Install pyarrow for the system interpreter the Parquet bridge runs under
        run: |
          /usr/bin/python3 -m pip install --user --break-system-packages "$(grep -E '^pyarrow==' ../项目代码/vcr-engine/requirements.txt)"
          /usr/bin/python3 -c "import pyarrow.parquet; print('system python has pyarrow', pyarrow.__version__)"

      # `shell: bash` is what makes the pipe to `tee` fail with the suite: the
      # default `bash -e` has no pipefail.
      - name: Run every numeric acceptance case
        working-directory: 项目代码/vcr-engine
        shell: bash
        run: |
          export VCR_TEST_CORES="$(nproc)"
          export VCR_PYTHON=/usr/bin/python3
          export VCR_NUMERICAL_EVIDENCE_FILE="$RUNNER_TEMP/vcr-numerical-evidence.json"
          bash tests/run_all.sh 2>&1 | tee "$RUNNER_TEMP/vcr-numeric.log"
          python3 - <<'PY'
          import importlib.util, json, os, pathlib
          root = pathlib.Path.cwd()
          # Import only to hash installed files; no engine or authenticated job is started.
          os.environ["VCR_ENGINE_INSECURE_DEV"] = "1"
          spec = importlib.util.spec_from_file_location("vcr_service", root / "service/app.py")
          module = importlib.util.module_from_spec(spec)
          import sys
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          report = pathlib.Path(os.environ["VCR_NUMERICAL_EVIDENCE_FILE"])
          value = json.loads(report.read_text())
          value["numericalSourceDigest"] = module.numerical_source_digest(root)
          if not value["numericalSourceDigest"]:
              raise RuntimeError("The physically installed numerical source identity is unavailable")
          report.write_text(json.dumps(value, ensure_ascii=False, indent=2) + "\n")
          PY

      # `run_all.sh` exits 0 for a run whose cases all passed, and a case that
      # cannot do its job may say so and pass. This is the check that a green
      # run ran every case and none of them skipped itself.
      - name: Check the run was whole
        run: bash scripts/vcr/check-numeric-log.sh "$RUNNER_TEMP/vcr-numeric.log"

      - name: Test the engine service
        working-directory: 项目代码/vcr-engine
        shell: bash
        run: |
          python3 -m pytest tests/service -q -rs 2>&1 | tee "$RUNNER_TEMP/vcr-service.log"
          if grep -E '^SKIPPED.*(Rscript|R library)' "$RUNNER_TEMP/vcr-service.log"; then
            echo "::error::the real-engine smoke test skipped itself; the R library is on this runner and it did not see it"
            exit 1
          fi

      - name: Preserve numerical validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: vcr-numerical-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/vcr-numerical-evidence.json
            ${{ runner.temp }}/vcr-numeric.log
            ${{ runner.temp }}/vcr-service.log
          if-no-files-found: error

  vcr-seam:
    needs: vcr-r-library
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VCR_R_LIBS: ${{ github.workspace }}/.vcr-rlib
      VCR_ENGINE_TESTS: required
      OPEN_SCIENCE_TEST_RESULT_ENGINES: "1"
      EVIMED_RESULT_REPLAY_SIGNED_VCR: "1"
      EVIMED_RESULT_REPLAY_PYTHON: ${{ github.workspace }}/.result-replay-venv/bin/python
    services:
      postgres:
        # The same image as the `web` job's: the production one.
        image: pgvector/pgvector:0.8.6-pg16-bookworm@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: evimed_test_vcr
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: Install R and the libraries the locked packages link against
        run: bash scripts/vcr/ci-system-deps.sh

      - name: Restore the R library the previous job built
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCR_R_LIBS }}
          key: ${{ needs.vcr-r-library.outputs.key }}
          fail-on-cache-miss: true

      - name: Prove the library is exactly the locks
        run: bash scripts/vcr/r-library.sh verify

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: OpenScience/package.json

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
          cache-dependency-path: OpenScience/pnpm-lock.yaml

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 项目代码/vcr-engine/requirements.txt

      - name: Install the engine service's Python requirements
        run: python3 -m pip install -r ../项目代码/vcr-engine/requirements.txt

      - name: Install the fixed Python numerical replay environment from existing locks
        shell: bash
        run: |
          python3 -m venv ../.result-replay-venv
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          selected = {}
          for filename, names in [('../项目代码/meta/requirements.lock', {'numpy', 'scipy', 'pandas', 'python-dateutil', 'pytz', 'tzdata', 'six'}),
                                  ('../项目代码/文献剂量分析/requirements.lock', {'networkx'})]:
              for line in Path(filename).read_text().splitlines():
                  match = re.fullmatch(r'([a-z0-9-]+)==([^ ]+)', line)
                  if match and match[1] in names:
                      selected[match[1]] = line
              if not names.issubset(selected):
                  raise SystemExit('The existing specialist lock lacks a numerical dependency.')
          Path(os.environ['RUNNER_TEMP'], 'result-replay-numeric.lock').write_text('\n'.join(selected[name] for name in sorted(selected)) + '\n')
          PY
          "$EVIMED_RESULT_REPLAY_PYTHON" -m pip install -r deploy/specialist-adapter/requirements.lock -r "$RUNNER_TEMP/result-replay-numeric.lock"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The release checklist rehearses the module's migration on a copy of
      # production with this script; here it runs on the empty test database, so
      # the script cannot rot between releases.
      - name: Rehearse the migration script
        run: node scripts/vcr/migrate-check.mjs postgresql://postgres@127.0.0.1:5432/evimed_test_vcr

      # Each file makes its own database beside this one, and both spawn the
      # real service and the real `run_job.R`. One at a time: the engine takes
      # the cores the runner has.
      - name: Test the control plane against the real engine
        env:
          OPEN_SCIENCE_TEST_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/evimed_test_vcr
          EVIMED_RESULT_REPLAY_EVIDENCE_DIR: ${{ runner.temp }}/result-replay-evidence
        shell: bash
        run: |
          node --test --test-concurrency=1 \
            apps/server/test/vcrEngineContract.integration.test.mjs \
            apps/server/test/vcrIntake.integration.test.mjs \
            apps/server/test/vcrKnowledgeEngine.integration.test.mjs
          NO_COLOR=1 node --test --test-reporter=spec --test-concurrency=1 \
            apps/server/test/resultReplayLifecycle.integration.test.mjs \
            2>&1 | tee "$RUNNER_TEMP/result-replay-five-paths.log"
          if ! grep -q '^ℹ skipped 0$' "$RUNNER_TEMP/result-replay-five-paths.log"; then
            echo "::error::the required five-path numerical replay proof did not complete without skips"
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['EVIMED_RESULT_REPLAY_EVIDENCE_DIR'])
          for method in ('meta.dl', 'faers.signals', 'bibliometric.network', 'design.analytic', 'comparator.evalue'):
              evidence = json.loads((root / f'{method}.evidence.json').read_text())
              if evidence['comparison']['numbers']['status'] != 'identical' or not evidence['originalRetained']:
                  raise SystemExit(f'{method}: the frozen-input replay did not preserve numerical agreement and original bytes')
              if method in ('design.analytic', 'comparator.evalue') and evidence['receipt']['signed'] is not True:
                  raise SystemExit(f'{method}: the real R HTTP receipt was not verified')
          PY

      - name: Preserve five-path numerical replay receipts and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-replay-five-paths-${{ github.sha }}
          path: |
            ${{ runner.temp }}/result-replay-five-paths.log
            ${{ runner.temp }}/result-replay-evidence
          if-no-files-found: error

  docker-hosted:
    runs-on: ubuntu-24.04
    needs: web
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        working-directory: OpenScience
        shell: /usr/local/bin/evimed-ci-root-shell {0}
    env:
      COMPOSE_PARALLEL_LIMIT: "1"
      EVIMED_FULL_RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/release-') && contains(github.event.head_commit.message, '[full-release]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: OpenScience/package.json

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Prepare the disposable Docker host operator shell
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          # Preserve the action-installed Node/pnpm PATH across sudo's secure_path.
          # Every subsequent run step owns and reads the same private 0600 files.
          cat > "$RUNNER_TEMP/evimed-ci-root-shell" <<'SH'
          #!/usr/bin/env bash
          exec sudo -E env "PATH=$PATH" bash --noprofile --norc -eo pipefail "$1"
          SH
          sudo install -o 0 -g 0 -m 0755 "$RUNNER_TEMP/evimed-ci-root-shell" /usr/local/bin/evimed-ci-root-shell

      - name: Install dependencies and pinned skills for this job
        run: |
          test "$(id -u)" = 0
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Keep the operator-owned store separate from setup-pnpm's user cleanup.
          pnpm install --frozen-lockfile --store-dir "$RUNNER_TEMP/evimed-ci-root-pnpm-store"
          bash scripts/dev/fetch-skills.sh

      - name: Verify full sandbox support before building images
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import os from 'node:os';
          import { validateSandboxPrerequisites } from './scripts/ops/host-preflight.mjs';
          console.log(validateSandboxPrerequisites(os.release(), fs.readFileSync('/sys/kernel/security/lsm', 'utf8')));
          JS

      - name: Define immutable CI release
        run: |
          echo "OPEN_SCIENCE_DATA_VOLUME=open-science-data" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_POSTGRES_BACKUP_STATUS_DIR=$RUNNER_TEMP/evimed-postgres-backup/status" >> "$GITHUB_ENV"
          install -d -m 0700 "$RUNNER_TEMP/evimed-postgres-backup"
          install -d -m 0755 "$RUNNER_TEMP/evimed-postgres-backup/status"
          echo "OPEN_SCIENCE_APP_VERSION=0.1.3" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_RELEASE_ID=evimed-${GITHUB_SHA:0:12}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_SOURCE_REVISION=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_BUILD_CREATED=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_WEB_CONTAINER_IMAGE=open-science-web:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          # One agent runtime image, under the one variable the server reads
          # (`config.mjs` resolves `runtimeContainerImage` from it and nothing
          # else). There were two names while two kernels shipped, and this one
          # carried the OpenCode image — so the control plane was handed a kernel
          # image that no longer exists while the DSH image sat under the other
          # name, verified by a later step and then never launched.
          echo "OPEN_SCIENCE_RUNTIME_CONTAINER_IMAGE=open-science-runtime:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_RESULT_REPLAY_IMAGE=evimed-result-replay:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_RESULT_ENGINE_URL=http://result-replay:8031" >> "$GITHUB_ENV"
          echo "EVIMED_VCR_ENGINE_IMAGE=evimed-vcr-engine:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_DSH_VERSION=$(node -p "require('./deps-version.json').dsh.version")" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_CADDY_VERSION=2.11.4-alpine" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_OPERATOR_METRICS_TOKEN=ci-metrics-token-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-0123456789abcdef" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_GRAFANA_ADMIN_PASSWORD=ci-grafana-password-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-0123456789" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_ALERT_WEBHOOK_URL=https://alerts.example.test/open-science-ci" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_BOOTSTRAP_PASSWORD_FILE=${GITHUB_WORKSPACE}/OpenScience/deploy/web/secrets/bootstrap-password.txt" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_BACKUP_PASSPHRASE_FILE=${GITHUB_WORKSPACE}/OpenScience/deploy/web/secrets/backup-passphrase.txt" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_PRODUCTION_STATE_SECRETS_DIR=${GITHUB_WORKSPACE}/OpenScience/deploy/web/secrets" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_POSTGRES_PASSWORD_HOST_FILE=${GITHUB_WORKSPACE}/OpenScience/deploy/web/secrets/postgres-password.txt" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_DATABASE_URL_HOST_FILE=${GITHUB_WORKSPACE}/OpenScience/deploy/web/secrets/database-url.txt" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_DOCUMENT_PARSER_TOKEN_HOST_FILE=${GITHUB_WORKSPACE}/OpenScience/deploy/web/secrets/document-parser.token" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_OPENLIST_ADMIN_PASSWORD_HOST_FILE=${GITHUB_WORKSPACE}/OpenScience/deploy/web/secrets/openlist-admin-password.txt" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_EVIMED_API_KEY_HOST_FILE=${GITHUB_WORKSPACE}/OpenScience/deploy/web/secrets/evimed-api-key.txt" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_DASHSCOPE_API_KEY_HOST_FILE=${GITHUB_WORKSPACE}/OpenScience/deploy/web/secrets/dashscope.api-key" >> "$GITHUB_ENV"
          # The recall index reads its configuration and its own key from two
          # bind mounts Compose refuses to interpolate without a path, so both
          # names have to exist before the first `docker compose` call, not only
          # before `configure:production-state` writes the files they point at.
          echo "OPEN_SCIENCE_OPENVIKING_CONF_HOST_FILE=${GITHUB_WORKSPACE}/OpenScience/deploy/web/secrets/openviking-ov.conf" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_OPENVIKING_API_KEY_HOST_FILE=${GITHUB_WORKSPACE}/OpenScience/deploy/web/secrets/openviking-api-key.txt" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_DEEPSEEK_API_KEY_HOST_FILE=${GITHUB_WORKSPACE}/OpenScience/deploy/web/secrets/deepseek-api-key.txt" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_MODEL_GATEWAY_SIGNING_SECRET_HOST_FILE=${GITHUB_WORKSPACE}/OpenScience/deploy/web/secrets/model-gateway-signing-key.txt" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_MATERIALS_PROJECT_API_KEY_HOST_FILE=${GITHUB_WORKSPACE}/OpenScience/deploy/web/secrets/materials-project-api-key.txt" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_EVIMED_WORKLOAD_SIGNING_SECRET_HOST_FILE=${GITHUB_WORKSPACE}/OpenScience/deploy/web/secrets/evimed-workload-signing-key.txt" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_DEEPSEEK_RELEASE_RECEIPT_HOST_FILE=${GITHUB_WORKSPACE}/OpenScience/deploy/web/secrets/deepseek-release-receipt.json" >> "$GITHUB_ENV"
          echo "OPEN_SCIENCE_DOCKER_SOCKET_GID=$(stat -c '%g' /var/run/docker.sock)" >> "$GITHUB_ENV"

      - name: Write CI Compose environment
        run: |
          mkdir -p deploy/web/secrets
          umask 077
          printf '%s\n' 'ci-fake-evimed-evidence-key-no-external-calls' > deploy/web/secrets/evimed-api-key.txt
          printf '%s\n' 'ci-fake-deepseek-key-no-external-calls' > deploy/web/secrets/deepseek-api-key.txt
          printf '%s\n' 'ci-model-gateway-signing-secret-0123456789abcdef' > deploy/web/secrets/model-gateway-signing-key.txt
          printf '%s\n' 'ci-fake-materials-project-key-no-external-calls' > deploy/web/secrets/materials-project-api-key.txt
          # The operator supplies this key in production; nothing generates it.
          # `configure:production-state` renders it into the recall index's
          # `ov.conf`, so the file has to exist before that step runs.
          printf '%s\n' 'ci-fake-dashscope-key-no-external-calls' > deploy/web/secrets/dashscope.api-key
          printf '%s\n' 'ci-evimed-workload-signing-secret-0123456789abcdef' > deploy/web/secrets/evimed-workload-signing-key.txt
          printf '%s\n' '{}' > deploy/web/secrets/deepseek-release-receipt.json
          {
            echo "NODE_ENV=production"
            echo "OPEN_SCIENCE_PUBLIC_URL=https://localhost"
            echo "OPEN_SCIENCE_DOMAIN=localhost"
            echo "OPEN_SCIENCE_CADDY_VERSION=${OPEN_SCIENCE_CADDY_VERSION}"
            echo "OPEN_SCIENCE_PREFLIGHT_MONITORING=true"
            echo "OPEN_SCIENCE_PREFLIGHT_ALERT_DELIVERY=false"
            echo "OPEN_SCIENCE_PREFLIGHT_OBJECT_STORAGE=false"
            echo "OPEN_SCIENCE_PREFLIGHT_MIN_FREE_BYTES=10737418240"
            echo "OPEN_SCIENCE_DATA_VOLUME=${OPEN_SCIENCE_DATA_VOLUME}"
            echo "OPEN_SCIENCE_POSTGRES_BACKUP_STATUS_DIR=${OPEN_SCIENCE_POSTGRES_BACKUP_STATUS_DIR}"
            echo "OPEN_SCIENCE_APP_VERSION=${OPEN_SCIENCE_APP_VERSION}"
            echo "OPEN_SCIENCE_RELEASE_ID=${OPEN_SCIENCE_RELEASE_ID}"
            echo "OPEN_SCIENCE_SOURCE_REVISION=${OPEN_SCIENCE_SOURCE_REVISION}"
            echo "OPEN_SCIENCE_BUILD_CREATED=${OPEN_SCIENCE_BUILD_CREATED}"
            echo "OPEN_SCIENCE_WEB_CONTAINER_IMAGE=${OPEN_SCIENCE_WEB_CONTAINER_IMAGE}"
            echo "OPEN_SCIENCE_RUNTIME_CONTAINER_IMAGE=${OPEN_SCIENCE_RUNTIME_CONTAINER_IMAGE}"
            echo "OPEN_SCIENCE_RESULT_REPLAY_IMAGE=${OPEN_SCIENCE_RESULT_REPLAY_IMAGE}"
            echo "OPEN_SCIENCE_RESULT_ENGINE_URL=${OPEN_SCIENCE_RESULT_ENGINE_URL}"
            echo "EVIMED_VCR_ENGINE_IMAGE=${EVIMED_VCR_ENGINE_IMAGE}"
            echo "OPEN_SCIENCE_VCR_ENABLED=false"
            echo "OPEN_SCIENCE_RELEASE_MANIFEST_HOST_FILE=./release-manifest.json"
            echo "OPEN_SCIENCE_DOCKER_SOCKET_GID=${OPEN_SCIENCE_DOCKER_SOCKET_GID}"
            echo "OPEN_SCIENCE_AUTH_MODE=local"
            echo "OPEN_SCIENCE_BOOTSTRAP_USER=ci-admin"
            echo "OPEN_SCIENCE_BOOTSTRAP_PASSWORD="
            echo "OPEN_SCIENCE_BOOTSTRAP_PASSWORD_FILE=${OPEN_SCIENCE_BOOTSTRAP_PASSWORD_FILE}"
            echo "OPEN_SCIENCE_PRODUCTION_STATE_SECRETS_DIR=${OPEN_SCIENCE_PRODUCTION_STATE_SECRETS_DIR}"
            echo "OPEN_SCIENCE_POSTGRES_PASSWORD_HOST_FILE=${OPEN_SCIENCE_POSTGRES_PASSWORD_HOST_FILE}"
            echo "OPEN_SCIENCE_DATABASE_URL_HOST_FILE=${OPEN_SCIENCE_DATABASE_URL_HOST_FILE}"
            echo "OPEN_SCIENCE_DOCUMENT_PARSER_TOKEN_HOST_FILE=${OPEN_SCIENCE_DOCUMENT_PARSER_TOKEN_HOST_FILE}"
            # The parser is the parser team's external, metered API and CI holds
            # no key for it, so readiness must not require it here. Production
            # keeps the requirement (the overlay's default is true).
            echo "OPEN_SCIENCE_REQUIRE_DOCUMENT_PARSER=false"
            echo "OPEN_SCIENCE_OPENLIST_ADMIN_PASSWORD_HOST_FILE=${OPEN_SCIENCE_OPENLIST_ADMIN_PASSWORD_HOST_FILE}"
            echo "OPEN_SCIENCE_DASHSCOPE_API_KEY_HOST_FILE=${OPEN_SCIENCE_DASHSCOPE_API_KEY_HOST_FILE}"
            echo "OPEN_SCIENCE_OPENVIKING_CONF_HOST_FILE=${OPEN_SCIENCE_OPENVIKING_CONF_HOST_FILE}"
            echo "OPEN_SCIENCE_OPENVIKING_API_KEY_HOST_FILE=${OPEN_SCIENCE_OPENVIKING_API_KEY_HOST_FILE}"
            echo "OPEN_SCIENCE_OPERATOR_METRICS_TOKEN=${OPEN_SCIENCE_OPERATOR_METRICS_TOKEN}"
            echo "OPEN_SCIENCE_BACKUP_MODE=local"
            echo "OPEN_SCIENCE_BACKUP_ENCRYPTION_ACK=true"
            echo "OPEN_SCIENCE_BACKUP_DIR=/backups"
            echo "OPEN_SCIENCE_BACKUP_RETENTION_DAYS=7"
            echo "OPEN_SCIENCE_BACKUP_PASSPHRASE_FILE=${OPEN_SCIENCE_BACKUP_PASSPHRASE_FILE}"
            echo "OPEN_SCIENCE_BACKUP_INTERVAL_SECONDS=3600"
            echo "OPEN_SCIENCE_BACKUP_HEALTH_GRACE_SECONDS=600"
            echo "OPEN_SCIENCE_BACKUP_RETRY_SECONDS=10"
            echo "OPEN_SCIENCE_BACKUP_MAX_FAILURES=3"
            echo "OPEN_SCIENCE_BACKUP_RESTORE_DRILL_EVERY=1"
            echo "OPEN_SCIENCE_RESTORE_DRILL_ACK=true"
            echo "OPEN_SCIENCE_RUNTIME_MODE=kernel"
            echo "OPEN_SCIENCE_RUNTIME_SANDBOX_MODE=docker"
            echo "OPEN_SCIENCE_RUNTIME_TRANSPORT=unix"
            echo "OPEN_SCIENCE_RUNTIME_NETWORK_MODE=open-science-runtime-internal"
            echo "OPEN_SCIENCE_RUNTIME_INTERNAL_NETWORK_NAME=open-science-runtime-internal"
            echo "OPEN_SCIENCE_DEEPSEEK_PROVIDER_ENABLED=false"
            echo "OPEN_SCIENCE_REQUIRE_ALL_SPECIALIST_ADAPTERS=false"
            echo "OPEN_SCIENCE_DEEPSEEK_API_KEY_HOST_FILE=${OPEN_SCIENCE_DEEPSEEK_API_KEY_HOST_FILE}"
            echo "OPEN_SCIENCE_MODEL_GATEWAY_SIGNING_SECRET_HOST_FILE=${OPEN_SCIENCE_MODEL_GATEWAY_SIGNING_SECRET_HOST_FILE}"
            echo "OPEN_SCIENCE_MATERIALS_PROJECT_API_KEY_HOST_FILE=${OPEN_SCIENCE_MATERIALS_PROJECT_API_KEY_HOST_FILE}"
            echo "OPEN_SCIENCE_EVIMED_WORKLOAD_SIGNING_SECRET_HOST_FILE=${OPEN_SCIENCE_EVIMED_WORKLOAD_SIGNING_SECRET_HOST_FILE}"
            echo "OPEN_SCIENCE_DEEPSEEK_RELEASE_RECEIPT_HOST_FILE=${OPEN_SCIENCE_DEEPSEEK_RELEASE_RECEIPT_HOST_FILE}"
            echo "OPEN_SCIENCE_RUNTIME_REQUIRE_IMAGE_LOCAL=true"
            echo "OPEN_SCIENCE_TRUST_PROXY=true"
            echo "OPEN_SCIENCE_MONITORING_SECRETS_DIR=./secrets"
          } > deploy/web/.env.ci
          chmod 600 deploy/web/.env.ci

      - name: Generate and validate local-auth secret
        run: |
          pnpm configure:local-auth
          pnpm check:local-auth

      - name: Generate and validate PostgreSQL and recall-index secrets
        run: |
          pnpm configure:production-state
          pnpm check:production-state

      - name: Prepare private ingestion credentials
        run: |
          python3 - <<'PY'
          import os, pathlib
          # No parser key exists in CI: the parsing API is an external service
          # whose own console issues keys. An empty owner-only file is exactly
          # what a deployment has before its key arrives — text formats parse
          # locally and every other format is refused with a stated reason.
          token_file = pathlib.Path(os.environ["OPEN_SCIENCE_DOCUMENT_PARSER_TOKEN_HOST_FILE"])
          fd = os.open(token_file, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o400)
          os.close(fd)
          info = token_file.stat()
          assert info.st_size == 0 and info.st_mode & 0o777 == 0o400
          assert info.st_uid == 0 and info.st_gid == 0
          PY

      - name: Reserve space on the disposable CI builder
        run: |
          # These preinstalled SDKs are unused by this Linux web/runtime build.
          # Never run this cleanup against a saved runner or a serving host.
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build hosted Web, agent runtime and deterministic replay images
        run: |
          # This is an ephemeral CI builder, never the serving host. Stop before
          # builds or exports exhaust the filesystem; no production volume exists here.
          test "$(df -B1 --output=avail / | tail -1)" -ge 21474836480
          docker buildx create --name evimed-ci --driver docker-container --driver-opt default-load=true --use
          export BUILDX_BUILDER=evimed-ci
          extra_compose=(-f deploy/web/docker-compose.ingestion.yml -f deploy/web/docker-compose.result-replay.yml)
          build_flags=()
          if [ "$EVIMED_FULL_RELEASE" = "true" ]; then
            build_flags=(--no-cache)
          fi
          docker compose --env-file deploy/web/.env.ci \
            -f deploy/web/docker-compose.yml \
            -f deploy/web/docker-compose.local-auth.yml \
            -f deploy/web/docker-compose.backup.yml \
            "${extra_compose[@]}" \
            --profile backup --profile runtime-image --profile vcr build "${build_flags[@]}" &
          build_pid=$!
          while kill -0 "$build_pid" 2>/dev/null; do
            if [ "$(df -B1 --output=avail / | tail -1)" -lt 10737418240 ]; then
              kill "$build_pid" 2>/dev/null || true
              timeout 15 docker buildx stop evimed-ci || true
              wait "$build_pid" || true
              echo "CI build stopped at the 10 GiB capacity floor" >&2
              exit 1
            fi
            sleep 5
          done
          wait "$build_pid"
          # Images were loaded into the daemon; discard only this job's owned
          # BuildKit cache before pulling dependencies or creating an archive.
          # Buildx's short API deadline expired deleting the full-build cache
          # after all built images had loaded. Remove that exact volume with
          # the Docker CLI under a separate bounded cleanup deadline.
          docker buildx rm --keep-state evimed-ci
          timeout 300 docker volume rm buildx_buildkit_evimed-ci0_state
          remaining_cache_volume="$(docker volume ls -q --filter name='^buildx_buildkit_evimed-ci0_state$')"
          test -z "$remaining_cache_volume"

      # The kernel is installed as an npm global, not as a fetched binary, so
      # what is checked is that the launcher resolves, that its version is the
      # pinned one, and that the composed profile the image pre-initialized is
      # still there — a profile that failed to build at image time would
      # otherwise only surface as a container that starts and answers nothing.
      - name: Verify runtime binaries and preserved licenses
        run: >-
          docker run --rm --network none -e OPEN_SCIENCE_DSH_VERSION
          "${OPEN_SCIENCE_RUNTIME_CONTAINER_IMAGE}"
          sh -ec 'test -x /usr/local/bin/uv &&
          test -x /usr/local/bin/open-science-dsh-serve &&
          test -s /usr/share/licenses/uv/LICENSE-MIT &&
          test -s /opt/evimed/dump-config.baseline.json &&
          dsh --version &&
          test "$(node -p "require(\"/usr/local/lib/node_modules/@deepseek-ai/dsh/package.json\").version")" = "${OPEN_SCIENCE_DSH_VERSION}" &&
          uv --version'

      - name: Pull the pinned manifest dependencies
        run: |
          set -euo pipefail
          test "$(df -B1 --output=avail / | tail -1)" -ge 21474836480
          # A checked command, before any pull: process substitution hides a
          # failed producer from `set -e` and leaves an empty dependency list.
          dependency_file="${RUNNER_TEMP}/evimed-manifest-dependencies.txt"
          node - > "$dependency_file" <<'JS'
          const d = require('./deps-version.json');
          const version = /^\d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?$/;
          const tag = /^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$/;
          const repository = /^[a-z0-9]+(?:[._-][a-z0-9]+)*(?::[0-9]+)?(?:\/[a-z0-9]+(?:[._-][a-z0-9]+)*)+$/;
          if (!version.test(process.env.OPEN_SCIENCE_CADDY_VERSION ?? '')) throw new Error('Missing or malformed manifest dependency pin: caddy');
          if (typeof d.openlist?.version !== 'string' || !version.test(d.openlist.version)) throw new Error('Missing or malformed manifest dependency pin: openlist');
          const dependencies = [
            ['openlist', d.openlist, `v${d.openlist.version}`],
            ['openviking', d.openviking, d.openviking?.imageTag],
          ];
          const images = dependencies.map(([name, pin, imageTag]) => {
            if (typeof pin?.image !== 'string' || !repository.test(pin.image)
              || typeof imageTag !== 'string' || !tag.test(imageTag)
              || typeof pin?.imageDigest !== 'string' || !/^sha256:[a-f0-9]{64}$/.test(pin.imageDigest)) {
              throw new Error(`Missing or malformed manifest dependency pin: ${name}`);
            }
            return `${pin.image}:${imageTag}@${pin.imageDigest}`;
          });
          process.stdout.write(images.join('\n') + '\n');
          JS
          timeout 300 docker pull "caddy:${OPEN_SCIENCE_CADDY_VERSION}"
          while IFS= read -r image; do
            test "$(df -B1 --output=avail / | tail -1)" -ge 21474836480
            timeout 900 docker pull "$image" &
            pull_pid=$!
            while kill -0 "$pull_pid" 2>/dev/null; do
              if [ "$(df -B1 --output=avail / | tail -1)" -lt 10737418240 ]; then
                kill "$pull_pid" 2>/dev/null || true
                wait "$pull_pid" || true
                echo "CI dependency pull stopped at the 10 GiB capacity floor" >&2
                exit 1
              fi
              sleep 5
            done
            wait "$pull_pid"
          done < "$dependency_file"

      - name: Qualify isolated VCR candidate image without enabling the module
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import fs from 'node:fs';
          import path from 'node:path';
          const image = process.env.EVIMED_VCR_ENGINE_IMAGE;
          const inspected = JSON.parse(execFileSync('docker', ['image', 'inspect', image], { encoding: 'utf8' }))[0];
          const labels = inspected.Config.Labels;
          assert.equal(labels['org.opencontainers.image.revision'], process.env.OPEN_SCIENCE_SOURCE_REVISION);
          assert.equal(labels['org.opencontainers.image.version'], process.env.OPEN_SCIENCE_RELEASE_ID);
          assert.equal(labels['org.opencontainers.image.created'], process.env.OPEN_SCIENCE_BUILD_CREATED);
          const isolation = ['run', '--rm', '--network', 'none', '--read-only', '--cap-drop', 'ALL',
            '--security-opt', 'no-new-privileges:true', '--pids-limit', '64', '--memory', '1g', '--cpus', '1',
            '--tmpfs', '/tmp:size=256m,mode=1777'];
          const r = 'root<-Sys.getenv("VCR_ENGINE_ROOT");source(file.path(root,"R","engine.R"));vcr_engine_load(root);cat(jsonlite::toJSON(vcr_engine_health(),auto_unbox=TRUE,digits=NA))';
          const health = JSON.parse(execFileSync('docker', [...isolation, '--entrypoint', 'Rscript', image, '-e', r], { encoding: 'utf8', timeout: 120000 }));
          assert.equal(health.ok, true);
          // The same numerical_source_digest byte encoding, without constructing an HTTP service or requesting credentials.
          const digestProgram = ['from pathlib import Path', 'import hashlib', 'root=Path("/opt/vcr-engine")',
            'files=sorted(p for p in (root/"R").rglob("*") if p.suffix in {".R",".json"})',
            'assert root/"R/engine.R" in files and root/"R/package-lock.json" in files', 'digest=hashlib.sha256()',
            'for p in files:', ' assert not p.is_symlink() and p.is_file()', ' body=p.read_bytes()',
            ' digest.update(f"{p.relative_to(root).as_posix()}\\0{len(body)}\\0{hashlib.sha256(body).hexdigest()}\\n".encode())',
            'print(digest.hexdigest())'].join('\n');
          const codeDigest = execFileSync('docker', [...isolation, '--entrypoint', 'python3', image, '-c', digestProgram],
            { encoding: 'utf8', timeout: 30000 }).trim();
          assert.match(codeDigest, /^[a-f0-9]{64}$/);
          assert.match(health.packageLockHash, /^[a-f0-9]{64}$/);
          const report = { schemaVersion: 1, kind: 'vcr-candidate-image-qualification', image, imageId: inspected.Id,
            imageSize: inspected.Size, sourceRevision: process.env.OPEN_SCIENCE_SOURCE_REVISION, releaseId: process.env.OPEN_SCIENCE_RELEASE_ID,
            codeDigest, health, executionBoundary: 'built_image_offline_numeric_self_check', moduleEnabled: false };
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'vcr-image-qualification.json'), JSON.stringify(report) + '\n');
          fs.appendFileSync(process.env.GITHUB_ENV, `OPEN_SCIENCE_VCR_ENGINE_IMAGE_ID=${inspected.Id}\n`);
          console.log(JSON.stringify({ image, imageId: inspected.Id, imageSize: inspected.Size, codeDigest, ready: true, moduleEnabled: false }));
          JS

      - name: Preserve isolated VCR candidate image qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vcr-candidate-image-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/vcr-image-qualification.json
          if-no-files-found: error

      - name: Generate and verify deployment release manifest
        run: |
          replay_image_id="$(docker image inspect --format '{{.Id}}' "$OPEN_SCIENCE_RESULT_REPLAY_IMAGE")"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$OPEN_SCIENCE_RESULT_REPLAY_IMAGE")" = "$OPEN_SCIENCE_SOURCE_REVISION"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$OPEN_SCIENCE_RESULT_REPLAY_IMAGE")" = "$OPEN_SCIENCE_RELEASE_ID"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.created"}}' "$OPEN_SCIENCE_RESULT_REPLAY_IMAGE")" = "$OPEN_SCIENCE_BUILD_CREATED"
          echo "OPEN_SCIENCE_RESULT_REPLAY_IMAGE_ID=$replay_image_id" >> "$GITHUB_ENV"
          pnpm release:manifest
          pnpm verify:release-manifest
          OPEN_SCIENCE_RESULT_REPLAY_IMAGE_ID="$replay_image_id" node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('deploy/web/release-manifest.json', 'utf8'));
          const replay = manifest.services.find(service => service.name === 'result-replay');
          assert.equal(replay.image, process.env.OPEN_SCIENCE_RESULT_REPLAY_IMAGE);
          assert.equal(replay.imageId, process.env.OPEN_SCIENCE_RESULT_REPLAY_IMAGE_ID);
          JS

      - name: Generate monitoring secrets
        run: |
          pnpm configure:monitoring
          node scripts/ops/configure-monitoring.mjs --prepare-container-secrets
          pnpm check:monitoring

      - name: Generate and validate backup secret
        run: |
          pnpm configure:backup
          chmod 0400 "$OPEN_SCIENCE_BACKUP_PASSPHRASE_FILE"
          pnpm check:backup

      - name: Retain the verified runtime image before preflight
        run: >-
          docker compose --env-file deploy/web/.env.ci
          -f deploy/web/docker-compose.yml
          -f deploy/web/docker-compose.result-replay.yml
          --profile runtime-image up --no-build --pull never --no-start dsh-runtime-image

      - name: Verify production host prerequisites
        run: pnpm preflight:host --env-file deploy/web/.env.ci

      - name: Seed the synthetic CI pharmacy reference
        run: |
          # This test-only database stays in the disposable CI volume. It is
          # never placed in an image or in the full-release image artifact.
          python3 -B - <<'PYCODE'
          import hashlib, os, pathlib, sqlite3, sys
          sys.path.insert(0, 'runtime/mcp/evimed-research')
          from build_pharmacy_reference import DDL
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ci-pharmacy-reference.sqlite'
          with sqlite3.connect(output) as db:
              db.executescript(DDL)
              db.execute('INSERT INTO metadata VALUES (?, ?)', ('kind', 'synthetic-ci-fixture'))
              db.execute('INSERT INTO datasets VALUES (?, ?, ?, ?, ?)', ('ci-fixture', 'ci-fixture.csv', hashlib.sha256(b'synthetic-ci').hexdigest(), 1, '["label"]'))
              db.execute('INSERT INTO records VALUES (?, ?, ?, ?, ?)', (1, 'ci-fixture', 1, '{"label":"synthetic CI record, not clinical data"}', 'synthetic CI record'))
              db.execute("INSERT INTO records_fts(records_fts) VALUES ('rebuild')")
              assert db.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
          PYCODE
          docker volume create "$OPEN_SCIENCE_DATA_VOLUME"
          # Initialize the canonical empty user tree before the backup-first
          # startup dependency; restore integrity uses the actual archive inventory.
          docker run --rm --network none --user 0 --entrypoint sh \
            -v "${OPEN_SCIENCE_DATA_VOLUME}:/data" \
            -v "$RUNNER_TEMP/ci-pharmacy-reference.sqlite:/ci-fixture.sqlite:ro" \
            "$OPEN_SCIENCE_RUNTIME_CONTAINER_IMAGE" \
            -ec 'test ! -e /data/pharmacy-reference.sqlite; mkdir -p /data/users; chmod 700 /data/users; cp /ci-fixture.sqlite /data/pharmacy-reference.sqlite; chmod 444 /data/pharmacy-reference.sqlite'

      - name: Start production Compose stack
        run: >-
          docker compose --env-file deploy/web/.env.ci
          -f deploy/web/docker-compose.yml
          -f deploy/web/docker-compose.local-auth.yml
          -f deploy/web/docker-compose.backup.yml
          -f deploy/web/docker-compose.monitoring.yml
          -f deploy/web/docker-compose.ingestion.yml
          -f deploy/web/docker-compose.result-replay.yml
          --profile backup --profile monitoring --profile tls up -d

      - name: Verify actual PostgreSQL backup and restore before readiness
        run: |
          # Liveness starts after application initialization; readiness itself
          # requires the real backup receipt that this step is about to create.
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null; then
              break
            fi
            test "$attempt" -lt 90 || exit 1
            sleep 2
          done
          EVIMED_POSTGRES_BACKUP_DIR="$RUNNER_TEMP/evimed-postgres-backup" \
          EVIMED_POSTGRES_PASSPHRASE_FILE="$OPEN_SCIENCE_BACKUP_PASSPHRASE_FILE" \
            python3 -B scripts/ops/postgres-backup.py

      - name: Wait for API and monitoring readiness
        run: |
          compose=(docker compose --env-file deploy/web/.env.ci -f deploy/web/docker-compose.yml -f deploy/web/docker-compose.local-auth.yml -f deploy/web/docker-compose.backup.yml -f deploy/web/docker-compose.monitoring.yml -f deploy/web/docker-compose.ingestion.yml -f deploy/web/docker-compose.result-replay.yml --profile backup --profile monitoring --profile tls)
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8787/api/ready --connect-timeout 2 --max-time 5 >/dev/null \
              && curl -kfsS https://localhost/api/ready --connect-timeout 2 --max-time 5 >/dev/null \
              && curl -fsS http://127.0.0.1:9090/-/ready --connect-timeout 2 --max-time 5 >/dev/null \
              && curl -fsS http://127.0.0.1:9093/-/ready --connect-timeout 2 --max-time 5 >/dev/null \
              && curl -fsS http://127.0.0.1:3000/api/health --connect-timeout 2 --max-time 5 >/dev/null \
              && "${compose[@]}" exec -T open-science-backup node scripts/ops/backup-scheduler.mjs health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          # Report only bounded readiness codes, never raw responses or config.
          timeout 10 python3 - <<'PY' || echo '{"code":"readiness_diagnostic_failed"}'
          import json, re, urllib.error, urllib.request
          identifier = re.compile(r"[A-Za-z][A-Za-z0-9_]{0,79}\Z")
          def safe_id(value):
              return value if isinstance(value, str) and identifier.fullmatch(value) else "invalid_identifier"
          result = {"endpoint": "direct_api_ready"}
          try:
              try:
                  response = urllib.request.urlopen("http://127.0.0.1:8787/api/ready", timeout=5)
              except urllib.error.HTTPError as error:
                  response = error
              with response:
                  result["status"] = getattr(response, "status", None) or getattr(response, "code", None)
                  raw = response.read(65537)
              if len(raw) > 65536:
                  result["code"] = "readiness_response_too_large"
              else:
                  payload = json.loads(raw)
                  checks = payload.get("data", {}).get("checks")
                  if isinstance(checks, dict):
                      result["checks"] = {
                          safe_id(name): {"ok": check.get("ok") is True,
                              **{field: safe_id(check[field]) for field in ("code", "field") if field in check}}
                          for name, check in list(checks.items())[:32] if isinstance(check, dict)
                      }
                  else:
                      result["code"] = safe_id(payload.get("error", {}).get("code", "readiness_checks_missing"))
          except (ValueError, AttributeError, TypeError):
              result["code"] = "readiness_response_invalid"
          except (OSError, urllib.error.URLError):
              result["code"] = "readiness_probe_unavailable"
          print(json.dumps(result))
          PY
          "${compose[@]}" ps
          exit 1

      - name: Trust CI Caddy root and verify public HTTPS preflight
        run: |
          compose=(docker compose --env-file deploy/web/.env.ci -f deploy/web/docker-compose.yml -f deploy/web/docker-compose.local-auth.yml -f deploy/web/docker-compose.backup.yml -f deploy/web/docker-compose.monitoring.yml -f deploy/web/docker-compose.ingestion.yml -f deploy/web/docker-compose.result-replay.yml --profile backup --profile monitoring --profile tls)
          "${compose[@]}" cp caddy:/data/caddy/pki/authorities/local/root.crt /tmp/open-science-caddy-root.crt
          test -s /tmp/open-science-caddy-root.crt
          NODE_EXTRA_CA_CERTS=/tmp/open-science-caddy-root.crt pnpm preflight:host --env-file deploy/web/.env.ci --online

      - name: Verify Docker socket privilege boundary
        run: |
          compose=(docker compose --env-file deploy/web/.env.ci -f deploy/web/docker-compose.yml -f deploy/web/docker-compose.local-auth.yml -f deploy/web/docker-compose.backup.yml -f deploy/web/docker-compose.monitoring.yml -f deploy/web/docker-compose.ingestion.yml -f deploy/web/docker-compose.result-replay.yml --profile backup --profile monitoring --profile tls)
          web_id="$("${compose[@]}" ps -q open-science-web)"
          controller_id="$("${compose[@]}" ps -q open-science-runtime-controller)"
          backup_id="$("${compose[@]}" ps -q open-science-backup)"
          test -n "$web_id" && test -n "$controller_id" && test -n "$backup_id"
          if [ "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$web_id")" != "true" ]; then
            echo "Web API root filesystem must be read-only" >&2
            exit 1
          fi
          docker inspect --format '{{range .HostConfig.CapDrop}}{{println .}}{{end}}' "$web_id" | grep -Fx ALL
          docker inspect --format '{{range .HostConfig.SecurityOpt}}{{println .}}{{end}}' "$web_id" | grep -Fx no-new-privileges:true
          if docker inspect --format '{{range .Mounts}}{{println .Destination}}{{end}}' "$web_id" | grep -Fx /var/run/docker.sock; then
            echo "Web API container must not mount /var/run/docker.sock" >&2
            exit 1
          fi
          control_mount_rw="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/run/open-science-controller"}}{{.RW}}{{end}}{{end}}' "$web_id")"
          if [ "$control_mount_rw" != "false" ]; then
            echo "Web API controller mount must be read-only" >&2
            exit 1
          fi
          docker inspect --format '{{range .Mounts}}{{println .Destination}}{{end}}' "$controller_id" | grep -Fx /var/run/docker.sock
          docker inspect --format '{{range .HostConfig.GroupAdd}}{{println .}}{{end}}' "$controller_id" | grep -Fx "$OPEN_SCIENCE_DOCKER_SOCKET_GID"
          if docker inspect --format '{{range .Mounts}}{{println .Destination}}{{end}}' "$backup_id" | grep -Fx /var/run/docker.sock; then
            echo "Backup container must not mount /var/run/docker.sock" >&2
            exit 1
          fi
          test "$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/backups"}}{{.RW}}{{end}}{{end}}' "$web_id")" = "false"
          test "$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/data"}}{{.RW}}{{end}}{{end}}' "$backup_id")" = "false"
          "${compose[@]}" exec -T open-science-web test -S /run/open-science-controller/controller.sock

      - name: Verify built replay image isolation and signed numerical HTTP jobs
        run: |
          compose=(docker compose --env-file deploy/web/.env.ci -f deploy/web/docker-compose.yml -f deploy/web/docker-compose.local-auth.yml -f deploy/web/docker-compose.backup.yml -f deploy/web/docker-compose.monitoring.yml -f deploy/web/docker-compose.ingestion.yml -f deploy/web/docker-compose.result-replay.yml --profile backup --profile monitoring --profile tls)
          replay_id="$("${compose[@]}" ps -q result-replay)"
          test -n "$replay_id"
          export EVIMED_CI_REPLAY_CONTAINER_ID="$replay_id"
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { validateReplayImageIsolation } from './scripts/ops/result-replay-image-smoke.mjs';
          const container = JSON.parse(execFileSync('docker', ['inspect', process.env.EVIMED_CI_REPLAY_CONTAINER_ID], { encoding: 'utf8' }))[0];
          const networkId = Object.values(container.NetworkSettings.Networks)[0].NetworkID;
          const network = JSON.parse(execFileSync('docker', ['network', 'inspect', networkId], { encoding: 'utf8' }))[0];
          console.log(validateReplayImageIsolation(container, network, { imageId: process.env.OPEN_SCIENCE_RESULT_REPLAY_IMAGE_ID,
            dataVolume: process.env.OPEN_SCIENCE_DATA_VOLUME }));
          JS
          for attempt in $(seq 1 60); do
            if "${compose[@]}" exec -T result-replay python -c "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8031/health',timeout=3))['ready']"; then
              break
            fi
            test "$attempt" -lt 60 || exit 1
            sleep 2
          done
          "${compose[@]}" exec -T \
            -e OPEN_SCIENCE_RESULT_REPLAY_SMOKE_ACK=disposable-ci-fixtures \
            -e OPEN_SCIENCE_RESULT_REPLAY_IMAGE_ID \
            open-science-web node scripts/ops/result-replay-image-smoke.mjs \
            | tee "$RUNNER_TEMP/result-replay-image-qualification.json"

      - name: Preserve built replay image qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-replay-image-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/result-replay-image-qualification.json
          if-no-files-found: error

      - name: Smoke real hosted runtime boundaries
        env:
          NODE_EXTRA_CA_CERTS: /tmp/open-science-caddy-root.crt
          OPEN_SCIENCE_SMOKE_BASE_URL: https://localhost
          OPEN_SCIENCE_SMOKE_USERNAME: ci-admin
          OPEN_SCIENCE_SMOKE_METRICS_TOKEN_FILE: deploy/web/secrets/operator-metrics-token.txt
          OPEN_SCIENCE_SMOKE_RUNTIME: "true"
          OPEN_SCIENCE_SMOKE_RUNTIME_PROMPT: "false"
          # The one stage that makes the composed controller write under the
          # data volume and start a renderer from the built runtime image.
          OPEN_SCIENCE_SMOKE_DOCUMENT_EXPORT: "true"
        run: |
          OPEN_SCIENCE_SMOKE_PASSWORD="$(tr -d '\r\n' < deploy/web/secrets/bootstrap-password.txt)" \
            pnpm smoke:deployment

      - name: Verify runtime cleanup
        run: |
          test -z "$(docker ps -aq --filter label=open-science.web.runtime=true)"

      - name: Verify scheduled encrypted backup
        run: >-
          docker compose --env-file deploy/web/.env.ci
          -f deploy/web/docker-compose.yml
          -f deploy/web/docker-compose.local-auth.yml
          -f deploy/web/docker-compose.backup.yml
          -f deploy/web/docker-compose.ingestion.yml
          -f deploy/web/docker-compose.result-replay.yml
          --profile backup exec -T open-science-backup
          node -e "const fs=require('node:fs');const names=fs.readdirSync('/backups');process.exit(names.some(n=>n.endsWith('.tar.gz.enc'))&&names.includes('.open-science-backup-state.json')?0:1)"

      - name: Package verified full-release images
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/release-') && contains(github.event.head_commit.message, '[full-release]')
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/ops/test -p 'test_image_archive_inventory.py'
          mkdir -p "$RUNNER_TEMP/evimed-release"
          docker compose --env-file deploy/web/.env.ci \
            -f deploy/web/docker-compose.yml \
            -f deploy/web/docker-compose.local-auth.yml \
            -f deploy/web/docker-compose.backup.yml \
            -f deploy/web/docker-compose.ingestion.yml \
            -f deploy/web/docker-compose.result-replay.yml \
            --profile backup --profile runtime-image --profile vcr config --format json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("\n".join(sorted({s["image"] for s in d["services"].values() if s.get("build") and (not s.get("profiles") or set(s["profiles"]) & {"backup", "runtime-image", "vcr"})})))' \
            > "$RUNNER_TEMP/evimed-release/images.txt"
          test -s "$RUNNER_TEMP/evimed-release/images.txt"
          grep -Fx "$OPEN_SCIENCE_RESULT_REPLAY_IMAGE" "$RUNNER_TEMP/evimed-release/images.txt"
          grep -Fx "$EVIMED_VCR_ENGINE_IMAGE" "$RUNNER_TEMP/evimed-release/images.txt"
          export EVIMED_IMAGE_LIST="$RUNNER_TEMP/evimed-release/images.txt"
          export EVIMED_IMAGE_ARCHIVE="$RUNNER_TEMP/evimed-release/images.tar.gz"
          test "$(df -B1 --output=avail / | tail -1)" -ge 21474836480
          package_phase_started=$SECONDS
          printf '[package] image export started\n'
          setsid bash -euo pipefail -c 'mapfile -t images < "$EVIMED_IMAGE_LIST"; docker save "${images[@]}" | gzip -1 > "$EVIMED_IMAGE_ARCHIVE"' &
          export_pid=$!
          while kill -0 "$export_pid" 2>/dev/null; do
            if [ "$(df -B1 --output=avail / | tail -1)" -lt 10737418240 ]; then
              kill -- "-$export_pid" 2>/dev/null || true
              wait "$export_pid" || true
              echo "CI export stopped at the 10 GiB capacity floor" >&2
              exit 1
            fi
            sleep 5
          done
          wait "$export_pid"
          printf '[package] image export complete: elapsed=%ss\n' "$((SECONDS - package_phase_started))"
          package_phase_started=$SECONDS
          printf '[package] gzip verification started\n'
          gzip -t "$EVIMED_IMAGE_ARCHIVE"
          printf '[package] gzip verification complete: elapsed=%ss\n' "$((SECONDS - package_phase_started))"
          package_phase_started=$SECONDS
          printf '[package] archive checksum started\n'
          (cd "$RUNNER_TEMP/evimed-release" && sha256sum images.tar.gz > images.tar.gz.sha256)
          printf '[package] archive checksum complete: elapsed=%ss\n' "$((SECONDS - package_phase_started))"
          printf '[package] streaming image inventory started\n'
          python3 scripts/ops/image-archive-inventory.py
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          const archive = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'evimed-release/manifest.json'), 'utf8'));
          const replay = archive.images.find(image => image.references.includes(process.env.OPEN_SCIENCE_RESULT_REPLAY_IMAGE));
          assert.equal(replay.configDigest, process.env.OPEN_SCIENCE_RESULT_REPLAY_IMAGE_ID);
          assert.equal(replay.labels['org.opencontainers.image.revision'], process.env.OPEN_SCIENCE_SOURCE_REVISION);
          assert.equal(replay.labels['org.opencontainers.image.version'], process.env.OPEN_SCIENCE_RELEASE_ID);
          const vcr = archive.images.find(image => image.references.includes(process.env.EVIMED_VCR_ENGINE_IMAGE));
          assert.equal(vcr.configDigest, process.env.OPEN_SCIENCE_VCR_ENGINE_IMAGE_ID);
          assert.equal(vcr.labels['org.opencontainers.image.revision'], process.env.OPEN_SCIENCE_SOURCE_REVISION);
          assert.equal(vcr.labels['org.opencontainers.image.version'], process.env.OPEN_SCIENCE_RELEASE_ID);
          JS
          cp deploy/web/release-manifest.json "$RUNNER_TEMP/evimed-release/release-manifest.json"
          cp "$RUNNER_TEMP/result-replay-image-qualification.json" "$RUNNER_TEMP/evimed-release/result-replay-image-qualification.json"
          cp "$RUNNER_TEMP/vcr-image-qualification.json" "$RUNNER_TEMP/evimed-release/vcr-image-qualification.json"

      - name: Package bounded core and isolated VCR image subsets
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/release-') && contains(github.event.head_commit.message, '[full-release]')
        timeout-minutes: 35
        run: |
          set -euo pipefail
          # Reuse qualified images; this never invokes a build or deletes existing images.
          for subset in core vcr; do
            export EVIMED_RELEASE_SUBSET="$subset"
            node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const subset = process.env.EVIMED_RELEASE_SUBSET;
          assert.ok(['core', 'vcr'].includes(subset));
          const root = path.join(process.env.RUNNER_TEMP, `evimed-${subset}-release`);
          fs.mkdirSync(root, { mode: 0o700 });
          const selected = subset === 'core' ? {
            web: process.env.OPEN_SCIENCE_WEB_CONTAINER_IMAGE,
            controller: process.env.OPEN_SCIENCE_WEB_CONTAINER_IMAGE,
            backup: process.env.OPEN_SCIENCE_WEB_CONTAINER_IMAGE,
            runtime: process.env.OPEN_SCIENCE_RUNTIME_CONTAINER_IMAGE,
            resultReplay: process.env.OPEN_SCIENCE_RESULT_REPLAY_IMAGE,
          } : { vcr: process.env.EVIMED_VCR_ENGINE_IMAGE };
          const full = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'evimed-release/manifest.json'), 'utf8'));
          assert.equal(full.sourceRevision, process.env.OPEN_SCIENCE_SOURCE_REVISION);
          const roles = {}, images = [], files = [];
          for (const [role, reference] of Object.entries(selected)) {
            const recorded = full.images.find(image => image.references.includes(reference));
            assert.ok(recorded, `Missing full-release image for ${role}`);
            const inspected = JSON.parse(execFileSync('docker', ['image', 'inspect', reference], { encoding: 'utf8' }))[0];
            assert.equal(inspected.Id, recorded.configDigest);
            assert.equal(inspected.Config.Labels['org.opencontainers.image.revision'], process.env.OPEN_SCIENCE_SOURCE_REVISION);
            assert.equal(inspected.Config.Labels['org.opencontainers.image.version'], process.env.OPEN_SCIENCE_RELEASE_ID);
            assert.deepEqual(inspected.RootFS.Layers, recorded.rootfs.diff_ids);
            assert.equal(`${inspected.Os}/${inspected.Architecture}`, 'linux/amd64');
            roles[role] = { imageId: inspected.Id, reference };
            if (!images.some(image => image.imageId === inspected.Id)) images.push({ reference, imageId: inspected.Id,
              platform: 'linux/amd64', diffIds: inspected.RootFS.Layers, inspectedBytes: inspected.Size });
          }
          for (const [source, name] of [['deploy/web/release-manifest.json', 'release-manifest.json'],
            [path.join(process.env.RUNNER_TEMP, subset === 'core' ? 'result-replay-image-qualification.json' : 'vcr-image-qualification.json'), 'image-qualification.json']]) {
            const bytes = fs.readFileSync(source);
            fs.writeFileSync(path.join(root, name), bytes, { flag: 'wx', mode: 0o400 });
            files.push({ path: name, bytes: bytes.length, sha256: createHash('sha256').update(bytes).digest('hex') });
          }
          fs.writeFileSync(path.join(root, 'images.txt'), images.map(image => image.reference + '\n').join(''), { mode: 0o400 });
          fs.writeFileSync(path.join(root, 'prepared-export.json'), JSON.stringify({ schemaVersion: 1,
            scope: subset === 'core' ? 'candidate-core-image-subset' : 'isolated-vcr-image-subset',
            sourceRevision: process.env.OPEN_SCIENCE_SOURCE_REVISION, releaseId: process.env.OPEN_SCIENCE_RELEASE_ID,
            workflowRun: process.env.GITHUB_RUN_ID, workflowAttempt: process.env.GITHUB_RUN_ATTEMPT,
            roles, images, files, ...(subset === 'vcr' ? { moduleEnabled: false } : {}),
            capacityBoundary: 'Import admission must separately measure missing layers, overlayfs snapshots and temporary peak; streaming does not waive the host free-space floor.'
          }, null, 2) + '\n', { mode: 0o400 });
          JS
            export EVIMED_SUBSET_ROOT="$RUNNER_TEMP/evimed-${subset}-release"
            test "$(df -B1 --output=avail / | tail -1)" -ge 12884901888
            setsid bash -euo pipefail -c 'mapfile -t images < "$EVIMED_SUBSET_ROOT/images.txt"; docker save "${images[@]}" | gzip -1 > "$EVIMED_SUBSET_ROOT/images.tar.gz"' &
            subset_pid=$!
            subset_started=$SECONDS
            trap 'kill -- "-$subset_pid" 2>/dev/null || true; wait "$subset_pid" || true' EXIT
            while kill -0 "$subset_pid" 2>/dev/null; do
              if [ "$(df -B1 --output=avail / | tail -1)" -lt 10737418240 ] || \
                 [ "$(stat -c %s "$EVIMED_SUBSET_ROOT/images.tar.gz" 2>/dev/null || echo 0)" -gt 3221225472 ] || \
                 [ "$((SECONDS - subset_started))" -gt 900 ]; then
                echo "Release subset export exceeded its capacity, byte or time bound" >&2
                exit 1
              fi
              sleep 5
            done
            wait "$subset_pid"
            trap - EXIT
            chmod 400 "$EVIMED_SUBSET_ROOT/images.tar.gz"
            python3 - <<'PYTHON'
          import importlib.util, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('subset_inventory', 'scripts/ops/extension-acceptance-archive.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          root = Path(os.environ['EVIMED_SUBSET_ROOT'])
          report = module.measure_archive(root)
          print({'subset': os.environ['EVIMED_RELEASE_SUBSET'], 'images': len(report['images']),
                 'compressedBytes': report['archive']['compressedBytes'],
                 'uniqueUncompressedLayerBytes': report['archive']['uniqueUncompressedLayerBytes'],
                 'conservativeDownloadAndLoadBytes': report['archive']['conservativeDownloadAndLoadBytes']})
          PYTHON
            # The root operator shell writes private artifacts; the upload action runs as the runner.
            chown -R --reference="$RUNNER_TEMP" "$EVIMED_SUBSET_ROOT"
          done

      - name: Upload exact candidate core image subset
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/release-') && contains(github.event.head_commit.message, '[full-release]')
        uses: actions/upload-artifact@v4
        with:
          name: evimed-core-release-${{ github.sha }}
          path: ${{ runner.temp }}/evimed-core-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Upload isolated candidate VCR image subset
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/release-') && contains(github.event.head_commit.message, '[full-release]')
        uses: actions/upload-artifact@v4
        with:
          name: evimed-vcr-release-${{ github.sha }}
          path: ${{ runner.temp }}/evimed-vcr-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Upload verified full-release images
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/release-') && contains(github.event.head_commit.message, '[full-release]')
        uses: actions/upload-artifact@v4
        with:
          name: evimed-full-release-${{ github.sha }}
          path: ${{ runner.temp }}/evimed-release/
          compression-level: 0
          retention-days: 3

      # A plain-Node pilot runs the API from the web image's /app copied out, and
      # a release that changes only the control plane needs nothing else. Alone
      # it is about 40 MB; inside the core subset it sits behind 1.6 GB that a
      # slow link has to fetch and a small disk has to load to reach it.
      - name: Export the web application closure for plain-Node pilots
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/release-') && contains(github.event.head_commit.message, '[full-release]')
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/evimed-web-bundle"
          mkdir -p "$out"
          container="$(docker create "$OPEN_SCIENCE_WEB_CONTAINER_IMAGE" true)"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker cp "$container:/app" - | gzip -6 > "$out/app.tar.gz"
          gzip -t "$out/app.tar.gz"
          docker image inspect "$OPEN_SCIENCE_WEB_CONTAINER_IMAGE" > "$out/web-image.json"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          const out = path.join(process.env.RUNNER_TEMP, 'evimed-web-bundle');
          const [image] = JSON.parse(fs.readFileSync(path.join(out, 'web-image.json'), 'utf8'));
          assert.equal(image.Config.Labels['org.opencontainers.image.revision'], process.env.OPEN_SCIENCE_SOURCE_REVISION);
          assert.equal(image.Config.Labels['org.opencontainers.image.version'], process.env.OPEN_SCIENCE_RELEASE_ID);
          assert.equal(`${image.Os}/${image.Architecture}`, 'linux/amd64');
          const release = Object.fromEntries((image.Config.Env ?? []).map(pair => pair.split(/=(.*)/s).slice(0, 2))
            .filter(([key]) => ['OPEN_SCIENCE_APP_VERSION', 'OPEN_SCIENCE_RELEASE_ID', 'OPEN_SCIENCE_SOURCE_REVISION', 'OPEN_SCIENCE_BUILD_CREATED'].includes(key)));
          assert.equal(Object.keys(release).length, 4);
          fs.writeFileSync(path.join(out, 'web-bundle.json'), JSON.stringify({ schemaVersion: 1, scope: 'web-application-closure',
            sourceRevision: process.env.OPEN_SCIENCE_SOURCE_REVISION, releaseId: process.env.OPEN_SCIENCE_RELEASE_ID,
            workflowRun: process.env.GITHUB_RUN_ID, workflowAttempt: process.env.GITHUB_RUN_ATTEMPT,
            webImage: { reference: process.env.OPEN_SCIENCE_WEB_CONTAINER_IMAGE, imageId: image.Id, diffIds: image.RootFS.Layers },
            release, root: 'app', node: image.Config.Env.find(pair => pair.startsWith('NODE_VERSION='))?.slice('NODE_VERSION='.length) ?? null,
          }, null, 2) + '\n');
          fs.rmSync(path.join(out, 'web-image.json'));
          JS
          (cd "$out" && sha256sum app.tar.gz > app.tar.gz.sha256)
          ls -l "$out"

      - name: Upload the web application closure
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/release-') && contains(github.event.head_commit.message, '[full-release]')
        uses: actions/upload-artifact@v4
        with:
          name: evimed-web-bundle-${{ github.sha }}
          path: ${{ runner.temp }}/evimed-web-bundle/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Print Compose logs on failure
        if: failure()
        run: >-
          docker compose --env-file deploy/web/.env.ci
          -f deploy/web/docker-compose.yml
          -f deploy/web/docker-compose.local-auth.yml
          -f deploy/web/docker-compose.backup.yml
          -f deploy/web/docker-compose.monitoring.yml
          -f deploy/web/docker-compose.ingestion.yml
          -f deploy/web/docker-compose.result-replay.yml
          --profile backup --profile monitoring --profile tls logs --no-color

      - name: Stop Compose stack
        if: always()
        run: >-
          docker compose --env-file deploy/web/.env.ci
          -f deploy/web/docker-compose.yml
          -f deploy/web/docker-compose.local-auth.yml
          -f deploy/web/docker-compose.backup.yml
          -f deploy/web/docker-compose.monitoring.yml
          -f deploy/web/docker-compose.ingestion.yml
          -f deploy/web/docker-compose.result-replay.yml
          --profile runtime-image --profile backup --profile monitoring --profile tls down -v --remove-orphans

  hosted-production-e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: OpenScience/package.json

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test real deployed agent runtime, DeepSeek, specialist, research memory, and RAG
        env:
          OPEN_SCIENCE_E2E_BASE_URL: ${{ secrets.OPEN_SCIENCE_E2E_BASE_URL }}
          OPEN_SCIENCE_E2E_USERNAME: ${{ secrets.OPEN_SCIENCE_E2E_USERNAME }}
          OPEN_SCIENCE_E2E_PASSWORD: ${{ secrets.OPEN_SCIENCE_E2E_PASSWORD }}
        run: pnpm test:web:e2e
