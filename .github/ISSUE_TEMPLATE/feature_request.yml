name: Feature request
description: Suggest an improvement or a new capability.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        New user-facing features in this project are capability packages (a `capability.yaml`, a
        `SKILL.md`, a contract validator and real briefs). Describing the researcher's problem
        first helps us decide whether that is the right shape.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is the researcher trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen? Say what the researcher sees and gets, not only how it works.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web app (apps/web)
        - Control plane (apps/server)
        - Runtime, DSH socket or harness-port (packages/socket, packages/harness-port)
        - Domain, evidence-quality gate or safety rules (packages/domain)
        - Capability package or skill (OpenScience/capabilities)
        - Specialist engine (项目代码/)
        - Deployment, Compose or runtime image (OpenScience/deploy)
        - Documentation
        - Other
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve it, including what native DeepSeek Harness with DeepSeek already does without any change.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: A real example, brief or reproduction that shows the need. Remove sensitive content.
