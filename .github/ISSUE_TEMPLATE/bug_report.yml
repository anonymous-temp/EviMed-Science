name: Bug report
description: Something does not work as documented or as expected.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If this is a security vulnerability, do not file it here: follow the
        [security policy](https://github.com/anonymous-temp/EviMed-Science/security/policy) instead.

        Please do not paste API keys, credentials, `.env` contents, or real patient or personal data.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where does the problem show up?
      options:
        - Web app (apps/web)
        - Control plane (apps/server)
        - Runtime, DSH socket or harness-port (packages/socket, packages/harness-port)
        - Domain, evidence-quality gate or safety rules (packages/domain)
        - Capability package or skill (OpenScience/capabilities)
        - Specialist engine (项目代码/)
        - Deployment, Compose or runtime image (OpenScience/deploy)
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest steps that reproduce it. For a research run, include the request you gave it, with any sensitive content removed.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit hash or release id you are running.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js and pnpm versions, browser for UI problems, and whether this is a local setup or a hosted deployment.
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Relevant output or screenshots, with secrets and personal data removed.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find this one.
          required: true
        - label: I removed secrets, credentials and personal or patient data from this report.
          required: true
