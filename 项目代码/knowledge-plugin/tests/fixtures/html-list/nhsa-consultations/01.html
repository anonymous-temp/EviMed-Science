				color: '#4d4d4d'
			});
		});
		
		//搜索框
		$(".inp_text form .text").focus(function(){
			if($(this).val()=="请输入关键字查询"){
				$(this).val("");
			}
			
		}).blur(function(){
			if($(this).val()==""){
			$(this).val("请输入关键字查询");
			}
		});
		
	})(jQuery);
</script>
