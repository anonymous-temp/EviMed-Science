[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "evimed-knowledge-plugin"
version = "0.1.0"
description = "EviMed knowledge-source plugin: registry, scheduling, protected fetch, normalisation and the v1 HTTP contract"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }
# Exact pins live in requirements.txt (what the image installs); these ranges are what the code needs.
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27,<0.29",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "pydantic>=2.7",
  "feedparser>=6.0",
  "selectolax>=0.3",
  "python-dateutil>=2.9",
  "playwright>=1.58,<1.59",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "jsonschema>=4.22", "pyyaml>=6"]

[project.scripts]
evimed-knowledge-plugin = "knowledge_plugin.__main__:main"

[tool.setuptools.packages.find]
include = ["knowledge_plugin*"]

[tool.setuptools.package-data]
knowledge_plugin = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "db: needs the local PostgreSQL (KNOWLEDGE_PLUGIN_TEST_DATABASE_URL or 127.0.0.1:55433)",
  "live: reaches a real upstream over the network (skipped unless KNOWLEDGE_PLUGIN_LIVE_TESTS=1)",
]
