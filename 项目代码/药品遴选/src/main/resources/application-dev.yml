server:
  port: ${SERVER_PORT:2089}

spring:
  application:
    name: evaluation
  servlet:
    multipart:
      max-request-size: 100MB
      max-file-size: 100MB
  data:
    mongodb:
      uri: ${MONGODB_URI:}
  elasticsearch:
    rest:
      uris: ${ELASTICSEARCH_URL:}
      username: ${ELASTICSEARCH_USERNAME:}
      password: ${ELASTICSEARCH_PASSWORD:}
      connection-timeout: 10000
      read-timeout: 120000
      max-connections: 100
      max-connections-per-route: 100
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    database: ${REDIS_DATABASE:1}
    timeout: 100000
    password: ${REDIS_PASSWORD:}

feign:
  hystrix:
    enabled: false
  client:
    config:
      default:
        ConnectTimeOut: 60000
        ReadTimeOut: 60000

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:7002/eureka/}
  instance:
    prefer-ip-address: true

mongo:
  dataName: ${MONGODB_URI:}
  testData: ${MONGODB_TEST_URI:}

evaluation:
  download:
    url: ${EVIMED_DOWNLOAD_URL:http://localhost:2062}
  title:
    font:
      path: ${EVIMED_FONT_FILE:static/simsun.ttf}
      path2: ${EVIMED_FONT_DIR:static}

font:
  path: ${EVIMED_FONT_DIR:static}

gpt:
  baseUrl: ${LEGACY_OPENAI_BASE_URL:https://api.openai.com/v1/chat/completions}
  baseUrlBailian: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
  isNew: true

sys:
  isDev: 1

ai:
  default-provider: deepseek
  default-model: ${DEEPSEEK_MODEL:deepseek-v4-pro}
  timeout:
    connect: 60
    read: 240
    write: 60
  providers:
    deepseek:
      url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/chat/completions}
      api-keys:
        - ${DEEPSEEK_API_KEY:}
    qwen:
      url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
      api-keys:
        - ${DASHSCOPE_API_KEY:}
    openai:
      url: ${OPENAI_BASE_URL:https://api.openai.com/v1/chat/completions}
      api-keys:
        - ${OPENAI_API_KEY:}
  task-models:
    default: ${DEEPSEEK_MODEL:deepseek-v4-pro}
