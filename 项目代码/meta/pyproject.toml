[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metaagent-evidence"
version = "0.9.0.dev0"
description = "Auditable evidence-synthesis and meta-analysis platform"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "openai==2.30.0",
  "anthropic==0.89.0",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2,<3",
  "python-dotenv>=1,<2",
  "numpy>=1.26,<2.1",
  "scipy>=1.12,<1.14",
  "pandas>=2.0,<2.3",
  "biopython>=1.81,<1.86",
  "requests>=2.31,<3",
  "urllib3>=1.26,<3",
  "aiohttp>=3.9,<4",
  "pdfplumber>=0.11,<0.12",
  "python-docx>=1.1,<2",
  "reportlab>=4.0,<5",
  "matplotlib>=3.8,<3.9",
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "websockets>=12,<17",
  "python-multipart>=0.0.9,<1",
  "oss2>=2.18,<3",
  "motor>=3.6,<4",
  "pymongo>=4.9,<5",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.23,<1",
]

[project.scripts]
metaagent = "new_meta.main:main"

[tool.setuptools]
py-modules = ["start"]

[tool.setuptools.packages.find]
include = ["new_meta*"]

[tool.setuptools.package-data]
new_meta = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

