server:
  port: ${SERVER_PORT:8899}
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: agent-evidence-based
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
  ai:
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 2s
        multiplier: 2
        max-interval: 10s
    openai:
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: ${DASHSCOPE_COMPATIBLE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/}
      chat:
        options:
          model: ${DASHSCOPE_MODEL:qwen-plus}
          temperature: 0.7
          max-tokens: 8000
      embedding:
        base-url: ${DASHSCOPE_COMPATIBLE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/}
        options:
          model: text-embedding-v4
          dimensions: 1024
    mcp:
      client:
        enabled: false
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/evimed-evidence-agent}
    username: ${MYSQL_USERNAME:}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
  elasticsearch:
    host: ${ELASTICSEARCH_URL:http://localhost:9200}
    port: ${ELASTICSEARCH_PORT:9200}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:1}
      timeout: 3000ms

tavily:
  api-key: ${TAVILY_API_KEY:}
  mcp-url: ${TAVILY_MCP_URL:https://mcp.tavily.com/mcp/}

drug-safety:
  agent-url: ${DRUG_SAFETY_AGENT_URL:http://localhost:6010}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:7002/eureka/}
  instance:
    prefer-ip-address: true

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

embeddings:
  store:
    host: ${PGVECTOR_HOST:localhost}
    port: ${PGVECTOR_PORT:5432}
    database: ${PGVECTOR_DATABASE:postgres}
    user: ${PGVECTOR_USERNAME:}
    password: ${PGVECTOR_PASSWORD:}
    enabled: ${PGVECTOR_ENABLED:false}

upstream:
  wesocket:
    enabled: ${UPSTREAM_WEBSOCKET_ENABLED:false}
    url: ${UPSTREAM_WEBSOCKET_URL:}
    api: ${UPSTREAM_TOKEN_API:}
    client-type: evidence-based-comprehensive-evaluation

agent:
  medical-qa:
    max-rounds: 5
    enable-recommendations: true
  medical-report:
    max-rounds: 3

logging:
  level:
    com.evimed.agent: INFO
    org.springframework.ai: INFO
    io.netty: WARN

aliyun:
  parse:
    access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
    endpoint: ${ALIYUN_DOCMIND_ENDPOINT:docmind-api.cn-hangzhou.aliyuncs.com}
  oss:
    enabled: ${ALIYUN_OSS_ENABLED:false}
    endpoint: ${ALIYUN_OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
    bucket-name: ${ALIYUN_OSS_BUCKET:}
    file-host: ${ALIYUN_OSS_PREFIX:upload}
    file-url: ${ALIYUN_OSS_PUBLIC_URL:}
