    evaluation_criteria: "Whether clinical information and reference standard results were available to the performers/readers of the index test"
    evidence_location_hint: "methods.blinding"
    severity_if_missing: CRITICAL

  - item_id: STARD_13b
    item_number: "13b"
    category: "Methods - Test methods"
    question: "Test methods - Whether clinical information and index test results were available to the assessors of the reference standard"
    evaluation_criteria: "Whether clinical information and index test results were available to the assessors of the reference standard"
    evidence_location_hint: "methods.blinding"
    severity_if_missing: CRITICAL

  - item_id: STARD_14
    item_number: "14"
    category: "Methods - Analysis"
    question: "Analysis - Methods for estimating or comparing measures of diagnostic accuracy"
    evaluation_criteria: "Methods for estimating or comparing measures of diagnostic accuracy"
    evidence_location_hint: "methods.analysis"
    severity_if_missing: CRITICAL

  - item_id: STARD_15
    item_number: "15"
    category: "Methods - Analysis"
    question: "Analysis - How indeterminate index test or reference standard results were handled"
    evaluation_criteria: "How indeterminate index test or reference standard results were handled"
    evidence_location_hint: "methods.analysis"
    severity_if_missing: MAJOR

  - item_id: STARD_16
    item_number: "16"
    category: "Methods - Analysis"
    question: "Analysis - How missing data on the index test and reference standard were handled"
    evaluation_criteria: "How missing data on the index test and reference standard were handled"
    evidence_location_hint: "methods.analysis"
    severity_if_missing: MAJOR

  - item_id: STARD_17
    item_number: "17"
    category: "Methods - Analysis"
    question: "Analysis - Any analyses of variability in diagnostic accuracy, distinguishing pre-specified from exploratory"
    evaluation_criteria: "Any analyses of variability in diagnostic accuracy, distinguishing pre-specified from exploratory"
    evidence_location_hint: "methods.analysis"
    severity_if_missing: MINOR

  - item_id: STARD_18
    item_number: "18"
    category: "Methods - Analysis"
    question: "Analysis - Intended sample size and how it was determined"
    evaluation_criteria: "Intended sample size and how it was determined"
    evidence_location_hint: "methods.sample_size"
    severity_if_missing: MAJOR

  - item_id: STARD_19
    item_number: "19"
