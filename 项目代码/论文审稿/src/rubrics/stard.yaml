# STARD 2015 checklist for diagnostic accuracy studies.
# Item numbers and text follow the published 30-item checklist exactly; see `source`.
# The previous file numbered 27 flat items with no a/b sub-items and no items for
# intended sample size (18) or adverse events (25), so its numbers named other items.

name: "STARD 2015"
version: "2015"
source:
  doi: "10.1136/bmj.h5527"
  year: 2015
  checklist_version: "STARD 2015"
  citation: "Bossuyt PM, Reitsma JB, Bruns DE, et al. STARD 2015: an updated list of essential items for reporting diagnostic accuracy studies. BMJ 2015;351:h5527."
  checklist_url: "https://www.equator-network.org/reporting-guidelines/stard/"
applicable_to:
  - "Diagnostic Study"
  - "Diagnostic Accuracy Study"
description: "Reporting checklist for diagnostic accuracy studies"

items:
  - item_id: STARD_1
    item_number: "1"
    category: "Title or abstract - Title"
    question: "Title - Identification as a study of diagnostic accuracy using at least one measure of accuracy (such as sensitivity, specificity, predictive values, or AUC)"
    evaluation_criteria: "Identification as a study of diagnostic accuracy using at least one measure of accuracy (such as sensitivity, specificity, predictive values, or AUC)"
    evidence_location_hint: "title"
    severity_if_missing: MINOR

  - item_id: STARD_2
    item_number: "2"
    category: "Abstract - Abstract"
    question: "Abstract - Structured summary of study design, methods, results, and conclusions (for specific guidance, see STARD for Abstracts)"
    evaluation_criteria: "Structured summary of study design, methods, results, and conclusions (for specific guidance, see STARD for Abstracts)"
    evidence_location_hint: "abstract"
    severity_if_missing: MINOR

  - item_id: STARD_3
    item_number: "3"
    category: "Introduction - Background"
    question: "Background - Scientific and clinical background, including the intended use and clinical role of the index test"
    evaluation_criteria: "Scientific and clinical background, including the intended use and clinical role of the index test"
    evidence_location_hint: "introduction"
    severity_if_missing: MAJOR

  - item_id: STARD_4
    item_number: "4"
    category: "Introduction - Objectives"
    question: "Objectives - Study objectives and hypotheses"
    evaluation_criteria: "Study objectives and hypotheses"
    evidence_location_hint: "introduction.objectives"
    severity_if_missing: MAJOR

  - item_id: STARD_5
    item_number: "5"
    category: "Methods - Study design"
    question: "Study design - Whether data collection was planned before the index test and reference standard were performed (prospective study) or after (retrospective study)"
    evaluation_criteria: "Whether data collection was planned before the index test and reference standard were performed (prospective study) or after (retrospective study)"
    evidence_location_hint: "methods.design"
    severity_if_missing: CRITICAL

  - item_id: STARD_6
    item_number: "6"
    category: "Methods - Participants"
    question: "Participants - Eligibility criteria"
    evaluation_criteria: "Eligibility criteria"
    evidence_location_hint: "methods.participants"
    severity_if_missing: CRITICAL

  - item_id: STARD_7
    item_number: "7"
    category: "Methods - Participants"
    question: "Participants - On what basis potentially eligible participants were identified (such as symptoms, results from previous tests, inclusion in registry)"
    evaluation_criteria: "On what basis potentially eligible participants were identified (such as symptoms, results from previous tests, inclusion in registry)"
    evidence_location_hint: "methods.participants"
    severity_if_missing: MAJOR

  - item_id: STARD_8
    item_number: "8"
    category: "Methods - Participants"
    question: "Participants - Where and when potentially eligible participants were identified (setting, location and dates)"
    evaluation_criteria: "Where and when potentially eligible participants were identified (setting, location and dates)"
    evidence_location_hint: "methods.participants"
    severity_if_missing: MAJOR

  - item_id: STARD_9
    item_number: "9"
    category: "Methods - Participants"
    question: "Participants - Whether participants formed a consecutive, random or convenience series"
    evaluation_criteria: "Whether participants formed a consecutive, random or convenience series"
    evidence_location_hint: "methods.participants"
    severity_if_missing: CRITICAL

  - item_id: STARD_10a
    item_number: "10a"
    category: "Methods - Test methods"
    question: "Test methods - Index test, in sufficient detail to allow replication"
    evaluation_criteria: "Index test, in sufficient detail to allow replication"
    evidence_location_hint: "methods.index_test"
    severity_if_missing: CRITICAL

  - item_id: STARD_10b
    item_number: "10b"
    category: "Methods - Test methods"
    question: "Test methods - Reference standard, in sufficient detail to allow replication"
    evaluation_criteria: "Reference standard, in sufficient detail to allow replication"
    evidence_location_hint: "methods.reference_standard"
    severity_if_missing: CRITICAL

  - item_id: STARD_11
    item_number: "11"
    category: "Methods - Test methods"
    question: "Test methods - Rationale for choosing the reference standard (if alternatives exist)"
    evaluation_criteria: "Rationale for choosing the reference standard (if alternatives exist)"
    evidence_location_hint: "methods.reference_standard"
    severity_if_missing: MAJOR

  - item_id: STARD_12a
    item_number: "12a"
    category: "Methods - Test methods"
    question: "Test methods - Definition of and rationale for test positivity cut-offs or result categories of the index test, distinguishing pre-specified from exploratory"
    evaluation_criteria: "Definition of and rationale for test positivity cut-offs or result categories of the index test, distinguishing pre-specified from exploratory"
    evidence_location_hint: "methods.index_test"
    severity_if_missing: CRITICAL

  - item_id: STARD_12b
    item_number: "12b"
    category: "Methods - Test methods"
    question: "Test methods - Definition of and rationale for test positivity cut-offs or result categories of the reference standard, distinguishing pre-specified from exploratory"
    evaluation_criteria: "Definition of and rationale for test positivity cut-offs or result categories of the reference standard, distinguishing pre-specified from exploratory"
    evidence_location_hint: "methods.reference_standard"
    severity_if_missing: MAJOR

  - item_id: STARD_13a
    item_number: "13a"
    category: "Methods - Test methods"
