# CHEERS 2022 checklist for health economic evaluations.
# Item numbers and text follow the published 28-item checklist exactly; see `source`.
# The previous file used CHEERS 2013 numbering with a/b sub-items and omitted the three
# items CHEERS 2022 added (19 distributional effects, 21 and 25 engagement).

name: "CHEERS 2022"
version: "2022"
source:
  doi: "10.1136/bmj-2021-067975"
  year: 2022
  checklist_version: "CHEERS 2022"
  citation: "Husereau D, Drummond M, Augustovski F, et al. Consolidated Health Economic Evaluation Reporting Standards 2022 (CHEERS 2022) Statement. BMJ 2022;376:e067975."
  checklist_url: "https://www.equator-network.org/reporting-guidelines/cheers/"
applicable_to:
  - "Economic Evaluation"
  - "Cost-Effectiveness Analysis"
  - "Cost-Utility Analysis"
  - "Budget Impact Analysis"
description: "Reporting checklist for health economic evaluations"

items:
  - item_id: CHEERS_1
    item_number: "1"
    category: "Title - Title"
    question: "Title - Identify the study as an economic evaluation and specify the interventions being compared."
    evaluation_criteria: "Identify the study as an economic evaluation and specify the interventions being compared."
    evidence_location_hint: "title"
    severity_if_missing: MINOR

  - item_id: CHEERS_2
    item_number: "2"
    category: "Abstract - Abstract"
    question: "Abstract - Provide a structured summary that highlights context, key methods, results and alternative analyses."
    evaluation_criteria: "Provide a structured summary that highlights context, key methods, results and alternative analyses."
    evidence_location_hint: "abstract"
    severity_if_missing: MINOR

  - item_id: CHEERS_3
    item_number: "3"
    category: "Introduction - Background and objectives"
    question: "Background and objectives - Give the context for the study, the study question and its practical relevance for decision making in policy or practice."
    evaluation_criteria: "Give the context for the study, the study question and its practical relevance for decision making in policy or practice."
    evidence_location_hint: "introduction"
    severity_if_missing: MAJOR

  - item_id: CHEERS_4
    item_number: "4"
    category: "Methods - Health economic analysis plan"
    question: "Health economic analysis plan - Indicate whether a health economic analysis plan was developed and where available."
    evaluation_criteria: "Indicate whether a health economic analysis plan was developed and where available."
    evidence_location_hint: "methods.plan"
    severity_if_missing: MAJOR

  - item_id: CHEERS_5
    item_number: "5"
    category: "Methods - Study population"
    question: "Study population - Describe characteristics of the study population (such as age range, demographics, socioeconomic, or clinical characteristics)."
    evaluation_criteria: "Describe characteristics of the study population (such as age range, demographics, socioeconomic, or clinical characteristics)."
    evidence_location_hint: "methods.population"
    severity_if_missing: CRITICAL

  - item_id: CHEERS_6
    item_number: "6"
    category: "Methods - Setting and location"
    question: "Setting and location - Provide relevant contextual information that may influence findings."
    evaluation_criteria: "Provide relevant contextual information that may influence findings."
    evidence_location_hint: "methods.setting"
    severity_if_missing: MAJOR

  - item_id: CHEERS_7
    item_number: "7"
    category: "Methods - Comparators"
    question: "Comparators - Describe the interventions or strategies being compared and why chosen."
    evaluation_criteria: "Describe the interventions or strategies being compared and why chosen."
    evidence_location_hint: "methods.comparators"
    severity_if_missing: CRITICAL

  - item_id: CHEERS_8
    item_number: "8"
    category: "Methods - Perspective"
    question: "Perspective - State the perspective(s) adopted by the study and why chosen."
    evaluation_criteria: "State the perspective(s) adopted by the study and why chosen."
    evidence_location_hint: "methods.perspective"
    severity_if_missing: CRITICAL

  - item_id: CHEERS_9
    item_number: "9"
    category: "Methods - Time horizon"
    question: "Time horizon - State the time horizon for the study and why appropriate."
    evaluation_criteria: "State the time horizon for the study and why appropriate."
    evidence_location_hint: "methods.time_horizon"
    severity_if_missing: CRITICAL

  - item_id: CHEERS_10
    item_number: "10"
    category: "Methods - Discount rate"
    question: "Discount rate - Report the discount rate(s) and reason chosen."
    evaluation_criteria: "Report the discount rate(s) and reason chosen."
    evidence_location_hint: "methods.discounting"
    severity_if_missing: MAJOR

  - item_id: CHEERS_11
    item_number: "11"
    category: "Methods - Selection of outcomes"
    question: "Selection of outcomes - Describe what outcomes were used as the measure(s) of benefit(s) and harm(s)."
    evaluation_criteria: "Describe what outcomes were used as the measure(s) of benefit(s) and harm(s)."
    evidence_location_hint: "methods.outcomes"
    severity_if_missing: CRITICAL

  - item_id: CHEERS_12
    item_number: "12"
    category: "Methods - Measurement of outcomes"
    question: "Measurement of outcomes - Describe how outcomes used to capture benefit(s) and harm(s) were measured."
    evaluation_criteria: "Describe how outcomes used to capture benefit(s) and harm(s) were measured."
    evidence_location_hint: "methods.outcomes"
    severity_if_missing: CRITICAL

  - item_id: CHEERS_13
    item_number: "13"
    category: "Methods - Valuation of outcomes"
    question: "Valuation of outcomes - Describe the population and methods used to measure and value outcomes."
    evaluation_criteria: "Describe the population and methods used to measure and value outcomes."
    evidence_location_hint: "methods.outcomes"
    severity_if_missing: MAJOR

  - item_id: CHEERS_14
    item_number: "14"
    category: "Methods - Measurement and valuation of resources and costs"
    question: "Measurement and valuation of resources and costs - Describe how costs were valued."
    evaluation_criteria: "Describe how costs were valued."
    evidence_location_hint: "methods.costs"
    severity_if_missing: CRITICAL

  - item_id: CHEERS_15
    item_number: "15"
    category: "Methods - Currency, price date, and conversion"
    question: "Currency, price date, and conversion - Report the dates of the estimated resource quantities and unit costs, plus the currency and year of conversion."
    evaluation_criteria: "Report the dates of the estimated resource quantities and unit costs, plus the currency and year of conversion."
    evidence_location_hint: "methods.costs"
    severity_if_missing: MAJOR

  - item_id: CHEERS_16
    item_number: "16"
    category: "Methods - Rationale and description of model"
    question: "Rationale and description of model - If modelling is used, describe in detail and why used. Report if the model is publicly available and where it can be accessed."
    evaluation_criteria: "If modelling is used, describe in detail and why used. Report if the model is publicly available and where it can be accessed."
    evidence_location_hint: "methods.model"
    severity_if_missing: CRITICAL

  - item_id: CHEERS_17
    item_number: "17"
    category: "Methods - Analytics and assumptions"
    question: "Analytics and assumptions - Describe any methods for analysing or statistically transforming data, any extrapolation methods, and approaches for validating any model used."
    evaluation_criteria: "Describe any methods for analysing or statistically transforming data, any extrapolation methods, and approaches for validating any model used."
    evidence_location_hint: "methods.analysis"
    severity_if_missing: CRITICAL

  - item_id: CHEERS_18
    item_number: "18"
    category: "Methods - Characterizing heterogeneity"
    question: "Characterizing heterogeneity - Describe any methods used for estimating how the results of the study vary for sub-groups."
    evaluation_criteria: "Describe any methods used for estimating how the results of the study vary for sub-groups."
    evidence_location_hint: "methods.heterogeneity"
    severity_if_missing: MAJOR

  - item_id: CHEERS_19
    item_number: "19"
    category: "Methods - Characterizing distributional effects"
    question: "Characterizing distributional effects - Describe how impacts are distributed across different individuals or adjustments made to reflect priority populations."
    evaluation_criteria: "Describe how impacts are distributed across different individuals or adjustments made to reflect priority populations."
    evidence_location_hint: "methods.distributional_effects"
    severity_if_missing: MAJOR

  - item_id: CHEERS_20
    item_number: "20"
    category: "Methods - Characterizing uncertainty"
    question: "Characterizing uncertainty - Describe methods to characterize any sources of uncertainty in the analysis."
    evaluation_criteria: "Describe methods to characterize any sources of uncertainty in the analysis."
    evidence_location_hint: "methods.uncertainty"
    severity_if_missing: CRITICAL

  - item_id: CHEERS_21
    item_number: "21"
    category: "Methods - Approach to engagement with patients and others affected by the study"
    question: "Approach to engagement with patients and others affected by the study - Describe any approaches to engage patients or service recipients, the general public, communities, or stakeholders (e.g., clinicians or payers) in the design of the study."
    evaluation_criteria: "Describe any approaches to engage patients or service recipients, the general public, communities, or stakeholders (e.g., clinicians or payers) in the design of the study."
    evidence_location_hint: "methods.engagement"
    severity_if_missing: MINOR

  - item_id: CHEERS_22
    item_number: "22"
    category: "Results - Study parameters"
    question: "Study parameters - Report all analytic inputs (e.g., values, ranges, references) including uncertainty or distributional assumptions."
    evaluation_criteria: "Report all analytic inputs (e.g., values, ranges, references) including uncertainty or distributional assumptions."
    evidence_location_hint: "results.parameters"
    severity_if_missing: CRITICAL

  - item_id: CHEERS_23
    item_number: "23"
    category: "Results - Summary of main results"
    question: "Summary of main results - Report the mean values for the main categories of costs and outcomes of interest and summarise them in the most appropriate overall measure."
    evaluation_criteria: "Report the mean values for the main categories of costs and outcomes of interest and summarise them in the most appropriate overall measure."
    evidence_location_hint: "results.main"
    severity_if_missing: CRITICAL

  - item_id: CHEERS_24
    item_number: "24"
    category: "Results - Effect of uncertainty"
    question: "Effect of uncertainty - Describe how uncertainty about analytic judgments, inputs, or projections affect findings. Report the effect of choice of discount rate and time horizon, if applicable."
    evaluation_criteria: "Describe how uncertainty about analytic judgments, inputs, or projections affect findings. Report the effect of choice of discount rate and time horizon, if applicable."
    evidence_location_hint: "results.uncertainty"
    severity_if_missing: CRITICAL

  - item_id: CHEERS_25
    item_number: "25"
    category: "Results - Effect of engagement with patients and others affected by the study"
    question: "Effect of engagement with patients and others affected by the study - Report on any difference patient/service recipient, general public, community, or stakeholder involvement made to the approach or findings of the study."
    evaluation_criteria: "Report on any difference patient/service recipient, general public, community, or stakeholder involvement made to the approach or findings of the study."
    evidence_location_hint: "results.engagement"
    severity_if_missing: MINOR

  - item_id: CHEERS_26
    item_number: "26"
    category: "Discussion - Study findings, limitations, generalizability, and current knowledge"
    question: "Study findings, limitations, generalizability, and current knowledge - Report key findings, limitations, ethical or equity considerations not captured, and how these could impact patients, policy, or practice."
    evaluation_criteria: "Report key findings, limitations, ethical or equity considerations not captured, and how these could impact patients, policy, or practice."
    evidence_location_hint: "discussion"
    severity_if_missing: MAJOR

  - item_id: CHEERS_27
    item_number: "27"
    category: "Other relevant information - Source of funding"
    question: "Source of funding - Describe how the study was funded and any role of the funder in the identification, design, conduct, and reporting of the analysis."
    evaluation_criteria: "Describe how the study was funded and any role of the funder in the identification, design, conduct, and reporting of the analysis."
    evidence_location_hint: "other.funding"
    severity_if_missing: MAJOR

  - item_id: CHEERS_28
    item_number: "28"
    category: "Other relevant information - Conflicts of interest"
    question: "Conflicts of interest - Report authors conflicts of interest according to journal or International Committee of Medical Journal Editors requirements."
    evaluation_criteria: "Report authors conflicts of interest according to journal or International Committee of Medical Journal Editors requirements."
    evidence_location_hint: "other.conflicts"
    severity_if_missing: MAJOR
