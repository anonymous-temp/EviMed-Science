[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "evimed-bibliometric-agent"
version = "0.1.0"
description = "Traceable PubMed bibliometric analysis for EviMed Science."
requires-python = ">=3.10"
dependencies = [
  "click>=8.1.0",
  "lxml>=4.9.0",
  "matplotlib>=3.6.0",
  "networkx>=3.0",
  "numpy>=1.23.0",
  "openai>=1.50.0",
  "pandas>=1.5.0",
  "plotly>=5.11.0",
  "python-dotenv>=0.21.0",
  "python-louvain>=0.16",
  "requests>=2.28.0",
  "rich>=13.0.0",
  "scikit-learn>=1.2.0",
  "scipy>=1.10.0",
  "wordcloud>=1.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[project.scripts]
evimed-bibliometric = "bibliometric.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bibliometric"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
