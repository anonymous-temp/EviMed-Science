<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Dual-engine browsers (360, QQ) open a page in their Chromium engine only
         when asked; without this some fall back to the legacy IE engine
         (spec §34.3, appendix E #33). -->
    <meta name="renderer" content="webkit" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/evimed-mark.svg" />
    <meta name="application-name" content="EviMed Science" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f5ef" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171512" />
    <!-- Add to a phone's home screen (public/manifest.json; no service worker).
         Unhashed by the build, so cached for a year like theme-init.js: each ?v= below is a hash of the file it names, written by
         `pnpm tokens:css`, so a changed manifest or icon is a new URL and an installed client picks it up. -->
    <link rel="manifest" href="/manifest.json?v=16c9bc0c" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=b37a45c1" />
    <meta name="apple-mobile-web-app-title" content="EviMed Science" />
    <title>EviMed Science</title>
    <!-- Before first paint (public/theme-init.js). Not hashed by the build, and
         the server caches unhashed files for a year: bump ?v= when it changes. -->
    <script src="/theme-init.js?v=1"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
