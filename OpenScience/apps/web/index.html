<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/evimed-mark.svg" />
    <meta name="application-name" content="EviMed" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafbfc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1318" />
    <!-- Add to a phone's home screen (public/manifest.json; no service worker).
         Unhashed, so cached for a year like theme-init.js: bump ?v= on a change. -->
    <link rel="manifest" href="/manifest.json?v=1" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=1" />
    <meta name="apple-mobile-web-app-title" content="EviMed" />
    <title>EviMed</title>
    <!-- Before first paint (public/theme-init.js). Not hashed by the build, and
         the server caches unhashed files for a year: bump ?v= when it changes. -->
    <script src="/theme-init.js?v=1"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
