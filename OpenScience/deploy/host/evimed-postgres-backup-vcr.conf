# Opt-in drop-in for the existing evimed-postgres-backup.service, installed
# only on a VCR deployment. Create these two protected directories first and
# match them to the deployment's VCR backup/status host paths. Data plane and
# Docker volume roots stay read-only under ProtectSystem=strict.
[Service]
ExecStartPost=/usr/bin/env node --env-file=/srv/evimed-science/current/OpenScience/deploy/web/.env /srv/evimed-science/current/OpenScience/scripts/ops/backup-scheduler.mjs vcr
ReadWritePaths=/srv/evimed-science/shared/backups/vcr /srv/evimed-science/shared/vcr-backup-status
TimeoutStartSec=60m
