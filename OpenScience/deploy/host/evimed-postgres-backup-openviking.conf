# Drop-in for the existing evimed-postgres-backup.service: after the platform
# database's dump, an encrypted, verified copy of the OpenViking engine volume
# (scripts/ops/openviking-backup.mjs). Install it beside the unit as
#   /etc/systemd/system/evimed-postgres-backup.service.d/openviking.conf
# Create the two directories first (0700 for the archives; the status
# directory is mounted read-only into the web container) and set
# OPEN_SCIENCE_OPENVIKING_BACKUP_ENABLED, _DIR and _STATUS_DIR in the
# deployment's .env. The engine is paused, not stopped, for the copy: about a
# second on a volume of tens of megabytes, at most
# OPEN_SCIENCE_OPENVIKING_BACKUP_MAX_PAUSE_SECONDS. Docker volumes stay
# read-only under ProtectSystem=strict; the capture reads the volume through a
# helper container with no network.
[Service]
ExecStartPost=/usr/bin/env node --env-file=/srv/evimed-science/current/OpenScience/deploy/web/.env /srv/evimed-science/current/OpenScience/scripts/ops/openviking-backup.mjs run
ReadWritePaths=/srv/evimed-science/shared/backups/openviking /srv/evimed-science/shared/openviking-backup-status
