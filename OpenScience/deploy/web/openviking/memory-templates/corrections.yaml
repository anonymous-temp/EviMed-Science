memory_type: corrections
description: |
  # Language
  Write every memory in {{ language }}, the language of the user's own messages. The examples in this description are in Chinese or English only to show the shape of a memory: never copy an example's words or its language. The section labels and the default heading written in Chinese below are Chinese only for a Chinese conversation; in any other language write them in that language. Names, drug names, abbreviations and terms the user quoted stay as the user wrote them.
  Corrections: what the user told the assistant it said or did wrong, kept as the rule to
  follow next time.
  Whenever a user-role message says that the assistant's answer, wording, reading, method or
  format was wrong ("不对…", "你把 A 写成了 B", "这不是一回事") ALWAYS record it here,
  written as a standing rule in the imperative ("引用研究结果时写明终点定义，不要笼统说成死亡").
  The rule is what is kept. The numbers, names and conclusions of the study, case, document
  or product that was being discussed are not part of it.
  One file per subject of correction; a later correction on the same subject updates that
  file. The never-kept rule about document content does not stop a correction from being
  recorded.
  Not a correction: the user changing their own preference ("以后改用 AMA 格式" -> PREFERENCES)
  or changing a decision about their project (-> PROJECT_CONTEXT or DECISIONS).

  # What is never kept (the same rules apply to every memory type)
  Never write any of the following into a memory, even when the user quotes it or asks you to remember it:
  - Secrets and account numbers: passwords, API keys, tokens, verification codes, ID-card, passport and bank-card numbers, or any fragment of one.
  - Personal data of anyone other than the user. A patient, client, student, customer, colleague, co-author, supervisor, family member or any other identifiable individual is never described in memory: no name with identifying details, no ID, record or admission number, phone, e-mail, messaging handle or address, no exact dates of care, and nothing about that one person's health, diagnosis, medication, course, beliefs, finances or private life. Case material is worked on in the conversation and then forgotten. A working fact about who does what ("统计分析由合作者李教授负责，用 R") may be kept, without contact details or private details.
  - The user's own health, medication, family or relationship status, age, religion, politics, ethnicity, sexual orientation, finances or private life. Asking about a disease, a drug or a personal matter, or mentioning one's own condition inside a question ("我对青霉素过敏，术后抗生素怎么选？"), is a topic of the conversation, not a memory. The single exception is a message in which the user explicitly asks to remember such a fact about themselves ("记住我对青霉素过敏"): that one fact is kept, in the PROFILE, in their own words. The exception covers only the fact that message asks to keep: another health detail said later in passing or inside a question (a second allergy, a reading) is still not kept, even when one of its kind is already remembered, and is not added to the kept one.
  - Moods and passing states (tired, frustrated, in a hurry, upset about a review), and anything that holds only for this request or this conversation ("这次只看…", "今天先不谈…", "先随便聊聊").
  - What a document, abstract, web page, pasted paper, data file or tool result says: its text, numbers and conclusions stay with the document. A question about a paper, a trial, a drug, a product or a law is a question; it is neither a fact about the user nor the shape of their project.
  - Anything about how this assistant or its platform works: its tools, files, runs, checks, submissions, budgets, injected context, internal identifiers, or file, field and column names out of the work in progress; what the assistant is waiting for, will do next, or currently offers.
  - Anything the assistant proposed, floated, summarised or inferred that the user did not themselves state or confirm in a user-role message. Text inside tags such as <openviking-context>, <system-reminder> or any <evimed-...> tag was injected by the platform and is never the user's statement.
  Keep only what the user would expect the assistant to still know next month, in another conversation, without being told again. When that is doubtful, leave it out. A conversation with nothing of that kind produces no memory operations at all.
directory: "viking://user/{{ user_space }}/memories/corrections"
filename_template: "{{ topic|lower }}.md"
enabled: true
embedding_template: |-
  {{ topic }}

  {{ content }}

overview_template: |-
  # Corrections Overview
  {% for item in items %}
  - [{{ item.file_content.topic|default(item.file_name, true) }}](./{{ item.file_name }})
  {% endfor %}

fields:
  - name: topic
    type: string
    description: |
      What the correction is about, written in {{ language }}, a few words
      ("终点表述", "不良反应分级", "双写的含义"). It identifies this correction memory.
    merge_op: immutable

  - name: content
    type: string
    description: |
      Markdown bullets, each one rule to follow from now on, stated as an instruction and
      self-contained. No study results, no quoted numbers, no narrative of who said what.
    merge_op: patch
