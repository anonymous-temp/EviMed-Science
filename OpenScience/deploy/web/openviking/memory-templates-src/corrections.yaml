memory_type: corrections
description: |
  __LANGUAGE__
  Corrections and confirmed approaches: what the user told the assistant it did wrong, how they
  reshaped what it produced, and approaches they adopted, each kept as the rule to follow next
  time, written as an imperative ("引用研究结果时写明终点定义，不要笼统说成死亡").
  Write one whenever a user-role message:
  - says the assistant's answer, wording, reading, method or format was wrong ("不对…",
    "你把 A 写成了 B", "这不是一回事");
  - reshapes what the assistant produced because its form missed ("太长", "别用被动",
    "先给结论再给依据"), the rule applying to the kind of thing it was said about;
  - adopts an approach by name ("好，就按这个三栏表来，其他材料也这样", "对，用 IPTW"). A bare
    "不错" or "谢谢" is not the approval of an approach.
  A rule that lays out a document or an answer ("先给结论再给依据") is kept as its places and
  what the user fills them with ("每条先写结论；依据只写用户给过的，没给就不写"), never as content
  to produce: a place in a layout is not a promise that there is something to put in it.
  The rule is what is kept. The numbers, names and conclusions of the study, case, document
  or product that was being discussed are not part of it.
  One file per subject; a later correction on the same subject updates that file. The
  never-kept rule about document content does not stop a correction from being recorded.
  Not a correction: the user changing their own preference ("以后改用 AMA 格式" -> PREFERENCES)
  or changing a decision about their project (-> PROJECT_CONTEXT or DECISIONS), and fixing a
  number or a sentence in this one draft ("第二条数字错了，应该是 37%"). Nor is the user holding to a
  claim of theirs against what the assistant pointed out ("我知道研究是这么说的，但我还是认定…，你就按我的
  意思写"): the assistant was not wrong, the request is for that one text, and the claim is their stance —
  nothing of it is kept, neither the claim nor a rule to write as they say or to stop pointing out evidence.

  __NEVER_KEEP__

  __DECIDE__
directory: "viking://user/{{ user_space }}/memories/preferences/corrections"
filename_template: "{{ topic|lower }}.md"
enabled: true
embedding_template: |-
  {{ topic }}

  {{ content }}

overview_template: |-
  # Corrections Overview
  {% for item in items %}
  - [{{ item.file_content.topic|default(item.file_name, true) }}](./{{ item.file_name }})
  {% endfor %}

fields:
  - name: topic
    type: string
    description: |
      What the correction is about, written in {{ language }}, a few words
      ("终点表述", "不良反应分级", "双写的含义"). It identifies this correction memory.
    merge_op: immutable

  - name: content
    type: string
    description: |
      Markdown bullets, each one rule to follow from now on, stated as an instruction and
      self-contained. No study results, no quoted numbers, no narrative of who said what.
    merge_op: patch
