memory_type: follow_ups
description: |
  Follow-ups: something the user said they still have to do, are waiting for, or asked to be
  reminded of, that does NOT belong to one project's card ("下个月要交年度总结，到时提醒我",
  "等法务回复后再定合同模板"). An open item of one particular project is a line under
  阶段 in that project's PROJECT_CONTEXT card and is not written here as well.
  Only what the user stated as theirs in a user-role message. Never a next step, a
  suggestion or a list the assistant produced; never what the assistant is waiting for.
  One file per subject. When the user says an item is done or dropped, remove it; delete
  the file when nothing in it is open.

  __NEVER_KEEP__
directory: "viking://user/{{ user_space }}/memories/follow_ups"
filename_template: "{{ topic|lower }}.md"
enabled: true
embedding_template: |-
  {{ topic }}

  {{ content }}

overview_template: |-
  # Follow-ups Overview
  {% for item in items %}
  - [{{ item.file_content.topic|default(item.file_name, true) }}](./{{ item.file_name }})
  {% endfor %}

fields:
  - name: topic
    type: string
    description: |
      What is open, written in {{ language }}, a few words. It identifies this memory.
    merge_op: immutable

  - name: content
    type: string
    description: |
      Markdown bullets, one per open item: what is open, what it waits on, and a date only
      when the user gave one.
    merge_op: patch
