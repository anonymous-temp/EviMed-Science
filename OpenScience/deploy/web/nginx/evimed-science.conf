# The public site, as installed on the production host at
# /etc/nginx/sites-enabled/evimed-science (recorded here 2026-09-29).
#
# Until then this file existed only on the host: a rebuilt host would have lost
# the TLS listener, the ACME path the short-lived certificate renews through,
# the gzip settings that took one conversation from 4.5 MB on the wire, and the
# hour-long proxy timeouts the event stream needs. Install it with the runtime
# UI site beside it, then `nginx -t && systemctl reload nginx`.
#
# Upstream: the web container publishes 8787 on loopback as
# ${OPEN_SCIENCE_API_PORT} (18887 on production). The host is shared with
# other products; their `include /etc/nginx/snippets/*.conf` lines sit where
# the comments below say and are theirs, not ours.
server {
    listen 80;
    listen [::]:80;
    server_name 82.156.128.153;

    # The certificate is Let's Encrypt's short-lived IP profile, renewed by
    # webroot into this directory.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/evimed-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    # (other products' HTTP snippets are included here on the shared host)

    location / {
        return 308 https://82.156.128.153$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 82.156.128.153;

    ssl_certificate /etc/letsencrypt/live/82.156.128.153/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/82.156.128.153/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:EviMedTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 75m;

    # A public path that answers 204 to POST. Alertmanager used to be pointed
    # here, which dropped every alert; since 2026-09-28 it posts to the control
    # plane's own receiver inside the compose network. Kept so an old
    # configuration still gets an answer rather than the application's page.
    location ^~ /ops/alert-receiver/ {
        limit_except POST { deny all; }
        access_log off;
        return 204;
    }

    # (other products' exact-path snippets are included here, before the
    # catch-all, on the shared host)

    location / {
        proxy_pass http://127.0.0.1:18887;
        # Text crosses the public link compressed. Until 2026-09-19 nothing
        # did: gzip_proxied is off by default, and opening one conversation
        # moved 4.5 MB of JavaScript, CSS and JSON as it was. The event stream
        # (text/event-stream) is not listed, so it is never buffered.
        gzip on;
        gzip_proxied any;
        gzip_vary on;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml text/plain;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
