# As installed on the production host at /etc/nginx/sites-available/evimed-runtime-ui
# (linked from sites-enabled; recorded here 2026-09-29). The upstream is the web
# container's runtime UI port, published on loopback as
# ${OPEN_SCIENCE_RUNTIME_UI_HOST_PORT} (8788).
#
# The kernel browser application, on an origin of its own.
#
# It is a separate listener rather than a path under the main site because the
# application builds every URL it fetches from `location.origin`: its plugin
# bundles are `/plugins/??...` and its method calls are `/api/<method>`, both
# absolute. Behind a path prefix those reach the control plane, which answers
# them with its own single-page document -- every request reads 200 and the
# page dies at boot. Same host, another port: a different origin, so the
# embedding page cannot read into the frame; the same site, because ports are
# not part of a site, so the session cookie is still sent.
#
# Nothing else is included here on purpose. This server block serves one
# application and shares no snippet with the twelve other apps on this host.
server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name 82.156.128.153;

    ssl_certificate /etc/letsencrypt/live/82.156.128.153/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/82.156.128.153/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:EviMedTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 75m;

    location / {
        proxy_pass http://127.0.0.1:8788;
        # Text crosses the public link compressed. Until 2026-09-19 nothing
        # did: gzip_proxied is off by default, and opening one conversation
        # moved 4.5 MB of JavaScript, CSS and JSON as it was. The event stream
        # (text/event-stream) is not listed, so it is never buffered.
        gzip on;
        gzip_proxied any;
        gzip_vary on;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml text/plain;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
