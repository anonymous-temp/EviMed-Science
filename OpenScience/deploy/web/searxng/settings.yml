# SearXNG for the EviMed open-web channel.
#
# This instance is reachable only from the compose network — the server's
# /internal/search/v1/query route is the sole caller, and nothing publishes a
# port. That is why the bot limiter is off: it exists to stop anonymous public
# abuse, and here the only client already authenticated with a runtime token.
#
# The engine list is a measurement, and measurements expire. Asked from inside
# the deployment rather than probed at the hosts, this is what answers:
#
#   general  — 360search and Baidu only. Google, DuckDuckGo, Brave, Startpage,
#              Wikipedia, Wiby, Yep, Encyclosearch and Tusksearch return nothing
#              or do not resolve; Mojeek answers 403 to datacenter addresses;
#              Sogou serves a CAPTCHA and then suspends itself for an hour; Bing
#              answers the host but serves markup the parser extracts nothing
#              from. The general channel is therefore Chinese-language-skewed.
#   science  — arXiv, OpenAIRE publications and datasets, PubMed, PDBe. This is
#              the productive category from here: 46 results in 4.5 s on a
#              pharmacology query, and OpenAIRE carries EU project, funding and
#              dataset records that no bibliographic connector in this platform
#              reaches.
#
# Everything measured dead is disabled rather than left to spend the request
# timeout: `google cse` alone cost ten seconds on every search before it was.

use_default_settings: true

general:
  instance_name: "EviMed Web Search"
  # Nothing here is a person's query; there is no user-facing UI to link to.
  contact_url: false
  enable_metrics: false

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "" # supplied by SEARXNG_SECRET
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"

search:
  # JSON is what the gateway consumes; the HTML UI stays available for a human
  # operator debugging engine health from inside the network.
  formats:
    - html
    - json
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"

outgoing:
  # An aggregator is as slow as its slowest engine. Three seconds is enough for
  # the engines that do answer from this host and short enough that the dead
  # ones cannot dominate a query.
  request_timeout: 3.0
  max_request_timeout: 6.0
  pool_connections: 20
  pool_maxsize: 10
  enable_http2: true

engines:
  # Measured returning nothing, or not resolving at all, from this host.
  - name: google
    disabled: true
  - name: google cse
    disabled: true
  - name: google cse images
    disabled: true
  - name: google news
    disabled: true
  - name: google scholar
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: brave
    disabled: true
  - name: startpage
    disabled: true
  - name: qwant
    disabled: true
  - name: mojeek
    disabled: true
  - name: wikipedia
    disabled: true
  - name: wikidata
    disabled: true
  - name: reuters
    disabled: true
  - name: yep
    disabled: true
  - name: encyclosearch
    disabled: true
  - name: tusksearch
    disabled: true
  - name: wiby
    disabled: true
  # Answers with a CAPTCHA and then suspends itself for an hour.
  - name: sogou
    disabled: true
  # bing.com answers this host directly, but the parser extracts nothing from
  # what it serves here. Kept because it costs one request and may start
  # working; do not count it as a channel until it returns rows.
  - name: bing
    disabled: false

  # Verified returning parsed results.
  - name: 360search
    disabled: false
  - name: baidu
    disabled: false
  - name: arxiv
    disabled: false
  - name: openairepublications
    disabled: false
  - name: openairedatasets
    disabled: false
