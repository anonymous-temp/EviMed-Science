# SearXNG for the EviMed open-web channel.
#
# This instance is reachable only from the compose network — the server's
# /internal/search/v1/query route is the sole caller, and nothing publishes a
# port. That is why the bot limiter is off: it exists to stop anonymous public
# abuse, and here the only client already authenticated with a runtime token.
#
# The engine list is a deployment fact, not a preference. Measured from the
# production host: Google, DuckDuckGo, Brave, Startpage, and Wikipedia do not
# resolve at all; Mojeek answers 403 to datacenter addresses; Sogou serves a
# CAPTCHA and then suspends itself for an hour. What answers with parsed rows
# is 360search, Baidu, and Marginalia. Re-check after any egress change — this
# list is a measurement, and measurements expire.

use_default_settings: true

general:
  instance_name: "EviMed Web Search"
  # Nothing here is a person's query; there is no user-facing UI to link to.
  contact_url: false
  enable_metrics: false

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "" # supplied by SEARXNG_SECRET
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"

search:
  # JSON is what the gateway consumes; the HTML UI stays available for a human
  # operator debugging engine health from inside the network.
  formats:
    - html
    - json
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"

outgoing:
  # An aggregator is as slow as its slowest engine. Three seconds is enough for
  # the engines that do answer from this host and short enough that the dead
  # ones cannot dominate a query.
  request_timeout: 3.0
  max_request_timeout: 6.0
  pool_connections: 20
  pool_maxsize: 10
  enable_http2: true

engines:
  # Unreachable from this host, measured rather than assumed. Left enabled they
  # spend the request timeout on every query and return nothing; `google cse`
  # alone cost ten seconds a search before it was turned off.
  - name: google
    disabled: true
  - name: google cse
    disabled: true
  - name: google news
    disabled: true
  - name: google scholar
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: brave
    disabled: true
  - name: startpage
    disabled: true
  - name: qwant
    disabled: true
  - name: mojeek
    disabled: true
  - name: wikipedia
    disabled: true
  - name: wikidata
    disabled: true
  - name: reuters
    disabled: true
  # bing.com answers this host directly, but SearXNG's parser extracts nothing
  # from what it serves here — a scrape, not an API, and the markup differs by
  # client. Kept enabled because it costs one request and may start working;
  # do not count it as a channel until it returns rows.
  - name: bing
    disabled: false
  # Answers with a CAPTCHA and then suspends itself for an hour.
  - name: sogou
    disabled: true

  # Verified returning parsed results from this host.
  - name: 360search
    disabled: false
  - name: baidu
    disabled: false
  # Indexes small independent sites the majors bury. On a pharmacology probe it
  # was the only engine that surfaced journal DOIs and repository records.
  - name: marginalia
    disabled: false
