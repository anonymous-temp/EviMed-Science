# SearXNG for the EviMed open-web channel.
#
# This instance is reachable only from the compose network — the server's
# /internal/search/v1/query route is the sole caller, and nothing publishes a
# port. That is why the bot limiter is off: it exists to stop anonymous public
# abuse, and here the only client already authenticated with a runtime token.
#
# The engine list is a measurement, and measurements expire. Re-measured on
# 2026-09-21 from inside the deployment, one engine at a time (`engines=<name>`),
# on an English and a Chinese clinical query:
#
#   general  — only Quark answers (8–9 rows, ~1 s). The list measured before it
#              had gone dark underneath the channel: 360search and Bing return
#              no rows, Baidu, Sogou and ChinaSo serve a CAPTCHA and suspend
#              themselves for an hour, and Google, DuckDuckGo, Brave, Startpage,
#              Yahoo, Wikipedia and Mojeek time out or refuse this address.
#   science  — PubMed (20 rows on English, none on Chinese) and Crossref (20
#              rows on both) answer, in 3–4 s, which the three-second default
#              cut off. arXiv times out (and answered 406 before that), OpenAIRE
#              and PDBe time out, Semantic Scholar answers 403.
#   news     — Sogou WeChat (10 rows on both languages, WeChat public-account
#              articles); every other news engine timed out.
#
# Everything measured dead is disabled rather than left to spend the request
# timeout: `google cse` alone cost ten seconds on every search before it was.

use_default_settings: true

general:
  instance_name: "EviMed Web Search"
  # Nothing here is a person's query; there is no user-facing UI to link to.
  contact_url: false
  enable_metrics: false

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "" # supplied by SEARXNG_SECRET
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"

search:
  # JSON is what the gateway consumes; the HTML UI stays available for a human
  # operator debugging engine health from inside the network.
  formats:
    - html
    - json
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"

outgoing:
  # An aggregator is as slow as its slowest engine. Three seconds is enough for
  # the engines that do answer from this host and short enough that the dead
  # ones cannot dominate a query.
  request_timeout: 3.0
  max_request_timeout: 6.0
  pool_connections: 20
  pool_maxsize: 10
  enable_http2: true

engines:
  # Measured returning nothing, or not resolving at all, from this host.
  - name: google
    disabled: true
  - name: google cse
    disabled: true
  - name: google cse images
    disabled: true
  - name: google news
    disabled: true
  - name: google scholar
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: brave
    disabled: true
  - name: startpage
    disabled: true
  - name: qwant
    disabled: true
  - name: mojeek
    disabled: true
  - name: wikipedia
    disabled: true
  - name: wikidata
    disabled: true
  - name: reuters
    disabled: true
  - name: yep
    disabled: true
  - name: encyclosearch
    disabled: true
  - name: tusksearch
    disabled: true
  - name: wiby
    disabled: true
  # Answers with a CAPTCHA and then suspends itself for an hour.
  - name: sogou
    disabled: true
  - name: baidu
    disabled: true
  - name: chinaso
    disabled: true
  - name: presearch
    disabled: true
  # Answer this host with no rows (2026-09-21). Bing costs one fast request and
  # may start parsing again; 360search carries a 20-second engine timeout, and
  # an engine that can hold the whole query that long for nothing is off.
  - name: bing
    disabled: false
  - name: 360search
    disabled: true
  - name: yahoo
    disabled: true
  # Time out or refuse this host (2026-09-21).
  - name: arxiv
    disabled: true
  - name: openairepublications
    disabled: true
  - name: openairedatasets
    disabled: true
  - name: pdbe
    disabled: true
  - name: semantic scholar
    disabled: true
  - name: duckduckgo news
    disabled: true
  - name: startpage news
    disabled: true
  - name: wikinews
    disabled: true
  - name: brave.news
    disabled: true

  # Verified returning parsed results on 2026-09-21. The bibliographic two need
  # longer than the three-second default — they answered in three to four —
  # and `max_request_timeout` above caps the whole search at six anyway.
  - name: quark
    disabled: false
    timeout: 5.0
  - name: pubmed
    disabled: false
    timeout: 6.0
  - name: crossref
    disabled: false
    timeout: 6.0
  - name: sogou wechat
    disabled: false
    timeout: 5.0
