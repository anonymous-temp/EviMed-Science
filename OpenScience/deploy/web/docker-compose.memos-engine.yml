services:
  open-science-web:
    environment:
      OPEN_SCIENCE_MEMOS_ENGINE_URL: http://evimed-memos-engine:8000
      OPEN_SCIENCE_REQUIRE_MEMORY_INDEX: "true"
    depends_on:
      evimed-memos-engine:
        condition: service_healthy
    networks:
      - default
      - runtime-internal
      - memory-index-internal

  evimed-memos-engine:
    image: ${OPEN_SCIENCE_MEMOS_ENGINE_IMAGE:-evimed-memos-engine:2.0.30}
    build:
      context: ../..
      dockerfile: deploy/memos-engine/Dockerfile
      args:
        APT_MIRROR: ${OPEN_SCIENCE_APT_MIRROR:-http://deb.debian.org/debian}
        DEBIAN_SECURITY_MIRROR: ${OPEN_SCIENCE_DEBIAN_SECURITY_MIRROR:-http://deb.debian.org/debian-security}
        PIP_INDEX_URL: ${OPEN_SCIENCE_PIP_INDEX_URL:-https://pypi.org/simple}
    environment:
      EVIMED_MEMOS_PROVIDER_CONFIG: /run/secrets/memos-engine-providers.json
      OLLAMA_API_BASE: http://evimed-memos-ollama:11434
      GRAPH_DB_BACKEND: neo4j-community
      NEO4J_URI: bolt://evimed-memos-neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_DB_NAME: neo4j
      MOS_NEO4J_SHARED_DB: "true"
      QDRANT_HOST: evimed-memos-qdrant
      QDRANT_PORT: "6333"
      MOS_ENABLE_SCHEDULER: "true"
      MEMSCHEDULER_USE_REDIS_QUEUE: "true"
      MEMSCHEDULER_REDIS_HOST: evimed-memos-redis
      MEMSCHEDULER_REDIS_PORT: "6379"
      MEMSCHEDULER_REDIS_DB: "0"
      MEMSCHEDULER_STREAM_KEY_PREFIX: evimed-memos
      REDIS_URL: redis://evimed-memos-redis:6379/0
      ENABLE_PREFERENCE_MEMORY: "false"
      ENABLE_ACTIVATION_MEMORY: "false"
      ENABLE_INTERNET: "false"
      MOS_ENABLE_REORGANIZE: "false"
      INCLUDE_EMBEDDING: "true"
    volumes:
      - evimed-memos-engine-data:/var/lib/memos
      - evimed-memos-secrets:/run/secrets:ro
    depends_on:
      evimed-memos-neo4j:
        condition: service_healthy
      evimed-memos-qdrant:
        condition: service_healthy
      evimed-memos-redis:
        condition: service_healthy
      evimed-memos-ollama:
        condition: service_healthy
      evimed-memos-secrets-init:
        condition: service_completed_successfully
    networks:
      - memory-index-internal
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=128m
    restart: unless-stopped

  evimed-memos-neo4j:
    image: neo4j:5.26.12-community
    environment:
      NEO4J_AUTH_FILE: /run/secrets/neo4j-auth
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 768m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - evimed-memos-neo4j-data:/data
      - evimed-memos-secrets:/run/secrets:ro
    depends_on:
      evimed-memos-secrets-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
      - memory-index-internal
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1280m
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  evimed-memos-qdrant:
    image: qdrant/qdrant:v1.15.4
    volumes:
      - evimed-memos-qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - memory-index-internal
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  evimed-memos-redis:
    image: redis:7.4.5-alpine
    user: "999:1000"
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1", "--maxmemory", "192mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - evimed-memos-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      - memory-index-internal
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  # This service has network access only while it verifies or materializes the
  # exact reviewed embedding model. It exits before the private runtime starts.
  evimed-memos-ollama-init:
    image: ollama/ollama:0.33.3@sha256:32931b46719f673c05fdbaa81ccb26da18ea4a1c57590a754874ab28ba269eb2
    user: "0:0"
    entrypoint: ["/bin/sh", "/opt/evimed/init-ollama-model.sh"]
    environment:
      EVIMED_OLLAMA_MODEL: bge-m3:latest
      EVIMED_OLLAMA_MODEL_MANIFEST_SHA256: 7907646426070047a77226ac3e684fbbe8410524f7b4a74d02837e43f2146bab
      EVIMED_OLLAMA_STORE: /var/lib/ollama
      HOME: /var/lib/ollama
      OLLAMA_MODELS: /var/lib/ollama/current/models
      OLLAMA_HOST: 127.0.0.1:11434
    volumes:
      - evimed-memos-ollama-data:/var/lib/ollama
      - ../memos-ollama/init-model.sh:/opt/evimed/init-ollama-model.sh:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    restart: "no"

  # The long-lived embedding service has no published port and joins only the
  # internal memory network, so the unauthenticated Ollama API has no egress or
  # customer-reachable surface after initialization.
  evimed-memos-ollama:
    image: ollama/ollama:0.33.3@sha256:32931b46719f673c05fdbaa81ccb26da18ea4a1c57590a754874ab28ba269eb2
    user: "10002:10002"
    environment:
      HOME: /tmp/ollama
      OLLAMA_MODELS: /var/lib/ollama/current/models
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NOHISTORY: "1"
      # Keep the reviewed bge-m3 model (~1.2 GB resident) inside the existing
      # 3 GiB limit. The engine's embedding health probe warms it before web readiness.
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - evimed-memos-ollama-data:/var/lib/ollama:ro
    depends_on:
      evimed-memos-ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/bin/ollama", "show", "bge-m3:latest"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks:
      - memory-index-internal
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3g
          pids: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m
    restart: unless-stopped

  # Host secrets remain owner-only. This offline one-shot copies them into a
  # private named volume with the service UIDs that must read them.
  evimed-memos-secrets-init:
    image: ${OPEN_SCIENCE_MEMOS_ENGINE_IMAGE:-evimed-memos-engine:2.0.30}
    user: "0:0"
    entrypoint: ["python", "-c"]
    command:
      - |
        import os, pathlib
        output = pathlib.Path('/output')
        output.mkdir(parents=True, exist_ok=True)
        for source, name, uid, gid in (
            ('/input/providers.json', 'memos-engine-providers.json', 10001, 10001),
            ('/input/neo4j-auth', 'neo4j-auth', 7474, 7474),
        ):
            target = output / name
            temporary = output / (name + '.tmp')
            with open(source, 'rb') as stream:
                payload = stream.read(16385)
            if not payload or len(payload) > 16384:
                raise SystemExit('protected memory secret has invalid size')
            with open(temporary, 'wb') as stream:
                stream.write(payload)
                stream.flush()
                os.fsync(stream.fileno())
            os.chmod(temporary, 0o600)
            os.chown(temporary, uid, gid)
            os.replace(temporary, target)
    volumes:
      - type: bind
        source: ${OPEN_SCIENCE_MEMOS_ENGINE_PROVIDER_CONFIG_HOST_FILE:?set OPEN_SCIENCE_MEMOS_ENGINE_PROVIDER_CONFIG_HOST_FILE}
        target: /input/providers.json
        read_only: true
      - type: bind
        source: ${OPEN_SCIENCE_MEMOS_NEO4J_AUTH_HOST_FILE:?set OPEN_SCIENCE_MEMOS_NEO4J_AUTH_HOST_FILE}
        target: /input/neo4j-auth
        read_only: true
      - evimed-memos-secrets:/output
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    restart: "no"

volumes:
  evimed-memos-engine-data:
  evimed-memos-neo4j-data:
  evimed-memos-qdrant-data:
  evimed-memos-redis-data:
  evimed-memos-ollama-data:
  evimed-memos-secrets:

networks:
  memory-index-internal:
    internal: true
