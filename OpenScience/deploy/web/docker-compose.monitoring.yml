services:
  open-science-web:
    environment:
      OPEN_SCIENCE_OPERATOR_METRICS_TOKEN: ""
      OPEN_SCIENCE_OPERATOR_METRICS_TOKEN_FILE: /run/secrets/operator_metrics_token
    secrets:
      - operator_metrics_token

  prometheus:
    image: prom/prometheus:${OPEN_SCIENCE_PROMETHEUS_VERSION:-v3.13.0}
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.json
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${OPEN_SCIENCE_PROMETHEUS_RETENTION_TIME:-30d}
      - --storage.tsdb.retention.size=${OPEN_SCIENCE_PROMETHEUS_RETENTION_SIZE:-10GB}
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.json:/etc/prometheus/prometheus.json:ro
      - ./monitoring/open-science.rules.json:/etc/prometheus/rules/open-science.rules.json:ro
      - prometheus-data:/prometheus
    secrets:
      - operator_metrics_token
    ports:
      - "127.0.0.1:${OPEN_SCIENCE_PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - open-science-web
      - blackbox-exporter
      - alertmanager
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:${OPEN_SCIENCE_BLACKBOX_EXPORTER_VERSION:-v0.28.0}
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/blackbox/blackbox.json
    volumes:
      - ./monitoring/blackbox.json:/etc/blackbox/blackbox.json:ro
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:${OPEN_SCIENCE_ALERTMANAGER_VERSION:-v0.33.1}
    profiles: ["monitoring"]
    command:
      - --config.file=/run/secrets/alertmanager_config
      - --storage.path=/alertmanager
    secrets:
      - alertmanager_config
    volumes:
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:${OPEN_SCIENCE_ALERTMANAGER_PORT:-9093}:9093"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:${OPEN_SCIENCE_GRAFANA_VERSION:-13.1.0}
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${OPEN_SCIENCE_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/open-science-operations.json
    secrets:
      - grafana_admin_password
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${OPEN_SCIENCE_GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

secrets:
  operator_metrics_token:
    file: ${OPEN_SCIENCE_MONITORING_SECRETS_DIR:-./secrets}/operator-metrics-token.txt
  grafana_admin_password:
    file: ${OPEN_SCIENCE_MONITORING_SECRETS_DIR:-./secrets}/grafana-admin-password.txt
  alertmanager_config:
    file: ${OPEN_SCIENCE_MONITORING_SECRETS_DIR:-./secrets}/alertmanager.json

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
