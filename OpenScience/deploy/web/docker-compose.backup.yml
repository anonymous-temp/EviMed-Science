services:
  open-science-web:
    environment:
      OPEN_SCIENCE_BACKUP_MODE: local
      OPEN_SCIENCE_BACKUP_ENCRYPTION_ACK: "true"
      OPEN_SCIENCE_RESTORE_DRILL_ACK: "true"
    depends_on:
      open-science-backup:
        condition: service_healthy

  open-science-backup:
    image: ${OPEN_SCIENCE_WEB_CONTAINER_IMAGE:-open-science-web:0.1.3}
    command: ["node", "scripts/ops/backup-scheduler.mjs", "run"]
    profiles: ["backup"]
    environment:
      NODE_ENV: production
      OPEN_SCIENCE_DATA_DIR: /data
      OPEN_SCIENCE_BACKUP_DIR: /backups
      OPEN_SCIENCE_BACKUP_STATE_FILE: /backups/.open-science-backup-state.json
      # The restore drill extracts a whole archive, and /tmp here is a 2 GB
      # tmpfs. Unset, the drill defaulted there, ran out of room on a 1.8 GB
      # data directory, and every backup was recorded as failed — while the
      # archive it had just written verified fine. That failure is what drove
      # the retry loop that filled the disk with 107 archives.
      OPEN_SCIENCE_RESTORE_DRILL_DIR: /backups/.restore-drill
      OPEN_SCIENCE_BACKUP_PASSPHRASE_FILE: /run/secrets/backup-passphrase
      OPEN_SCIENCE_BACKUP_RETENTION_DAYS: ${OPEN_SCIENCE_BACKUP_RETENTION_DAYS:-30}
      OPEN_SCIENCE_BACKUP_INTERVAL_SECONDS: ${OPEN_SCIENCE_BACKUP_INTERVAL_SECONDS:-86400}
      OPEN_SCIENCE_BACKUP_HEALTH_GRACE_SECONDS: ${OPEN_SCIENCE_BACKUP_HEALTH_GRACE_SECONDS:-1800}
      OPEN_SCIENCE_BACKUP_RETRY_SECONDS: ${OPEN_SCIENCE_BACKUP_RETRY_SECONDS:-300}
      OPEN_SCIENCE_BACKUP_MAX_FAILURES: ${OPEN_SCIENCE_BACKUP_MAX_FAILURES:-3}
      OPEN_SCIENCE_BACKUP_RESTORE_DRILL_EVERY: ${OPEN_SCIENCE_BACKUP_RESTORE_DRILL_EVERY:-1}
      OPEN_SCIENCE_OBJECT_BACKUP_URI: ${OPEN_SCIENCE_OBJECT_BACKUP_URI:-}
      OPEN_SCIENCE_OBJECT_BACKUP_CLI: ${OPEN_SCIENCE_OBJECT_BACKUP_CLI:-aws}
      OPEN_SCIENCE_OBJECT_BACKUP_SSE: ${OPEN_SCIENCE_OBJECT_BACKUP_SSE:-}
      OPEN_SCIENCE_OBJECT_BACKUP_KMS_KEY_ID: ${OPEN_SCIENCE_OBJECT_BACKUP_KMS_KEY_ID:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      # The CLI reads the mounted credentials file itself.
      AWS_SHARED_CREDENTIALS_FILE: /run/secrets/object-backup-credentials
      # S3-compatible stores (Tencent COS, MinIO) need the endpoint named; AWS
      # itself ignores an empty value.
      AWS_ENDPOINT_URL: ${OPEN_SCIENCE_OBJECT_BACKUP_ENDPOINT:-}
    volumes:
      - open-science-data:/data:ro
      - open-science-backups:/backups
    secrets:
      - source: open-science-backup-passphrase
        target: backup-passphrase
        mode: 0400
      # Object-storage credentials arrive as a file, by path, like every other
      # secret here — never as a value in .env, which is read by more things and
      # copied to more places than anyone tracks. The aws CLI reads this format
      # natively, so nothing has to parse or re-export it.
      #
      # Optional on purpose: a deployment with no off-box copy is a decision, and
      # `backup_external_unconfirmed` is what says so out loud. What must not
      # happen is the state this replaced — external mode declared, no bucket
      # configured, and 119 backups that never left the machine.
      - source: open-science-object-backup-credentials
        target: object-backup-credentials
        mode: 0400
    healthcheck:
      test: ["CMD", "node", "scripts/ops/backup-scheduler.mjs", "health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 5m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=${OPEN_SCIENCE_BACKUP_TMPFS_SIZE:-2g}
    restart: unless-stopped

secrets:
  open-science-backup-passphrase:
    file: ${OPEN_SCIENCE_BACKUP_PASSPHRASE_FILE:-./secrets/backup-passphrase.txt}
  open-science-object-backup-credentials:
    file: ${OPEN_SCIENCE_OBJECT_BACKUP_CREDENTIALS_FILE:-./secrets/object-backup-credentials.ini}
