# Optional overlay: the five adapter-run specialist engines hold no DeepSeek key.
#
# Apply after docker-compose.yml once OPEN_SCIENCE_ENGINE_MODEL_GATEWAY_ENABLED
# is true in .env (gap E4). With the lever on, every job's engine calls the
# model gateway under a credential issued for that job, so the key the base file
# mounts into these containers is never read; this overlay replaces that mount
# with an empty file, so it is not there to be read either. The lever is
# required here by interpolation: applied without it, compose refuses to start
# rather than leave the engines with neither a key nor a gateway.
#
# The MetaAgent service is not listed: it keeps its key until it asks for a
# per-job credential the way the shared adapter does.
x-engine-keyless: &engine-keyless
  environment:
    EVIMED_ENGINE_MODEL_GATEWAY: ${OPEN_SCIENCE_ENGINE_MODEL_GATEWAY_ENABLED:?the keyless overlay needs OPEN_SCIENCE_ENGINE_MODEL_GATEWAY_ENABLED=true}
  volumes:
    - type: bind
      source: /dev/null
      target: /run/secrets/deepseek-api-key
      read_only: true

services:
  evimed-mr-agent: *engine-keyless
  evimed-bibliometric-agent: *engine-keyless
  evimed-research-topic-agent: *engine-keyless
  evimed-peer-review-agent: *engine-keyless
  evimed-drug-safety-agent: *engine-keyless
