# TCP on the serving host: BBR in place of cubic, with the fair-queue pacing it is designed around.
#
# A reader on the far side of a lossy line was the largest part of a slow opening: on 2026-10-31 at 21:20 Beijing time one
# connection to Tokyo retransmitted 7% of 2 MB, cubic's window fell to 2-3 segments and 1.83 MB took 30 s, and the same 1 MB
# file from a Tokyo host took anything from 1.1 s to over 45 s. Cubic reads each loss as congestion; BBR reads the
# delivery rate. It changes what this host sends and nothing else, and it is host-wide, so the other products on the host
# get it too.
#
# Not applied by a release. To try it and take it back, see "TCP on the serving host" in docs/WEB_OPERATIONS_RUNBOOK.md.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
