services:
  evimed-postgres:
    image: postgres:16.14-bookworm
    environment:
      POSTGRES_DB: evimed
      POSTGRES_USER: evimed
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    volumes:
      - evimed-postgres-data:/var/lib/postgresql/data
      - type: bind
        source: ${OPEN_SCIENCE_POSTGRES_PASSWORD_HOST_FILE:?set OPEN_SCIENCE_POSTGRES_PASSWORD_HOST_FILE}
        target: /run/secrets/postgres-password
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evimed -d evimed"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  evimed-memos:
    image: neosmemo/memos:0.29.1
    environment:
      MEMOS_ADDR: 0.0.0.0
      MEMOS_PORT: 5230
      MEMOS_DRIVER: postgres
      MEMOS_DSN_FILE: /run/secrets/memos-dsn
      MEMOS_INSTANCE_URL: ${OPEN_SCIENCE_MEMOS_PUBLIC_URL:-http://localhost:5230}
    volumes:
      - evimed-memos-data:/var/opt/memos
      - type: bind
        source: ${OPEN_SCIENCE_MEMOS_DSN_HOST_FILE:?set OPEN_SCIENCE_MEMOS_DSN_HOST_FILE}
        target: /run/secrets/memos-dsn
        read_only: true
    depends_on:
      evimed-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5230/api/v1/instance/profile"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m
    restart: unless-stopped

  evimed-memos-bootstrap:
    image: ${OPEN_SCIENCE_WEB_CONTAINER_IMAGE:-open-science-web:0.1.3}
    command: ["node", "scripts/ops/provision-memos.mjs"]
    environment:
      OPEN_SCIENCE_MEMOS_URL: http://evimed-memos:5230
      OPEN_SCIENCE_MEMOS_ADMIN_USER: ${OPEN_SCIENCE_MEMOS_ADMIN_USER:-evimed-memory}
      OPEN_SCIENCE_MEMOS_ADMIN_PASSWORD_FILE: /run/secrets/memos-admin-password
      OPEN_SCIENCE_MEMOS_ACCESS_TOKEN_FILE: /run/memos-integration/access-token
    volumes:
      - evimed-memos-integration:/run/memos-integration
      - type: bind
        source: ${OPEN_SCIENCE_MEMOS_ADMIN_PASSWORD_HOST_FILE:?set OPEN_SCIENCE_MEMOS_ADMIN_PASSWORD_HOST_FILE}
        target: /run/secrets/memos-admin-password
        read_only: true
    depends_on:
      evimed-memos:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    restart: "no"

  open-science-web:
    image: ${OPEN_SCIENCE_WEB_CONTAINER_IMAGE:-open-science-web:0.1.3}
    build:
      context: ../..
      dockerfile: deploy/web/Dockerfile
      args:
        APP_VERSION: ${OPEN_SCIENCE_APP_VERSION:-0.1.3}
        RELEASE_ID: ${OPEN_SCIENCE_RELEASE_ID:?set OPEN_SCIENCE_RELEASE_ID}
        SOURCE_REVISION: ${OPEN_SCIENCE_SOURCE_REVISION:?set OPEN_SCIENCE_SOURCE_REVISION}
        BUILD_CREATED: ${OPEN_SCIENCE_BUILD_CREATED:?set OPEN_SCIENCE_BUILD_CREATED}
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      OPEN_SCIENCE_DEPLOYMENT_PROFILE: ${OPEN_SCIENCE_DEPLOYMENT_PROFILE:-controlled-pilot}
      OPEN_SCIENCE_HOST: 0.0.0.0
      OPEN_SCIENCE_PORT: 8787
      OPEN_SCIENCE_PUBLIC_URL: ${OPEN_SCIENCE_PUBLIC_URL:-http://localhost:8787}
      OPEN_SCIENCE_DATA_DIR: /data
      OPEN_SCIENCE_STATIC_DIR: /app/apps/desktop/dist
      OPEN_SCIENCE_EXAMPLES_DIR: /app/examples
      OPEN_SCIENCE_APP_VERSION: ${OPEN_SCIENCE_APP_VERSION:-0.1.3}
      OPEN_SCIENCE_RELEASE_ID: ${OPEN_SCIENCE_RELEASE_ID:?set OPEN_SCIENCE_RELEASE_ID}
      OPEN_SCIENCE_SOURCE_REVISION: ${OPEN_SCIENCE_SOURCE_REVISION:?set OPEN_SCIENCE_SOURCE_REVISION}
      OPEN_SCIENCE_BUILD_CREATED: ${OPEN_SCIENCE_BUILD_CREATED:?set OPEN_SCIENCE_BUILD_CREATED}
      OPEN_SCIENCE_WEB_CONTAINER_IMAGE: ${OPEN_SCIENCE_WEB_CONTAINER_IMAGE:-open-science-web:0.1.3}
      OPEN_SCIENCE_RELEASE_MANIFEST_FILE: /run/open-science/release-manifest.json
      OPEN_SCIENCE_STATE_STORE: postgres
      OPEN_SCIENCE_REQUIRE_SHARED_STATE_STORE: "true"
      OPEN_SCIENCE_DATABASE_URL_FILE: /run/secrets/database-url
      OPEN_SCIENCE_SESSION_TTL_MS: ${OPEN_SCIENCE_SESSION_TTL_MS:-604800000}
      OPEN_SCIENCE_MEMOS_URL: http://evimed-memos:5230
      OPEN_SCIENCE_MEMOS_ACCESS_TOKEN_FILE: /run/memos-integration/access-token
      OPEN_SCIENCE_REQUIRE_MEMOS: "true"
      OPEN_SCIENCE_OPERATOR_METRICS_TOKEN: ${OPEN_SCIENCE_OPERATOR_METRICS_TOKEN:-}
      OPEN_SCIENCE_OPERATOR_METRICS_TOKEN_FILE: ${OPEN_SCIENCE_OPERATOR_METRICS_TOKEN_FILE:-}
      OPEN_SCIENCE_BACKUP_MODE: ${OPEN_SCIENCE_BACKUP_MODE:-disabled}
      OPEN_SCIENCE_BACKUP_DIR: ${OPEN_SCIENCE_BACKUP_DIR:-/backups}
      OPEN_SCIENCE_BACKUP_STATE_FILE: ${OPEN_SCIENCE_BACKUP_STATE_FILE:-/backups/.open-science-backup-state.json}
      OPEN_SCIENCE_BACKUP_RETENTION_DAYS: ${OPEN_SCIENCE_BACKUP_RETENTION_DAYS:-0}
      OPEN_SCIENCE_BACKUP_ENCRYPTION_ACK: ${OPEN_SCIENCE_BACKUP_ENCRYPTION_ACK:-false}
      OPEN_SCIENCE_BACKUP_INTERVAL_SECONDS: ${OPEN_SCIENCE_BACKUP_INTERVAL_SECONDS:-86400}
      OPEN_SCIENCE_BACKUP_HEALTH_GRACE_SECONDS: ${OPEN_SCIENCE_BACKUP_HEALTH_GRACE_SECONDS:-1800}
      OPEN_SCIENCE_BACKUP_EXTERNAL_ACK: ${OPEN_SCIENCE_BACKUP_EXTERNAL_ACK:-false}
      OPEN_SCIENCE_RESTORE_DRILL_ACK: ${OPEN_SCIENCE_RESTORE_DRILL_ACK:-false}
      OPEN_SCIENCE_SECURITY_HEADERS: ${OPEN_SCIENCE_SECURITY_HEADERS:-true}
      OPEN_SCIENCE_CORS_ORIGINS: ${OPEN_SCIENCE_CORS_ORIGINS:-}
      OPEN_SCIENCE_AUTH_MODE: ${OPEN_SCIENCE_AUTH_MODE:-local}
      OPEN_SCIENCE_DEV_AUTH: ${OPEN_SCIENCE_DEV_AUTH:-false}
