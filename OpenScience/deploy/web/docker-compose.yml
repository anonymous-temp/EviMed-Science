      EVIMED_ADR_CASE_QUERY_URL: ${EVIMED_ADR_CASE_QUERY_URL:-}
      EVIMED_ADR_SIGNAL_ANALYSIS_URL: ${EVIMED_ADR_SIGNAL_ANALYSIS_URL:-}
      EVIMED_OFFLABEL_EVIDENCE_PACKET_URL: ${EVIMED_OFFLABEL_EVIDENCE_PACKET_URL:-}
      EVIMED_COMPREHENSIVE_DRUG_EVALUATION_URL: ${EVIMED_COMPREHENSIVE_DRUG_EVALUATION_URL:-}
      EVIMED_DRUG_SELECTION_EVALUATION_URL: ${EVIMED_DRUG_SELECTION_EVALUATION_URL:-}
      EVIMED_META_ANALYSIS_URL: ${EVIMED_META_ANALYSIS_URL:-http://evimed-meta-agent:8024/api/v1/evimed/meta-analysis}
