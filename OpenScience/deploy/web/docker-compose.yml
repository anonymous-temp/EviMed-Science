      LLM_API_KEY_FILE: /run/secrets/deepseek-api-key
      LLM_BASE_URL: ${OPEN_SCIENCE_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: deepseek-v4-pro
      # One credential, one host variable. This read `${OPENGWAS_JWT}` while
      # the control plane read `${OPEN_SCIENCE_OPENGWAS_JWT}`, so setting the
      # documented one left this container's JWT empty -- which is exactly
      # what a live check found: api.opengwas.io answering 401 to a shipped
