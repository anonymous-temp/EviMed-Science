services:
  evimed-postgres:
    image: postgres:16.14-bookworm
    environment:
      POSTGRES_DB: evimed
      POSTGRES_USER: evimed
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    volumes:
      - evimed-postgres-data:/var/lib/postgresql/data
      - type: bind
        source: ${OPEN_SCIENCE_POSTGRES_PASSWORD_HOST_FILE:?set OPEN_SCIENCE_POSTGRES_PASSWORD_HOST_FILE}
        target: /run/secrets/postgres-password
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evimed -d evimed"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  evimed-memos:
    image: ${OPEN_SCIENCE_MEMOS_CONTAINER_IMAGE:-evimed-memos:0.31.1-evimed}
    build:
      context: ../../..
      dockerfile: OpenScience/deploy/memos/Dockerfile
      args:
        VERSION: 0.31.1-evimed
        COMMIT: ${OPEN_SCIENCE_SOURCE_REVISION:?set OPEN_SCIENCE_SOURCE_REVISION}
        GOPROXY: ${OPEN_SCIENCE_GOPROXY:-https://goproxy.cn,direct}
    environment:
      MEMOS_ADDR: 0.0.0.0
      MEMOS_PORT: 5230
      MEMOS_DRIVER: postgres
      MEMOS_DSN_FILE: /run/secrets/memos-dsn
      MEMOS_INSTANCE_URL: ${OPEN_SCIENCE_MEMOS_PUBLIC_URL:-http://localhost:5230}
    volumes:
      - evimed-memos-data:/var/opt/memos
      - type: bind
        source: ${OPEN_SCIENCE_MEMOS_DSN_HOST_FILE:?set OPEN_SCIENCE_MEMOS_DSN_HOST_FILE}
        target: /run/secrets/memos-dsn
        read_only: true
    depends_on:
      evimed-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5230/api/v1/instance/profile"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m
    restart: unless-stopped

  evimed-memos-bootstrap:
    image: ${OPEN_SCIENCE_WEB_CONTAINER_IMAGE:-open-science-web:0.1.3}
    command: ["node", "scripts/ops/provision-memos.mjs"]
    environment:
      OPEN_SCIENCE_MEMOS_URL: http://evimed-memos:5230
      OPEN_SCIENCE_MEMOS_ADMIN_USER: ${OPEN_SCIENCE_MEMOS_ADMIN_USER:-evimed-memory}
      OPEN_SCIENCE_MEMOS_ADMIN_PASSWORD_FILE: /run/secrets/memos-admin-password
      OPEN_SCIENCE_MEMOS_ACCESS_TOKEN_FILE: /run/memos-integration/access-token
    volumes:
      - evimed-memos-integration:/run/memos-integration
      - type: bind
        source: ${OPEN_SCIENCE_MEMOS_ADMIN_PASSWORD_HOST_FILE:?set OPEN_SCIENCE_MEMOS_ADMIN_PASSWORD_HOST_FILE}
        target: /run/secrets/memos-admin-password
        read_only: true
    depends_on:
      evimed-memos:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    restart: "no"

  # Open-web search: a self-hosted metasearch aggregator, reached only by the
  # server's /internal/search/v1/query route. No port is published and the
  # runtime never learns this host exists. Behind the "web-search" profile so a
  # deployment that does not want an open-web channel simply does not start it.
  open-science-web-search:
    image: ${OPEN_SCIENCE_WEB_SEARCH_CONTAINER_IMAGE:-searxng/searxng:2026.8.4-c63835bd2}
    profiles: ["web-search"]
    # SEARXNG_SECRET only. It is read from a host file rather than this .env so
    # the value never enters the release directory or the repository; SearXNG
    # refuses to start without it even though, with the limiter and the image
    # proxy both off and no published port, it protects nothing here.
    env_file:
      - ${OPEN_SCIENCE_WEB_SEARCH_SECRET_ENV_FILE:-./secrets/web-search.env}
    environment:
      SEARXNG_BASE_URL: http://open-science-web-search:8080/
    volumes:
      - type: bind
        source: ./searxng/settings.yml
        target: /etc/searxng/settings.yml
        read_only: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  open-science-web:
    image: ${OPEN_SCIENCE_WEB_CONTAINER_IMAGE:-open-science-web:0.1.3}
    build:
      context: ../..
      dockerfile: deploy/web/Dockerfile
      args:
        APP_VERSION: ${OPEN_SCIENCE_APP_VERSION:-0.1.3}
        RELEASE_ID: ${OPEN_SCIENCE_RELEASE_ID:?set OPEN_SCIENCE_RELEASE_ID}
        SOURCE_REVISION: ${OPEN_SCIENCE_SOURCE_REVISION:?set OPEN_SCIENCE_SOURCE_REVISION}
        BUILD_CREATED: ${OPEN_SCIENCE_BUILD_CREATED:?set OPEN_SCIENCE_BUILD_CREATED}
        NPM_REGISTRY: ${OPEN_SCIENCE_NPM_REGISTRY:-https://registry.npmjs.org}
        APK_MIRROR: ${OPEN_SCIENCE_APK_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      OPEN_SCIENCE_DEPLOYMENT_PROFILE: ${OPEN_SCIENCE_DEPLOYMENT_PROFILE:-controlled-pilot}
      OPEN_SCIENCE_HOST: 0.0.0.0
      OPEN_SCIENCE_PORT: 8787
      OPEN_SCIENCE_PUBLIC_URL: ${OPEN_SCIENCE_PUBLIC_URL:-http://localhost:8787}
      OPEN_SCIENCE_DATA_DIR: /data
      OPEN_SCIENCE_STATIC_DIR: /app/apps/desktop/dist
      OPEN_SCIENCE_EXAMPLES_DIR: /app/examples
      OPEN_SCIENCE_APP_VERSION: ${OPEN_SCIENCE_APP_VERSION:-0.1.3}
      OPEN_SCIENCE_RELEASE_ID: ${OPEN_SCIENCE_RELEASE_ID:?set OPEN_SCIENCE_RELEASE_ID}
      OPEN_SCIENCE_SOURCE_REVISION: ${OPEN_SCIENCE_SOURCE_REVISION:?set OPEN_SCIENCE_SOURCE_REVISION}
      OPEN_SCIENCE_BUILD_CREATED: ${OPEN_SCIENCE_BUILD_CREATED:?set OPEN_SCIENCE_BUILD_CREATED}
      OPEN_SCIENCE_WEB_CONTAINER_IMAGE: ${OPEN_SCIENCE_WEB_CONTAINER_IMAGE:-open-science-web:0.1.3}
      OPEN_SCIENCE_RELEASE_MANIFEST_FILE: /run/open-science/release-manifest.json
      OPEN_SCIENCE_STATE_STORE: postgres
      OPEN_SCIENCE_REQUIRE_SHARED_STATE_STORE: "true"
      OPEN_SCIENCE_DATABASE_URL_FILE: /run/secrets/database-url
      OPEN_SCIENCE_SESSION_TTL_MS: ${OPEN_SCIENCE_SESSION_TTL_MS:-604800000}
      OPEN_SCIENCE_MEMOS_URL: http://evimed-memos:5230
      OPEN_SCIENCE_MEMOS_ACCESS_TOKEN_FILE: /run/memos-integration/access-token
      OPEN_SCIENCE_REQUIRE_MEMOS: "true"
      OPEN_SCIENCE_MEMORY_EXTRACTION_ENABLED: ${OPEN_SCIENCE_MEMORY_EXTRACTION_ENABLED:-true}
      OPEN_SCIENCE_MEMORY_EXTRACTION_TIMEOUT_MS: ${OPEN_SCIENCE_MEMORY_EXTRACTION_TIMEOUT_MS:-30000}
      OPEN_SCIENCE_OPERATOR_METRICS_TOKEN: ${OPEN_SCIENCE_OPERATOR_METRICS_TOKEN:-}
      OPEN_SCIENCE_OPERATOR_METRICS_TOKEN_FILE: ${OPEN_SCIENCE_OPERATOR_METRICS_TOKEN_FILE:-}
      OPEN_SCIENCE_BACKUP_MODE: ${OPEN_SCIENCE_BACKUP_MODE:-disabled}
      OPEN_SCIENCE_BACKUP_DIR: ${OPEN_SCIENCE_BACKUP_DIR:-/backups}
      OPEN_SCIENCE_BACKUP_STATE_FILE: ${OPEN_SCIENCE_BACKUP_STATE_FILE:-/backups/.open-science-backup-state.json}
      OPEN_SCIENCE_BACKUP_RETENTION_DAYS: ${OPEN_SCIENCE_BACKUP_RETENTION_DAYS:-0}
      OPEN_SCIENCE_BACKUP_ENCRYPTION_ACK: ${OPEN_SCIENCE_BACKUP_ENCRYPTION_ACK:-false}
      OPEN_SCIENCE_BACKUP_INTERVAL_SECONDS: ${OPEN_SCIENCE_BACKUP_INTERVAL_SECONDS:-86400}
      OPEN_SCIENCE_BACKUP_HEALTH_GRACE_SECONDS: ${OPEN_SCIENCE_BACKUP_HEALTH_GRACE_SECONDS:-1800}
      OPEN_SCIENCE_BACKUP_EXTERNAL_ACK: ${OPEN_SCIENCE_BACKUP_EXTERNAL_ACK:-false}
      OPEN_SCIENCE_RESTORE_DRILL_ACK: ${OPEN_SCIENCE_RESTORE_DRILL_ACK:-false}
      OPEN_SCIENCE_SECURITY_HEADERS: ${OPEN_SCIENCE_SECURITY_HEADERS:-true}
      OPEN_SCIENCE_CORS_ORIGINS: ${OPEN_SCIENCE_CORS_ORIGINS:-}
      OPEN_SCIENCE_AUTH_MODE: ${OPEN_SCIENCE_AUTH_MODE:-local}
      OPEN_SCIENCE_DEV_AUTH: ${OPEN_SCIENCE_DEV_AUTH:-false}
      OPEN_SCIENCE_BOOTSTRAP_USER: ${OPEN_SCIENCE_BOOTSTRAP_USER:-admin}
      OPEN_SCIENCE_BOOTSTRAP_PASSWORD: ${OPEN_SCIENCE_BOOTSTRAP_PASSWORD:-}
      OPEN_SCIENCE_BOOTSTRAP_PASSWORD_FILE: ${OPEN_SCIENCE_BOOTSTRAP_PASSWORD_FILE:-}
      OPEN_SCIENCE_OIDC_ISSUER: ${OPEN_SCIENCE_OIDC_ISSUER:-}
      OPEN_SCIENCE_OIDC_CLIENT_ID: ${OPEN_SCIENCE_OIDC_CLIENT_ID:-}
      OPEN_SCIENCE_OIDC_CLIENT_AUTH_METHOD: ${OPEN_SCIENCE_OIDC_CLIENT_AUTH_METHOD:-client_secret_basic}
      OPEN_SCIENCE_OIDC_CLIENT_SECRET: ${OPEN_SCIENCE_OIDC_CLIENT_SECRET:-}
      OPEN_SCIENCE_OIDC_CLIENT_SECRET_FILE: ${OPEN_SCIENCE_OIDC_CLIENT_SECRET_FILE:-}
      OPEN_SCIENCE_OIDC_FLOW_SECRET: ${OPEN_SCIENCE_OIDC_FLOW_SECRET:-}
      OPEN_SCIENCE_OIDC_FLOW_SECRET_FILE: ${OPEN_SCIENCE_OIDC_FLOW_SECRET_FILE:-}
      OPEN_SCIENCE_OIDC_SCOPES: ${OPEN_SCIENCE_OIDC_SCOPES:-openid profile email}
      OPEN_SCIENCE_OIDC_LABEL: ${OPEN_SCIENCE_OIDC_LABEL:-Organization SSO}
      OPEN_SCIENCE_OIDC_ALLOWED_GROUPS: ${OPEN_SCIENCE_OIDC_ALLOWED_GROUPS:-}
      OPEN_SCIENCE_OIDC_GROUP_CLAIM: ${OPEN_SCIENCE_OIDC_GROUP_CLAIM:-groups}
      OPEN_SCIENCE_OIDC_ALLOWED_EMAIL_DOMAINS: ${OPEN_SCIENCE_OIDC_ALLOWED_EMAIL_DOMAINS:-}
      OPEN_SCIENCE_OIDC_TIMEOUT_MS: ${OPEN_SCIENCE_OIDC_TIMEOUT_MS:-10000}
      OPEN_SCIENCE_OIDC_FLOW_TTL_MS: ${OPEN_SCIENCE_OIDC_FLOW_TTL_MS:-600000}
      OPEN_SCIENCE_RUNTIME_MODE: ${OPEN_SCIENCE_RUNTIME_MODE:-kernel}
      OPEN_SCIENCE_ALLOW_MOCK_RUNTIME: ${OPEN_SCIENCE_ALLOW_MOCK_RUNTIME:-false}
      OPEN_SCIENCE_RUNTIME_SANDBOX_MODE: ${OPEN_SCIENCE_RUNTIME_SANDBOX_MODE:-docker}
      OPEN_SCIENCE_RUNTIME_CONTAINER_BIN: ${OPEN_SCIENCE_RUNTIME_CONTAINER_BIN:-docker}
      OPEN_SCIENCE_RUNTIME_CONTROLLER_MODE: socket
      OPEN_SCIENCE_RUNTIME_CONTROLLER_SOCKET: /run/open-science-controller/controller.sock
      OPEN_SCIENCE_RUNTIME_CONTROLLER_TIMEOUT_MS: ${OPEN_SCIENCE_RUNTIME_CONTROLLER_TIMEOUT_MS:-30000}
      OPEN_SCIENCE_RUNTIME_CONTROLLER_POLL_MS: ${OPEN_SCIENCE_RUNTIME_CONTROLLER_POLL_MS:-500}
      OPEN_SCIENCE_ALLOW_DIRECT_DOCKER_CONTROL: "false"
      OPEN_SCIENCE_RUNTIME_CONTAINER_IMAGE: ${OPEN_SCIENCE_RUNTIME_CONTAINER_IMAGE:-open-science-runtime:dsh-0.1.2-alpha.3-uv-0.11.26}
      OPEN_SCIENCE_UV_VERSION: ${OPEN_SCIENCE_UV_VERSION:-0.11.26}
      OPEN_SCIENCE_RUNTIME_REQUIRE_IMAGE_LOCAL: ${OPEN_SCIENCE_RUNTIME_REQUIRE_IMAGE_LOCAL:-true}
      OPEN_SCIENCE_RUNTIME_DATA_VOLUME: ${OPEN_SCIENCE_DATA_VOLUME:-open-science-data}
      OPEN_SCIENCE_RUNTIME_TRANSPORT: ${OPEN_SCIENCE_RUNTIME_TRANSPORT:-unix}
      OPEN_SCIENCE_RUNTIME_NETWORK_MODE: ${OPEN_SCIENCE_RUNTIME_NETWORK_MODE:-open-science-runtime-internal}
      OPEN_SCIENCE_RUNTIME_INTERNAL_NETWORK_NAME: ${OPEN_SCIENCE_RUNTIME_INTERNAL_NETWORK_NAME:-open-science-runtime-internal}
      OPEN_SCIENCE_ALLOW_RUNTIME_NETWORK_EGRESS: ${OPEN_SCIENCE_ALLOW_RUNTIME_NETWORK_EGRESS:-false}
      OPEN_SCIENCE_RUNTIME_NETWORK_EGRESS_POLICY_ACK: ${OPEN_SCIENCE_RUNTIME_NETWORK_EGRESS_POLICY_ACK:-false}
      OPEN_SCIENCE_RUNTIME_CPU_LIMIT: ${OPEN_SCIENCE_RUNTIME_CPU_LIMIT:-2}
      OPEN_SCIENCE_RUNTIME_MEMORY_LIMIT: ${OPEN_SCIENCE_RUNTIME_MEMORY_LIMIT:-4g}
      OPEN_SCIENCE_RUNTIME_PIDS_LIMIT: ${OPEN_SCIENCE_RUNTIME_PIDS_LIMIT:-256}
      OPEN_SCIENCE_RUNTIME_NO_NEW_PRIVILEGES: ${OPEN_SCIENCE_RUNTIME_NO_NEW_PRIVILEGES:-true}
      OPEN_SCIENCE_RUNTIME_CAP_DROP: ${OPEN_SCIENCE_RUNTIME_CAP_DROP:-ALL}
      OPEN_SCIENCE_RUNTIME_READ_ONLY_ROOT: ${OPEN_SCIENCE_RUNTIME_READ_ONLY_ROOT:-true}
      OPEN_SCIENCE_RUNTIME_TMPFS: ${OPEN_SCIENCE_RUNTIME_TMPFS:-/tmp:rw,nosuid,nodev,size=64m}
      OPEN_SCIENCE_RUNTIME_CONTAINER_USER: ${OPEN_SCIENCE_RUNTIME_CONTAINER_USER:-}
      OPEN_SCIENCE_RUNTIME_SKILL_DIRS: ${OPEN_SCIENCE_RUNTIME_SKILL_DIRS-runtime/skills/core,runtime/skills/external/ai4s-skills,runtime/skills/curated-scientific,runtime/skills/office}
      OPEN_SCIENCE_EVIMED_MCP_SOURCE_DIR: ${OPEN_SCIENCE_EVIMED_MCP_SOURCE_DIR:-runtime/mcp/evimed-research}
      OPEN_SCIENCE_EVIMED_WORKLOAD_SIGNING_SECRET: ${OPEN_SCIENCE_EVIMED_WORKLOAD_SIGNING_SECRET:-}
      OPEN_SCIENCE_EVIMED_WORKLOAD_SIGNING_SECRET_FILE: /run/secrets/evimed-workload-signing-key
      OPEN_SCIENCE_DEEPSEEK_PROVIDER_ENABLED: ${OPEN_SCIENCE_DEEPSEEK_PROVIDER_ENABLED:-true}
      OPEN_SCIENCE_REQUIRE_ALL_SPECIALIST_ADAPTERS: ${OPEN_SCIENCE_REQUIRE_ALL_SPECIALIST_ADAPTERS:-true}
      OPEN_SCIENCE_DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek-api-key
      OPEN_SCIENCE_DEEPSEEK_BASE_URL: ${OPEN_SCIENCE_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      OPEN_SCIENCE_DEEPSEEK_MODEL: ${OPEN_SCIENCE_DEEPSEEK_MODEL:-deepseek-v4-pro}
      OPEN_SCIENCE_MODEL_GATEWAY_SIGNING_SECRET_FILE: /run/secrets/model-gateway-signing-key
      OPEN_SCIENCE_EVIMED_API_KEY_FILE: /run/secrets/evimed-api-key
      # The remaining public-source credentials the server resolves. Without
      # these lines the values sit in .env doing nothing: the connector reports
      # "managed key: missing" and every full-text fetch through it fails, which
      # is how a run came back with one of nine sources at full-text level.
      # Unpaywall takes a contact address rather than a key — its public tier is
      # identified by email.
      OPEN_SCIENCE_UNPAYWALL_EMAIL: ${OPEN_SCIENCE_UNPAYWALL_EMAIL:-}
      OPEN_SCIENCE_SEMANTIC_SCHOLAR_API_KEY: ${OPEN_SCIENCE_SEMANTIC_SCHOLAR_API_KEY:-}
      OPEN_SCIENCE_CORE_API_KEY: ${OPEN_SCIENCE_CORE_API_KEY:-}
      OPEN_SCIENCE_UMLS_API_KEY: ${OPEN_SCIENCE_UMLS_API_KEY:-}
      OPEN_SCIENCE_OMIM_API_KEY: ${OPEN_SCIENCE_OMIM_API_KEY:-}
      OPEN_SCIENCE_ADDGENE_API_KEY: ${OPEN_SCIENCE_ADDGENE_API_KEY:-}
      OPEN_SCIENCE_BIOGRID_API_KEY: ${OPEN_SCIENCE_BIOGRID_API_KEY:-}
      OPEN_SCIENCE_OPENGWAS_JWT: ${OPEN_SCIENCE_OPENGWAS_JWT:-}
      # Rate-ceiling keys: both upstreams serve without them, just slower.
      OPEN_SCIENCE_NCBI_API_KEY: ${OPEN_SCIENCE_NCBI_API_KEY:-}
      OPEN_SCIENCE_OPENFDA_API_KEY: ${OPEN_SCIENCE_OPENFDA_API_KEY:-}
      # Empty disables the sidecar's MCP row entirely; the runtime then
      # behaves exactly as it did before the sidecar existed.
      OPEN_SCIENCE_TOOLUNIVERSE_MCP_URL: ${OPEN_SCIENCE_TOOLUNIVERSE_MCP_URL:-http://tooluniverse:8080/mcp}
      OPEN_SCIENCE_MATERIALS_PROJECT_API_KEY_FILE: /run/secrets/materials-project-api-key
      OPEN_SCIENCE_REQUIRE_MATERIALS_PROJECT: ${OPEN_SCIENCE_REQUIRE_MATERIALS_PROJECT:-true}
      OPEN_SCIENCE_MODEL_GATEWAY_INTERNAL_URL: ${OPEN_SCIENCE_MODEL_GATEWAY_INTERNAL_URL:-http://open-science-web:8787/internal/model/v1}
      OPEN_SCIENCE_PUBLIC_SOURCE_GATEWAY_INTERNAL_URL: ${OPEN_SCIENCE_PUBLIC_SOURCE_GATEWAY_INTERNAL_URL:-http://open-science-web:8787/internal/sources/v1/fetch}
      # Empty disables the open-web channel; the tool then refuses with a
      # stated reason rather than returning an empty result set a run could
      # read as "nothing has been published on this".
      OPEN_SCIENCE_WEB_SEARCH_URL: ${OPEN_SCIENCE_WEB_SEARCH_URL:-}
      OPEN_SCIENCE_WEB_SEARCH_GATEWAY_INTERNAL_URL: ${OPEN_SCIENCE_WEB_SEARCH_GATEWAY_INTERNAL_URL:-http://open-science-web:8787/internal/search/v1/query}
      OPEN_SCIENCE_WEB_SEARCH_TIMEOUT_MS: ${OPEN_SCIENCE_WEB_SEARCH_TIMEOUT_MS:-30000}
      OPEN_SCIENCE_PUBLIC_SOURCE_GATEWAY_TIMEOUT_MS: ${OPEN_SCIENCE_PUBLIC_SOURCE_GATEWAY_TIMEOUT_MS:-60000}
      OPEN_SCIENCE_PUBLIC_SOURCE_GATEWAY_MAX_RESPONSE_BYTES: ${OPEN_SCIENCE_PUBLIC_SOURCE_GATEWAY_MAX_RESPONSE_BYTES:-16777216}
      OPEN_SCIENCE_MODEL_GATEWAY_TIMEOUT_MS: ${OPEN_SCIENCE_MODEL_GATEWAY_TIMEOUT_MS:-300000}
      OPEN_SCIENCE_MODEL_GATEWAY_MAX_BODY_BYTES: ${OPEN_SCIENCE_MODEL_GATEWAY_MAX_BODY_BYTES:-2097152}
      OPEN_SCIENCE_MODEL_GATEWAY_MAX_RESPONSE_BYTES: ${OPEN_SCIENCE_MODEL_GATEWAY_MAX_RESPONSE_BYTES:-33554432}
      OPEN_SCIENCE_DEEPSEEK_RELEASE_RECEIPT_MAX_AGE_MS: ${OPEN_SCIENCE_DEEPSEEK_RELEASE_RECEIPT_MAX_AGE_MS:-86400000}
      OPEN_SCIENCE_DEEPSEEK_RELEASE_RECEIPT_FILE: /run/secrets/deepseek-release-receipt.json
      OPEN_SCIENCE_DEEPSEEK_RELEASE_RECEIPT_ID: ${OPEN_SCIENCE_DEEPSEEK_RELEASE_RECEIPT_ID:-}
      OPEN_SCIENCE_DEEPSEEK_CONFIG_REVISION: ${OPEN_SCIENCE_DEEPSEEK_CONFIG_REVISION:-}
      EVIMED_BIOMEDICAL_SOURCE_SEARCH_URL: ${EVIMED_BIOMEDICAL_SOURCE_SEARCH_URL:-}
      EVIMED_LITERATURE_SEARCH_URL: ${EVIMED_LITERATURE_SEARCH_URL:-}
      EVIMED_GUIDELINE_SEARCH_URL: ${EVIMED_GUIDELINE_SEARCH_URL:-}
      EVIMED_CLINICAL_TRIAL_SEARCH_URL: ${EVIMED_CLINICAL_TRIAL_SEARCH_URL:-}
      EVIMED_PATENT_SEARCH_URL: ${EVIMED_PATENT_SEARCH_URL:-}
      EVIMED_PHARMACY_REFERENCE_SEARCH_URL: ${EVIMED_PHARMACY_REFERENCE_SEARCH_URL:-http://evimed-drug-evidence-adapter:8026/api/v1/evimed/pharmacy-reference-search}
      EVIMED_DRUG_LABEL_SEARCH_URL: ${EVIMED_DRUG_LABEL_SEARCH_URL:-}
      EVIMED_ADR_CASE_QUERY_URL: ${EVIMED_ADR_CASE_QUERY_URL:-http://evimed-drug-evidence-adapter:8026/api/v1/evimed/adr-cases}
      EVIMED_ADR_SIGNAL_ANALYSIS_URL: ${EVIMED_ADR_SIGNAL_ANALYSIS_URL:-http://evimed-drug-evidence-adapter:8026/api/v1/evimed/adr-signal}
      EVIMED_OFFLABEL_EVIDENCE_PACKET_URL: ${EVIMED_OFFLABEL_EVIDENCE_PACKET_URL:-http://evimed-drug-evidence-adapter:8026/api/v1/evimed/offlabel-evidence-packet}
      EVIMED_COMPREHENSIVE_DRUG_EVALUATION_URL: ${EVIMED_COMPREHENSIVE_DRUG_EVALUATION_URL:-http://evimed-drug-evidence-adapter:8026/api/v1/evimed/comprehensive-drug-evaluation}
      EVIMED_DRUG_SELECTION_EVALUATION_URL: ${EVIMED_DRUG_SELECTION_EVALUATION_URL:-http://evimed-drug-evidence-adapter:8026/api/v1/evimed/drug-selection-evaluation}
      EVIMED_META_ANALYSIS_URL: ${EVIMED_META_ANALYSIS_URL:-http://evimed-meta-agent:8024/api/v1/evimed/meta-analysis}
      EVIMED_MR_ANALYSIS_URL: ${EVIMED_MR_ANALYSIS_URL:-http://evimed-mr-agent:8025/api/v1/evimed/mendelian-randomization}
      EVIMED_BIBLIOMETRIC_ANALYSIS_URL: ${EVIMED_BIBLIOMETRIC_ANALYSIS_URL:-http://evimed-bibliometric-agent:8025/api/v1/evimed/bibliometric-analysis}
      EVIMED_RESEARCH_TOPIC_SELECTION_URL: ${EVIMED_RESEARCH_TOPIC_SELECTION_URL:-http://evimed-research-topic-agent:8025/api/v1/evimed/research-topic-selection}
      EVIMED_PEER_REVIEW_URL: ${EVIMED_PEER_REVIEW_URL:-http://evimed-peer-review-agent:8025/api/v1/evimed/peer-review}
      EVIMED_DRUG_SAFETY_ANALYSIS_URL: ${EVIMED_DRUG_SAFETY_ANALYSIS_URL:-http://evimed-drug-safety-agent:8025/api/v1/evimed/drug-safety-analysis}
      OPEN_SCIENCE_ALLOW_RUNTIME_HOST_NETWORK: ${OPEN_SCIENCE_ALLOW_RUNTIME_HOST_NETWORK:-false}
      OPEN_SCIENCE_ALLOW_UNSANDBOXED_RUNTIME: ${OPEN_SCIENCE_ALLOW_UNSANDBOXED_RUNTIME:-false}
      OPEN_SCIENCE_ALLOW_HOST_SHELL: ${OPEN_SCIENCE_ALLOW_HOST_SHELL:-false}
      OPEN_SCIENCE_ALLOW_DIRECT_SHELL: ${OPEN_SCIENCE_ALLOW_DIRECT_SHELL:-false}
      OPEN_SCIENCE_ALLOW_PERSISTENT_APPROVALS: ${OPEN_SCIENCE_ALLOW_PERSISTENT_APPROVALS:-false}
      OPEN_SCIENCE_ALLOW_FULL_APPROVAL: ${OPEN_SCIENCE_ALLOW_FULL_APPROVAL:-false}
      OPEN_SCIENCE_ENABLE_KERNEL: ${OPEN_SCIENCE_ENABLE_KERNEL:-false}
      OPEN_SCIENCE_KERNEL_SANDBOX_MODE: ${OPEN_SCIENCE_KERNEL_SANDBOX_MODE:-docker}
      OPEN_SCIENCE_KERNEL_PYTHON_BIN: ${OPEN_SCIENCE_KERNEL_PYTHON_BIN:-python3}
      OPEN_SCIENCE_KERNEL_R_BIN: ${OPEN_SCIENCE_KERNEL_R_BIN:-Rscript}
      OPEN_SCIENCE_ALLOW_UNSANDBOXED_KERNEL: ${OPEN_SCIENCE_ALLOW_UNSANDBOXED_KERNEL:-false}
      OPEN_SCIENCE_MAX_PROJECT_BYTES: ${OPEN_SCIENCE_MAX_PROJECT_BYTES:-1073741824}
      OPEN_SCIENCE_MAX_JSON_BYTES: ${OPEN_SCIENCE_MAX_JSON_BYTES:-12582912}
      OPEN_SCIENCE_MAX_FILE_BYTES: ${OPEN_SCIENCE_MAX_FILE_BYTES:-52428800}
      OPEN_SCIENCE_MAX_WORKSPACE_SCAN_ENTRIES: ${OPEN_SCIENCE_MAX_WORKSPACE_SCAN_ENTRIES:-10000}
      OPEN_SCIENCE_MAX_ARCHIVE_ENTRIES: ${OPEN_SCIENCE_MAX_ARCHIVE_ENTRIES:-10000}
