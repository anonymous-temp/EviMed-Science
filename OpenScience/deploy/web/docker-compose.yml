      - evimed-memos-integration:/run/memos-integration:ro
      - type: bind
        source: ${OPEN_SCIENCE_DATABASE_URL_HOST_FILE:?set OPEN_SCIENCE_DATABASE_URL_HOST_FILE}
        target: /run/secrets/database-url
        read_only: true
      - type: bind
        source: ${OPEN_SCIENCE_RELEASE_MANIFEST_HOST_FILE:-./release-manifest.json}
        target: /run/open-science/release-manifest.json
        read_only: true
      - type: bind
        source: ${OPEN_SCIENCE_DEEPSEEK_API_KEY_HOST_FILE:?set OPEN_SCIENCE_DEEPSEEK_API_KEY_HOST_FILE}
        target: /run/secrets/deepseek-api-key
        read_only: true
      - type: bind
