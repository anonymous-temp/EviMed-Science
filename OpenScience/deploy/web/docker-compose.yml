      OPEN_SCIENCE_MATERIALS_PROJECT_API_KEY_FILE: /run/secrets/materials-project-api-key
      OPEN_SCIENCE_MODEL_GATEWAY_INTERNAL_URL: ${OPEN_SCIENCE_MODEL_GATEWAY_INTERNAL_URL:-http://open-science-web:8787/internal/model/v1}
      OPEN_SCIENCE_PUBLIC_SOURCE_GATEWAY_INTERNAL_URL: ${OPEN_SCIENCE_PUBLIC_SOURCE_GATEWAY_INTERNAL_URL:-http://open-science-web:8787/internal/sources/v1/fetch}
      OPEN_SCIENCE_PUBLIC_SOURCE_GATEWAY_TIMEOUT_MS: ${OPEN_SCIENCE_PUBLIC_SOURCE_GATEWAY_TIMEOUT_MS:-60000}
      OPEN_SCIENCE_PUBLIC_SOURCE_GATEWAY_MAX_RESPONSE_BYTES: ${OPEN_SCIENCE_PUBLIC_SOURCE_GATEWAY_MAX_RESPONSE_BYTES:-4194304}
