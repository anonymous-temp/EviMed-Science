        target: /run/secrets/evimed-api-key
        read_only: true
      - type: bind
        source: ${OPEN_SCIENCE_MATERIALS_PROJECT_API_KEY_HOST_FILE:?set OPEN_SCIENCE_MATERIALS_PROJECT_API_KEY_HOST_FILE}
        target: /run/secrets/materials-project-api-key
        read_only: true
      - type: bind
        source: ${OPEN_SCIENCE_DEEPSEEK_RELEASE_RECEIPT_HOST_FILE:?set OPEN_SCIENCE_DEEPSEEK_RELEASE_RECEIPT_HOST_FILE}
        target: /run/secrets/deepseek-release-receipt.json
        read_only: true
    depends_on:
      evimed-postgres:
        condition: service_healthy
      evimed-memos:
        condition: service_healthy
      evimed-memos-bootstrap:
        condition: service_completed_successfully
      open-science-runtime-controller:
        condition: service_healthy
      evimed-meta-agent:
        condition: service_healthy
    ports:
      - "127.0.0.1:${OPEN_SCIENCE_API_PORT:-8787}:8787"
    networks:
      - default
      - runtime-internal
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=${OPEN_SCIENCE_WEB_TMPFS_SIZE:-128m}
    restart: unless-stopped

  evimed-meta-agent:
    image: ${EVIMED_META_AGENT_IMAGE:-evimed-meta-agent:0.9.0}
    build:
      context: ../../../项目代码/meta
      dockerfile: Dockerfile.evimed
      args:
        APP_VERSION: ${EVIMED_META_AGENT_VERSION:-0.9.0}
    environment:
      EVIMED_DATA_ROOT: /data
      EVIMED_WORKLOAD_SIGNING_SECRET_FILE: /run/secrets/evimed-workload-signing-key
      LLM_API_KEY_FILE: /run/secrets/deepseek-api-key
      LLM_BASE_URL: ${OPEN_SCIENCE_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: deepseek-v4-pro
      LLM_ENABLE_THINKING: "true"
      LLM_REASONING_EFFORT: high
      LLM_TRUST_ENV: "false"
      LLM_STREAM: "false"
    volumes:
      - open-science-data:/data
      - type: bind
        source: ${OPEN_SCIENCE_DEEPSEEK_API_KEY_HOST_FILE:?set OPEN_SCIENCE_DEEPSEEK_API_KEY_HOST_FILE}
        target: /run/secrets/deepseek-api-key
        read_only: true
      - type: bind
        source: ${OPEN_SCIENCE_EVIMED_WORKLOAD_SIGNING_SECRET_HOST_FILE:?set OPEN_SCIENCE_EVIMED_WORKLOAD_SIGNING_SECRET_HOST_FILE}
        target: /run/secrets/evimed-workload-signing-key
        read_only: true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8024/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    restart: unless-stopped

  open-science-runtime-controller:
    image: ${OPEN_SCIENCE_WEB_CONTAINER_IMAGE:-open-science-web:0.1.3}
    command: ["node", "apps/server/src/runtimeControllerIndex.mjs"]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      OPEN_SCIENCE_DATA_DIR: /data
      OPEN_SCIENCE_APP_VERSION: ${OPEN_SCIENCE_APP_VERSION:-0.1.3}
      OPEN_SCIENCE_RELEASE_ID: ${OPEN_SCIENCE_RELEASE_ID:?set OPEN_SCIENCE_RELEASE_ID}
      OPEN_SCIENCE_SOURCE_REVISION: ${OPEN_SCIENCE_SOURCE_REVISION:?set OPEN_SCIENCE_SOURCE_REVISION}
      OPEN_SCIENCE_BUILD_CREATED: ${OPEN_SCIENCE_BUILD_CREATED:?set OPEN_SCIENCE_BUILD_CREATED}
      OPEN_SCIENCE_WEB_CONTAINER_IMAGE: ${OPEN_SCIENCE_WEB_CONTAINER_IMAGE:-open-science-web:0.1.3}
      OPEN_SCIENCE_RELEASE_MANIFEST_FILE: /run/open-science/release-manifest.json
      OPEN_SCIENCE_RUNTIME_CONTROLLER_MODE: direct
      OPEN_SCIENCE_RUNTIME_CONTROLLER_SOCKET: /run/open-science-controller/controller.sock
      OPEN_SCIENCE_RUNTIME_MODE: ${OPEN_SCIENCE_RUNTIME_MODE:-opencode}
      OPEN_SCIENCE_RUNTIME_SANDBOX_MODE: ${OPEN_SCIENCE_RUNTIME_SANDBOX_MODE:-docker}
      OPEN_SCIENCE_RUNTIME_CONTAINER_BIN: ${OPEN_SCIENCE_RUNTIME_CONTAINER_BIN:-docker}
      OPEN_SCIENCE_RUNTIME_CONTAINER_IMAGE: ${OPEN_SCIENCE_RUNTIME_CONTAINER_IMAGE:-open-science-opencode:opencode-1.17.13-uv-0.11.26}
      OPEN_SCIENCE_OPENCODE_VERSION: ${OPEN_SCIENCE_OPENCODE_VERSION:-1.17.13}
      OPEN_SCIENCE_UV_VERSION: ${OPEN_SCIENCE_UV_VERSION:-0.11.26}
      OPEN_SCIENCE_RUNTIME_REQUIRE_IMAGE_LOCAL: ${OPEN_SCIENCE_RUNTIME_REQUIRE_IMAGE_LOCAL:-true}
      OPEN_SCIENCE_RUNTIME_DATA_VOLUME: ${OPEN_SCIENCE_DATA_VOLUME:-open-science-data}
      OPEN_SCIENCE_RUNTIME_TRANSPORT: ${OPEN_SCIENCE_RUNTIME_TRANSPORT:-unix}
      OPEN_SCIENCE_RUNTIME_NETWORK_MODE: ${OPEN_SCIENCE_RUNTIME_NETWORK_MODE:-open-science-runtime-internal}
      OPEN_SCIENCE_RUNTIME_INTERNAL_NETWORK_NAME: ${OPEN_SCIENCE_RUNTIME_INTERNAL_NETWORK_NAME:-open-science-runtime-internal}
      OPEN_SCIENCE_ALLOW_RUNTIME_NETWORK_EGRESS: ${OPEN_SCIENCE_ALLOW_RUNTIME_NETWORK_EGRESS:-false}
      OPEN_SCIENCE_RUNTIME_NETWORK_EGRESS_POLICY_ACK: ${OPEN_SCIENCE_RUNTIME_NETWORK_EGRESS_POLICY_ACK:-false}
      OPEN_SCIENCE_RUNTIME_CPU_LIMIT: ${OPEN_SCIENCE_RUNTIME_CPU_LIMIT:-2}
      OPEN_SCIENCE_RUNTIME_MEMORY_LIMIT: ${OPEN_SCIENCE_RUNTIME_MEMORY_LIMIT:-4g}
      OPEN_SCIENCE_RUNTIME_PIDS_LIMIT: ${OPEN_SCIENCE_RUNTIME_PIDS_LIMIT:-256}
      OPEN_SCIENCE_RUNTIME_NO_NEW_PRIVILEGES: ${OPEN_SCIENCE_RUNTIME_NO_NEW_PRIVILEGES:-true}
      OPEN_SCIENCE_RUNTIME_CAP_DROP: ${OPEN_SCIENCE_RUNTIME_CAP_DROP:-ALL}
      OPEN_SCIENCE_RUNTIME_READ_ONLY_ROOT: ${OPEN_SCIENCE_RUNTIME_READ_ONLY_ROOT:-true}
      OPEN_SCIENCE_RUNTIME_TMPFS: ${OPEN_SCIENCE_RUNTIME_TMPFS:-/tmp:rw,nosuid,nodev,size=64m}
      OPEN_SCIENCE_RUNTIME_CONTAINER_USER: ${OPEN_SCIENCE_RUNTIME_CONTAINER_USER:-}
      OPEN_SCIENCE_ALLOW_RUNTIME_HOST_NETWORK: ${OPEN_SCIENCE_ALLOW_RUNTIME_HOST_NETWORK:-false}
      OPEN_SCIENCE_ENABLE_KERNEL: ${OPEN_SCIENCE_ENABLE_KERNEL:-false}
      OPEN_SCIENCE_KERNEL_SANDBOX_MODE: ${OPEN_SCIENCE_KERNEL_SANDBOX_MODE:-docker}
      OPEN_SCIENCE_MAX_JSON_BYTES: ${OPEN_SCIENCE_MAX_JSON_BYTES:-12582912}
      OPEN_SCIENCE_KERNEL_MAX_OUTPUT_BYTES: ${OPEN_SCIENCE_KERNEL_MAX_OUTPUT_BYTES:-1048576}
      OPEN_SCIENCE_KERNEL_TIMEOUT_MS: ${OPEN_SCIENCE_KERNEL_TIMEOUT_MS:-10000}
      OPEN_SCIENCE_MAX_CONCURRENT_KERNELS: ${OPEN_SCIENCE_MAX_CONCURRENT_KERNELS:-2}
      OPEN_SCIENCE_MAX_CONCURRENT_KERNELS_PER_USER: ${OPEN_SCIENCE_MAX_CONCURRENT_KERNELS_PER_USER:-1}
      OPEN_SCIENCE_MAX_RUNNING_RUNTIMES: ${OPEN_SCIENCE_MAX_RUNNING_RUNTIMES:-8}
      OPEN_SCIENCE_MAX_RUNNING_RUNTIMES_PER_USER: ${OPEN_SCIENCE_MAX_RUNNING_RUNTIMES_PER_USER:-4}
    volumes:
      - open-science-data:/data:ro
      - open-science-runtime-control:/run/open-science-controller
      - type: bind
        source: ${OPEN_SCIENCE_RELEASE_MANIFEST_HOST_FILE:-./release-manifest.json}
        target: /run/open-science/release-manifest.json
        read_only: true
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${OPEN_SCIENCE_DOCKER_SOCKET_GID:?set OPEN_SCIENCE_DOCKER_SOCKET_GID}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const http=require('node:http');const r=http.request({socketPath:'/run/open-science-controller/controller.sock',path:'/v1/health'},s=>process.exit(s.statusCode===200?0:1));r.on('error',()=>process.exit(1));r.end()",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m
    restart: unless-stopped

  opencode-runtime-image:
    image: ${OPEN_SCIENCE_RUNTIME_CONTAINER_IMAGE:-open-science-opencode:opencode-1.17.13-uv-0.11.26}
    build:
      context: ../..
      dockerfile: deploy/runtime-opencode/Dockerfile
      args:
        OPENCODE_VERSION: ${OPEN_SCIENCE_OPENCODE_VERSION:-1.17.13}
        UV_VERSION: ${OPEN_SCIENCE_UV_VERSION:-0.11.26}
        OPENCODE_SHA256_AMD64: ${OPEN_SCIENCE_OPENCODE_SHA256_AMD64:-157afa289d1a8d9372de0ce19ac726119b937a1f6b201808d46f06e4e59bb348}
        OPENCODE_SHA256_ARM64: ${OPEN_SCIENCE_OPENCODE_SHA256_ARM64:-bbaccdd374aaab66cd97c7f8ad1c080aa393610fa5f80ee8dfc007f9500afaf9}
        UV_SHA256_AMD64: ${OPEN_SCIENCE_UV_SHA256_AMD64:-6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0}
        UV_SHA256_ARM64: ${OPEN_SCIENCE_UV_SHA256_ARM64:-befa1a59c91e96eb601b0fd9a97c03dd666f17baba644b2b4db9c59a767e387e}
        OPENCODE_LICENSE_SHA256: ${OPEN_SCIENCE_OPENCODE_LICENSE_SHA256:-625f0f619133f89bbbb2abe37369613dfa1885eba1e50d02170deb62bb42cb6b}
        UV_LICENSE_MIT_SHA256: ${OPEN_SCIENCE_UV_LICENSE_MIT_SHA256:-860e3d7a86b84e6a7012c7a635fc64df475cebc6cce34dfeb73a5982ec58176c}
        APP_VERSION: ${OPEN_SCIENCE_APP_VERSION:-0.1.3}
        RELEASE_ID: ${OPEN_SCIENCE_RELEASE_ID:?set OPEN_SCIENCE_RELEASE_ID}
        SOURCE_REVISION: ${OPEN_SCIENCE_SOURCE_REVISION:?set OPEN_SCIENCE_SOURCE_REVISION}
        BUILD_CREATED: ${OPEN_SCIENCE_BUILD_CREATED:?set OPEN_SCIENCE_BUILD_CREATED}
    profiles: ["runtime-image"]
    command: ["opencode", "--version"]

  caddy:
    image: caddy:${OPEN_SCIENCE_CADDY_VERSION:-2.11.4-alpine}
    profiles: ["tls"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      OPEN_SCIENCE_DOMAIN: ${OPEN_SCIENCE_DOMAIN:-localhost}
      OPEN_SCIENCE_PROXY_MAX_BODY_SIZE: ${OPEN_SCIENCE_PROXY_MAX_BODY_SIZE:-73408512}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - open-science-web
    restart: unless-stopped

volumes:
  evimed-postgres-data:
  evimed-memos-data:
  evimed-memos-integration:
  open-science-data:
    name: ${OPEN_SCIENCE_DATA_VOLUME:-open-science-data}
  open-science-runtime-control:
  open-science-backups:
  caddy-data:
  caddy-config:

networks:
  runtime-internal:
    name: ${OPEN_SCIENCE_RUNTIME_INTERNAL_NETWORK_NAME:-open-science-runtime-internal}
    internal: true
