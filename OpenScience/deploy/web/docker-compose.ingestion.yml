services:
  open-science-web:
    environment:
      OPEN_SCIENCE_SOURCE_INGESTION_ENABLED: "true"
      # The in-house parsing API is a metered external service reached over
      # HTTP with a key its own console issues; nothing of it runs here. The
      # address defaults to the parser team's test server, the only one given.
      # Required means readiness fails unless the key is present and the
      # service answers healthy; CI holds no key and switches it off.
      OPEN_SCIENCE_REQUIRE_DOCUMENT_PARSER: ${OPEN_SCIENCE_REQUIRE_DOCUMENT_PARSER:-true}
      OPEN_SCIENCE_DOCUMENT_PARSER_URL: ${OPEN_SCIENCE_DOCUMENT_PARSER_URL:-http://123.57.56.88:9011}
      OPEN_SCIENCE_DOCUMENT_PARSER_TOKEN_FILE: /run/secrets/document-parser-token
      OPEN_SCIENCE_DOCUMENT_PARSER_TIMEOUT_MS: ${OPEN_SCIENCE_DOCUMENT_PARSER_TIMEOUT_MS:-300000}
      OPEN_SCIENCE_DOCUMENT_PARSER_REVISION: ${OPEN_SCIENCE_DOCUMENT_PARSER_REVISION:-evimed-extract@0.5.0}
      OPEN_SCIENCE_SOURCE_DOI_CHECK_TIMEOUT_MS: ${OPEN_SCIENCE_SOURCE_DOI_CHECK_TIMEOUT_MS:-8000}
      OPEN_SCIENCE_OPENLIST_URL: http://evimed-openlist:5244
      OPEN_SCIENCE_OPENLIST_TOKEN_FILE: /run/openlist-secrets/openlist.token
      OPEN_SCIENCE_OPENLIST_TENANT_ROOT: ${OPEN_SCIENCE_OPENLIST_TENANT_ROOT:-/tenants}
      OPEN_SCIENCE_OPENLIST_MAX_DOWNLOAD_BYTES: ${OPEN_SCIENCE_OPENLIST_MAX_DOWNLOAD_BYTES:-67108864}
      OPEN_SCIENCE_REQUIRE_OPENLIST: "true"
      OPEN_SCIENCE_AUTOPILOT_ENABLED: "true"
      OPEN_SCIENCE_AUTOPILOT_POLL_MS: ${OPEN_SCIENCE_AUTOPILOT_POLL_MS:-1000}
      OPEN_SCIENCE_AUTOPILOT_LEASE_MS: ${OPEN_SCIENCE_AUTOPILOT_LEASE_MS:-300000}
      OPEN_SCIENCE_REQUIRE_INBOX: "true"
    volumes:
      # Owner-only on the host. An empty file is a deployment without the key
      # yet: text formats still parse here and every other format is refused
      # with a stated reason instead of the container failing to start.
      - type: bind
        source: ${OPEN_SCIENCE_DOCUMENT_PARSER_TOKEN_HOST_FILE:?set OPEN_SCIENCE_DOCUMENT_PARSER_TOKEN_HOST_FILE}
        target: /run/secrets/document-parser-token
        read_only: true
        bind:
          create_host_path: false
      - evimed-openlist-secrets:/run/openlist-secrets:ro
    depends_on:
      evimed-openlist:
        condition: service_healthy
    networks:
      - default
      - ingestion-internal

  evimed-openlist-init:
    image: openlistteam/openlist:v4.2.6@sha256:c555c6e1c8af2aead38ed12ec761ac077fdf046d19cf033414be8e056aec6b64
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 1001:1001 /opt/openlist/data"]
    volumes:
      - evimed-openlist-data:/opt/openlist/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    restart: "no"

  evimed-openlist-bootstrap:
    image: openlistteam/openlist:v4.2.6@sha256:c555c6e1c8af2aead38ed12ec761ac077fdf046d19cf033414be8e056aec6b64
    user: "0:0"
    entrypoint: ["/bin/sh", "/opt/evimed/bootstrap-openlist.sh"]
    volumes:
      - evimed-openlist-data:/opt/openlist/data
      - evimed-openlist-secrets:/run/openlist-secrets
      - ../openlist/bootstrap.sh:/opt/evimed/bootstrap-openlist.sh:ro
      - type: bind
        source: ${OPEN_SCIENCE_OPENLIST_ADMIN_PASSWORD_HOST_FILE:?set OPEN_SCIENCE_OPENLIST_ADMIN_PASSWORD_HOST_FILE}
        target: /run/secrets/openlist-admin-password
        read_only: true
    depends_on:
      evimed-openlist-init:
        condition: service_completed_successfully
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    restart: "no"

  evimed-openlist:
    image: openlistteam/openlist:v4.2.6@sha256:c555c6e1c8af2aead38ed12ec761ac077fdf046d19cf033414be8e056aec6b64
    user: "1001:1001"
    environment:
      UMASK: "077"
    volumes:
      - evimed-openlist-data:/opt/openlist/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5244/ping"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      evimed-openlist-bootstrap:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    restart: unless-stopped

volumes:
  evimed-openlist-data:
  evimed-openlist-secrets:

networks:
  ingestion-internal:
    internal: true
