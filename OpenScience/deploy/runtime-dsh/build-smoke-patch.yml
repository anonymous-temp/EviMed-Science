# NOT generated at runtime — a build-time fixture.
#
# The control plane renders a patch like this on every runtime start, and the
# smoke boots without one until this file existed. That gap cost a defect: the
# `mcp-evimed` row is created by the patch, so its config shape was never
# checked by anything that ran, and a nested `transport:` block the plugin's
# schema rejects took down the whole tree in a real container while the build
# stayed green.
#
# Every value here is a placeholder that resolves to nothing reachable. What is
# under test is the SHAPE. `apps/server/test/dshProfilePatch.test.mjs` asserts
# this file's rows and keys still match what the renderer produces, so it cannot
# drift into agreeing with a patch nobody sends.
#
# Generated by the control plane on every runtime start. Do not edit.
#
# It holds exactly the rows that differ between deployments: the gateway the
# kernel talks to, the MCP command and its environment, the read-only roots,
# and the limits the control plane owns. Everything else ships in the bundle.

# The kernel never holds a real provider key. `baseURL` is our own gateway,
# which authenticates a short-lived workload token and exchanges it for the
# real credential server-side; `apiKeyEnv` names a reference resolved per
# request from $DSH_HOME/.credentials.yaml, so a token refresh is a file
# rewrite rather than a restart.
- id: llm-deepseek
  config:
    baseURL: 'https://open-science-web:8787/internal/model/v1'
    apiKeyEnv: 'EVIMED_WORKLOAD_TOKEN'
    thinking: enabled
    reasoningEffort: high
    models:
      - id: 'deepseek-v4-pro'
        contextWindow: 1000000

- id: agent-default-model
  config:
    provider: deepseek-official
    model: 'deepseek-v4-pro'

# Session logs live on the project's own data volume, so they are backed up,
# exported and deleted with the project.
- id: session-persistence-jsonl
  config:
    root: '/runtime/dsh-home/sessions'

# Cross-session full-text search stays in memory: the index would be a second
# copy of session content on disk, and we do not read it.
- id: session-query-sqlite
  config:
    path: ':memory:'

# Telemetry has no redaction rules and its full mode ships message bodies off
# the box. Disabled here as well as by environment variable.
- id: session-telemetry-otel
  disabled: true

# The preset ships with the bundle as a system-trusted root, so a copy a user
# made into their own root cannot shadow it: the first root wins a name
# collision, and system roots come first.
# The preset root this image ships, named the same way the control plane's
# generated profile patch names it. It was absent here while the image copied
# the preset into the kernel's own directory; alpha.5 moved that directory into
# a package and made configured roots work, so both patches name the root now.
# Without it the boot is fine and the session is not: "preset
# \"evimed-universal\" not found (available: standard, ptc, minimal, cordis)".
- id: agent-presets
  config:
    roots:
      - path: /opt/evimed/dsh/presets
        trust: system
    default: 'evimed-universal'

# The research tools. The MCP process runs outside the kernel's sandbox by
# design (its command is trusted executable code), so it holds the workload
# token and nothing else.
- insert:
    - id: mcp-evimed
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: 'evimed'
        failOnStartupError: true
        toolCallTimeoutMs: 180000
        command: python3
        args:
          - '/opt/evimed/mcp/evimed-research/server.py'
        env:
          EVIMED_PUBLIC_SOURCE_GATEWAY_URL: 'https://open-science-web:8787/internal/sources/v1'
          EVIMED_WEB_SEARCH_GATEWAY_URL: 'https://open-science-web:8787/internal/search/v1'
          EVIMED_WORKLOAD_TOKEN_FILE: '/runtime/secrets/workload-token'
          OPEN_SCIENCE_PROJECT_ID: 'prj_1'

# The two plugins the bundle mounts in the host composition. Every other
# setting of ours travels as container environment, because a profile patch
# cannot reach a row that a preset mounts.
- id: evimed-seam-probe
  config:
    requiredEnforcement: 'partial'
    dshVersion: '0.1.2-alpha.5'


# Inside a container whose only writable place is the workspace nothing
# needs approval; the only things that ask are attempts to leave the
# sandbox, and an unattended run should refuse those rather than hang.
#
# The row is `approval` and its field is `policy`, both read from a running
# host's own --dump-config. An earlier version of this file addressed a
# `permission-presets` row with a `presets` list, which does not exist: the
# patch was reported as an unmatched target on stderr and dropped, leaving
# an unattended runtime on the stock policy that asks and then waits.
- id: approval
  config:
    policy: 'never'

# The pair above has to be a NAMED preset, or nothing starts.
#
# `dsh-permission-presets` derives the default preset from the composed
# sandbox mode and approval policy, and refuses to load when the pair
# matches none of them: "composed sandbox and approval defaults match no
# preset; configure defaultPreset explicitly". Its three shipped presets
# pair a confined sandbox with `ask` and an unconfined one with `never` —
# and a hosted run wants neither. It wants `workspace-write` with `never`,
# because inside the sandbox nothing needs approval and the only things
# that ask are attempts to leave it, which an unattended run should refuse.
#
# The table is replaced wholesale rather than extended, so the three shipped
# rows are restated here; dropping one would remove a preset a user could
# otherwise select.
- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
      evimed-hosted:
        sandbox: workspace-write
        approval: never
        name: 'evimed-hosted'
        description: 'Confined to the workspace, and refuses anything that asks to leave it.'
    defaultPreset: 'evimed-hosted'
