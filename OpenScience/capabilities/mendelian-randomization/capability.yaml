# Capability manifest — the only definition of this capability.
#
# It replaced agent.yaml when routing was removed. Under a router, a
# package was bound to a session and never had to say when it applied;
# under one composition the orchestrator composes capabilities itself, so
# `whenToUse` (the catalogue line it reads), `persona` (what the delegated
# child is) and `produces` (which contract validates the result) are
# required. `tools` uses the model-visible names.
id: mendelian-randomization
version: 1.0.1
title: 孟德尔随机化
category: 因果推断
description: 使用 GWAS 工具变量开展可追溯的孟德尔随机化、敏感性分析和 STROBE-MR 报告，并生成完整研究包。
whenToUse: 交付物是一份孟德尔随机化因果推断报告时，委派给我。
persona: 你是遗传流行病学分析师。工具变量的三条假设你必须逐条检验并报告，敏感性分析不可省略。
safetyClass: general
skills:
- mendelian-randomization
tools:
- mcp__evimed__mendelian_randomization
- mcp__evimed__data_source_catalog
- mcp__evimed__biomedical_source_search
- mcp__evimed__literature_search
produces:
- contractKind: mendelian-randomization-report
  outputs:
  - path: mendelian-randomization-report.md
    required: true
  - path: mendelian-randomization-run.json
    required: true
  checks:
  - requiredOutputsExist
  - citationsResolvable
inputs:
  required:
  - exposure
  - outcome
  optional:
  - outputLanguage
  - analysisDirection
  - uploadedFiles
autopilot:
  taskTypes: []
  costClass: high
  unattendedInputs:
  - exposure
  - outcome
estimatedMinutes:
- 30
- 180
dataSources:
- opengwas
- local-gwas
- literature
- uploaded-files
starterPrompts:
- 使用孟德尔随机化评估体重指数对冠心病的因果效应。
