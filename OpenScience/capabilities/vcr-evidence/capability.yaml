# Capability contract; conversation-native VCR reset, 2026-10-26.
# Module workflows are explicit specialists; ordinary conversation can load their skills and call shared tools.
id: vcr-evidence
visibility: public
version: 1.4.1
title: Virtual Clinical Research — Evidence Parameterization
category: Clinical Research
description: |
  Retrieve and preserve registry and publication evidence, verify numerical values and units, and produce source-bound assumptions for the requested research task.
whenToUse: |
  Virtual Clinical Research (虚拟临床研究): Use when a VCR task needs trial precedents, preserved literature parameters, baseline evidence or source-grounded assumptions. Search before requesting statistical inputs; retain specific source gaps.
persona: |
  Work in the current conversation and answer in Chinese unless requested otherwise. Complete only the requested scope. Use preserved evidence and exact tools for numbers. Explain task-specific data requirements and missingness. Never invent patient facts, treatment exposure, clinical validation or regulatory acceptance. Matching stops at assessment; recruitment operations are retired.
safetyClass: general
skills:
- vcr-evidence
- citation-integrity
- biomedical-database-search
tools:
- mcp__evimed__vcr_read
- mcp__evimed__vcr_write
- mcp__evimed__vcr_simulate
- mcp__evimed__evidence_pool
- mcp__evimed__trial_registry_record
- mcp__evimed__curve_digitize
- mcp__evimed__clinical_trial_search
- mcp__evimed__literature_search
- mcp__evimed__open_access_full_text
- mcp__evimed__locate_quote
- mcp__evimed__guideline_search
- mcp__evimed__kb_search
- mcp__evimed__kb_browse
- mcp__evimed__frontier_search
- mcp__evimed__term_normalize
- mcp__evimed__evidence_deduplicate
- mcp__evimed__web_read
produces:
- contractKind: vcr-study-package
  outputs:
  - path: evidence-parameters.md
    role: document
    required: true
  - path: results.json
    role: data
    required: true
  - path: precedents.md
    role: document
    required: false
  - path: applicability.md
    role: document
    required: false
  - path: revision-notes.md
    role: work
    required: false
  checks:
  - requiredOutputsExist
  - skillsLoaded
inputs:
  required:
  - studyId
  optional:
  - parameters
  - registries
  - endpointKeys
  - population
  - eraYear
  - eraWindowYears
  - region
  - line
  - biomarker
autopilot:
  # Scheduling belongs to the 「虚拟临床研究」 orchestrator, which dispatches this
  # capability inside the study. The autopilot allocator has no VCR task type.
  taskTypes: []
  costClass: medium
  unattendedInputs:
  - studyId
estimatedMinutes:
- 20
- 90
dataSources:
- clinical-trials
- literature
- guidelines
- uploaded-files
starterPrompts:
- 把这项研究要用的参数从证据里做出来：先例、抽取、合并、假设卡。

display:
  title: "证据参数化"
  category: "虚拟临床研究"
  description: 检索并保存登记与文献证据，核对原文数值、单位和独立试验身份。
  listed: false
  starterPrompts:
  - "把这项研究要用的参数从证据里做出来：先例、抽取、合并、假设卡。"
  - "对照组 12 个月无进展生存率该取多少？给出来源和预测区间。"
  - "近五年国内同类试验的计划入组与实际入组差多少？"
  materials: "需要一个研究定义（PICO 与主要终点）；已有先例登记号更好"
  estimatedMinutes:
    min: 20
    max: 90
  outputs:
  - "试验先例清单（计划与实际并列）"
  - "带原文位置的抽取值"
  - "带预测区间的假设卡"
  - "适用性分层与缺口清单"
  knownLimits:
  - "合并、异质性与预测区间由平台的统计引擎计算；引擎不可用时不出假设卡，也不会给一个估出来的数。"
  - "登记平台不记录筛选失败率、每中心入组数与中心启动日期，这三项显示「不可得」，需要合作方或申办方提供。"
  - "原文里核对不过的数一律记为「未知」，不进假设卡。"
  - "假设卡默认状态是「AI 设定」，复核是签注，不是关卡。"
