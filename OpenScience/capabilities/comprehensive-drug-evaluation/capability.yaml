# Capability manifest — the only definition of this capability.
#
# It replaced agent.yaml when routing was removed. Under a router, a
# package was bound to a session and never had to say when it applied;
# under one composition the orchestrator composes capabilities itself, so
# `whenToUse` (the catalogue line it reads), `persona` (what the delegated
# child is) and `produces` (which contract validates the result) are
# required. `tools` uses the model-visible names.
id: comprehensive-drug-evaluation
version: 2.2.1
title: Comprehensive Drug Evaluation
category: Evidence Evaluation
description: Synthesize labels, guidelines, trials, literature, HTA, effectiveness, safety, and economic
  evidence for a medicine and indication.
whenToUse: 交付物是对某个药品在某适应证下的综合评价（有效性、安全性、经济性、可及性）时，委派给我。
persona: 你是药品综合评价分析师。你按评价域逐项给出证据与结论，评分必须写清规则与依据，不做无据打分。
safetyClass: clinical
skills:
- comprehensive-drug-evaluation
tools:
- mcp__evimed__drug_term_normalize
- mcp__evimed__comprehensive_drug_evaluation
- mcp__evimed__data_source_catalog
- mcp__evimed__biomedical_source_search
- mcp__evimed__drug_label_search
- mcp__evimed__guideline_search
- mcp__evimed__clinical_trial_search
- mcp__evimed__literature_search
- mcp__evimed__kb_search
- mcp__evimed__patent_search
- mcp__evimed__pharmacy_reference_search
- mcp__evimed__evidence_deduplicate
produces:
- contractKind: drug-evaluation-report
  outputs:
  - path: comprehensive-evaluation-report.md
    required: true
  - path: evidence-table.csv
    required: true
  - path: evaluation-summary.json
    required: true
  - path: evidence-snapshot.json
    required: true
  checks:
  - requiredOutputsExist
  - citationsResolvable
  - citedSourcesRecorded
inputs:
  required:
  - drug
  - indication
  optional:
  - comparator
  - population
  - jurisdiction
  - outcomes
  - careSetting
  - timeHorizon
  - decisionDate
  - economicContext
  - quantitativeScoringRequested
  - evaluationDomains
  - scoringRubric
  - scoringPolicyVersion
  - uploadedFiles
autopilot:
  taskTypes: []
  costClass: high
  unattendedInputs:
  - drug
  - indication
estimatedMinutes:
- 25
- 60
dataSources:
- drug-labels
- guidelines
- clinical-trials
- literature
- internal-evidence
- uploaded-files
starterPrompts:
- Evaluate the overall clinical value of dapagliflozin for chronic kidney disease.
- Compare the evidence, safety, and economic implications of two medicines for one indication.

# What a researcher is shown, in Chinese: read by people, not by the
# orchestrator (the fields above). The generator derives the shell's and the
# frame's capability table from this block, and adds what evals/ measured.
display:
  title: "综合药品评价"
  category: "药学评价"
  description: "从有效性、安全性、适用性、经济性与可及性等维度完成可追溯评价；提供量表时可辅助计分。"
  starterPrompts:
  - "围绕司美格鲁肽用于 2 型糖尿病合并肥胖完成综合评价，先提示我需要补充的数据。"
  - "对恩格列净用于射血分数降低的心衰做一次综合药品评价，重点看安全性与经济性。"
  estimatedMinutes:
    min: 25
    max: 60
  outputs:
  - "综合评价报告"
  - "证据表与评价摘要"
  knownLimits:
  - "经济性与可及性依赖你提供的价格、医保与采购数据；缺项会列为缺口，不计零分。"
  - "只有在你提供量表时才计分。"
