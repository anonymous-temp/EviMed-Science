# Capability manifest — the only definition of this capability.
#
# Step 6 of a 「循证 GEO」 project (build spec 2026-09-25 §8.1). Version 2.0.0:
# the capability no longer measures. 1.x opened every run with a probe batch and
# delivered a probe ledger, a monitor table and content blocks; measurement is
# now the platform's (a server-side queue, one question per engine per fresh
# chat, metrics computed by code), so this run writes the layered articles and
# correction materials the claim library supports, and the contract reads the
# articles themselves. Hidden from 科研工具 by `display.listed: false`: the GEO
# module's orchestrator dispatches it in batches.
id: geo-content
version: 2.0.2
title: GEO Content
category: Content Production
description: Step 6 of an evidence-based GEO project — layered articles (deep analysis, evidence card, popular
  article, Q&A) and correction materials written from the project's claim library, one work record per article,
  medically reviewed, humanized with every number, quotation and drug name byte-identical, registered in the project.
whenToUse: 「循证 GEO」项目的写稿交给我：按主战场和讲错我方，从主张库写深度分析、证据卡片、科普稿件、问答与纠错材料，每篇一份工作记录，医学审核后去 AI 味。完整方案里平台会在信源分析之后按批次安排我；用户在对话里给了自己的稿件要优化或去 AI 味时，可以直接委派我。
persona: |
  你是循证 GEO 的内容作者，也是自己的第一个药师读者。每篇稿子只回答一个典型问句，结论放在最前面，
  每句关键话都落在主张库的一条主张上，措辞不比证据更强；先说边界，再说证据支持的价值。
  改语言时，数字、引文、出处、药名、剂量和限定词一个字不动。出现处理不了的安全问题，你照实标出来，
  不把它写含糊——那是整个项目里少数需要人看一眼的地方。
safetyClass: clinical
skills:
- geo-content
- manuscript-humanize
- citation-integrity
tools:
- mcp__evimed__geo_read
- mcp__evimed__geo_write
- mcp__evimed__drug_label_search
- mcp__evimed__drug_term_normalize
- mcp__evimed__pharmacy_reference_search
- mcp__evimed__guideline_search
- mcp__evimed__literature_search
- mcp__evimed__clinical_trial_search
- mcp__evimed__open_access_full_text
- mcp__evimed__locate_quote
- mcp__evimed__web_read
- mcp__evimed__web_search
- mcp__evimed__kb_search
- mcp__evimed__geo_visibility_probe
produces:
- contractKind: geo-content-pack
  outputs:
  # The index a reader opens and the index the gate reads the articles through:
  # each article is articles/<id>.md with an id the run chooses, which a
  # manifest cannot declare, so articles.json names them and the gate brings
  # them in (contractCompanionPaths in @evimed/domain).
  - path: geo-content.md
    required: true
  - path: articles.json
    required: true
  # A probe ledger exists only when the run asked an engine one question the
  # user raised; measurement proper is the platform's.
  - path: geo-probe-log.jsonl
    required: false
  - path: revision-notes.md
    required: false
  checks:
  - requiredOutputsExist
  - citationsResolvable
  - skillsLoaded
inputs:
  required:
  - brandEntity
  optional:
  - groups
  - layers
  - drafts
  - corrections
  - minimal
  - questionSet
  - competitors
  - platforms
  - deepMode
  - outputLanguage
autopilot:
  # Monitoring moved to the GEO module's own scheduler (weekly re-measurement,
  # post-publication checks, the next batch), so this capability declares no
  # autopilot task type. It used to declare signal-monitoring, which the
  # allocator dispatches to adverse-event analysis — GEO monitoring never ran.
  taskTypes: []
  costClass: high
  unattendedInputs:
  - brandEntity
estimatedMinutes:
- 30
- 150
dataSources:
- drug-labels
- literature
- guidelines
- clinical-trials
- answering-engines
starterPrompts:
- 按主战场给信尔美写第一批稿件：一篇证据卡片、两篇科普、两篇问答。

# What a researcher is shown, in Chinese. `listed: false` keeps it off 科研工具
# and the kernel's tool list; the 「循证 GEO」 module dispatches it.
display:
  # "GEO" in the title (2026-09-22): researchers know this work by that name.
  title: "循证 GEO · 分层稿件"
  category: "写作与传播"
  description: "从主张库写出四层稿件和纠错材料，逐篇审核后去 AI 味。"
  listed: false
  starterPrompts:
  - "按主战场给信尔美写第一批稿件：一篇证据卡片、两篇科普、两篇问答。"
  - "优化这几篇已有稿件：先医学审核，再去 AI 味，数字和引文一个字不动。"
  - "针对 DeepSeek 把玛仕度肽说成每天注射一次，写一份纠错材料。"
  materials: "需要项目的主张库；已有稿件可上传到知识库"
  estimatedMinutes:
    min: 30
    max: 150
  outputs:
  - "深度分析、证据卡片、科普稿件、问答"
  - "针对讲错我方的纠错材料"
  - "每篇一份工作记录"
  knownLimits:
  - "有未处理安全问题的稿件会标出来，不自动投放，需要人看一眼。"
