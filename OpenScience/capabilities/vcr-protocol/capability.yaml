# Capability contract; conversation-native VCR reset, 2026-10-26.
# Module workflows are explicit specialists; ordinary conversation can load their skills and call shared tools.
id: vcr-protocol
version: 1.4.0
title: Virtual Clinical Research Protocol
category: Study Design
description: |
  Conversation-native virtual clinical research: interpret the requested task, ground its evidence, preserve versioned objects, call exact computation and explain results. Full protocol definitions are optional and task-specific.
whenToUse: |
  Virtual Clinical Research (虚拟临床研究): Use for an explicitly selected VCR analyst conversation or protocol deliverable. Ordinary conversation can use this skill directly without specialist rebinding, a new module visit or mandatory PICO. Complete only the requested task.
persona: |
  Work in the current conversation and answer in Chinese unless requested otherwise. Complete only the requested scope. Use preserved evidence and exact tools for numbers. Explain task-specific data requirements and missingness. Never invent patient facts, treatment exposure, clinical validation or regulatory acceptance. Matching stops at assessment; recruitment operations are retired.
safetyClass: general
skills:
- vcr-protocol
- citation-integrity
tools:
- mcp__evimed__vcr_read
- mcp__evimed__vcr_write
- mcp__evimed__vcr_simulate
- mcp__evimed__evidence_pool
- mcp__evimed__trial_registry_record
- mcp__evimed__clinical_trial_search
- mcp__evimed__literature_search
- mcp__evimed__guideline_search
- mcp__evimed__open_access_full_text
- mcp__evimed__locate_quote
- mcp__evimed__term_normalize
- mcp__evimed__kb_search
- mcp__evimed__kb_browse
- mcp__evimed__web_read
produces:
- contractKind: vcr-study-package
  outputs:
  - path: study-definition.md
    role: report
    required: false
  - path: criteria.json
    role: data
    required: false
  - path: results.json
    role: data
    required: false
  checks:
  - skillsLoaded
inputs:
  required:
  - question
  optional:
  - protocolText
  - dataTier
  - intendedUse
  - endpointType
  - registryId
autopilot:
  # Scheduling is the 虚拟临床研究 module's own (its orchestrator dispatches this
  # run); the autopilot allocator has no VCR task type.
  taskTypes: []
  costClass: medium
  unattendedInputs:
  - question
estimatedMinutes:
- 5
- 30
dataSources:
- clinical-trials
- literature
- guidelines
starterPrompts:
- 把这份方案草稿的研究问题和入排条件整理出来。

display:
  title: "研究分析师"
  category: "虚拟临床研究"
  description: 从当前研究问题出发，用对话组织所需资料、证据与设计，不要求先填写完整研究表。
  listed: false
  starterPrompts:
  - "帮我估算这个研究需要多少例：HR 0.7，单侧 α 0.025，功效 90%。"
  - "按这项研究的人群生成一批合成数据。"
  - "模拟三个试验方案：2:1 固定、1:1 固定、1:1 加一次期中分析，比较功效。"
  - "EV-201 二线 NSCLC 单臂 II 期：把研究问题和入排条件写清楚。"
  materials: "一句话就够；有方案草稿、登记号或冻结的数据会更准"
  estimatedMinutes:
    min: 5
    max: 30
  outputs:
  - "对话里的回答：做了什么、在算什么、结果在研究页哪个页签"
  - "写进研究的对象：研究定义、入排条件、人群、试验方案"
  - "引擎算出的结果（样本量、事件数、功效、把握度，带蒙特卡洛标准误）"
  knownLimits:
  - "回答里的数只转述引擎算出的结果，不心算、不估算。"
  - "定义和对象里的值先生效、后复核，全部带“AI 设定”标签，随时可改。"
  - "引擎不在线时计算暂不可用；已有的对象和结果照常保留。"
