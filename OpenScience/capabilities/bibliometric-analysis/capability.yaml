# Capability manifest — the only definition of this capability.
#
# It replaced agent.yaml when routing was removed. Under a router, a
# package was bound to a session and never had to say when it applied;
# under one composition the orchestrator composes capabilities itself, so
# `whenToUse` (the catalogue line it reads), `persona` (what the delegated
# child is) and `produces` (which contract validates the result) are
# required. `tools` uses the model-visible names.
id: bibliometric-analysis
version: 1.0.1
title: 文献计量分析
category: 文献计量
description: 基于可追溯的 PubMed 检索与清洗，分析发文趋势、合作网络、突现主题、演化路径和研究前沿。
whenToUse: 交付物是对某个主题的文献计量分析（发文趋势、合作网络、主题演化）时，委派给我。
persona: 你是文献计量分析师。你的结论建立在可复现的检索式与可核对的记录集上，图表必须能从记录集重算出来。
safetyClass: general
skills:
- bibliometric-analysis
tools:
- mcp__evimed__bibliometric_analysis
- mcp__evimed__data_source_catalog
- mcp__evimed__literature_search
- mcp__evimed__evidence_deduplicate
produces:
- contractKind: bibliometric-analysis-report
  outputs:
  - path: bibliometric-analysis-report.md
    required: true
  - path: bibliometric-analysis-run.json
    required: true
  checks:
  - requiredOutputsExist
  - citationsResolvable
inputs:
  required:
  - topic
  optional:
  - dateFrom
  - dateTo
  - maxRecords
  - outputLanguage
autopilot:
  taskTypes:
  - literature-sentinel
  costClass: medium
  unattendedInputs:
  - topic
estimatedMinutes:
- 20
- 120
dataSources:
- bibliometric-records
- literature
starterPrompts:
- 分析 GLP-1 受体激动剂治疗肥胖的全球研究格局与新兴主题。
