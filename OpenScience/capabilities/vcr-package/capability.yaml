# Capability manifest — the only definition of this capability.
#
# The deliverable of a 「虚拟临研」 study (build plan 2026-09-28 §8.3): the study
# package, and the optional CDE communication pack built from it. It also writes
# the words of the two ICH M15 documents (the model analysis plan and report):
# their structure, tables and numbers are the platform's, section by section. Its structure
# follows HARPER, STaRT-RWE, TARGET and ADEMP; its numbers are **not written by
# this run**. The report is a template whose every number is a reference into
# the study's saved results (`{{n:…}}`), rendered by the control plane
# (`vcrRender.mjs`) — which is what makes AC-20 true by construction instead of
# by a check.
#
# Public so a study's conversation can be bound to it, `display.listed: false`
# so it is entered only from 「虚拟临研」.
id: vcr-package
version: 1.0.0
title: Virtual Clinical Research Package
category: Study Design
description: The deliverable of a virtual clinical research study — a package whose sections follow HARPER,
  STaRT-RWE, TARGET and ADEMP (summary, input register, assumption register, population and comparator
  definitions, results, figures, execution record, validation and limits, decision record), written as a
  template in which every number is a reference to a saved result rather than a typed figure. It also writes
  the prose sections of the model analysis plan and report (ICH M15), whose tables and numbers the platform writes.
whenToUse: 「虚拟临研」研究要交付时委派我：把这项研究的定义、假设、人群、对照、试验结果和执行记录写成一份可检查、可复现的研究包，必要时再出一份 CDE 沟通交流资料包，或写模型分析计划与模型分析报告（ICH M15）各节的文字——表格和数字由平台写。我不重新计算任何数，也不改结果。
persona: |
  你是虚拟临床研究的报告撰写人。你写字，不写数：报告里每一个数都写成 {{n:结果字段}} 的引用，由平台按保存的结果渲染，
  你手打的数字，平台在报告里写成「未计算」，并把它当成错误标出来。复核状态、过期结果和结局封存的两个时间戳照实写在封面上，未复核就写未复核——
  导出不会因为未复核被拦，但未复核的研究包不能标「指定研究分析」及以上的预期用途。
  结论是「不可估计」的，就把它当成一份完成的结果来写，并列出缺什么。
safetyClass: general
skills:
- vcr-package
- citation-integrity
- manuscript-humanize
tools:
- mcp__evimed__vcr_read
- mcp__evimed__vcr_write
- mcp__evimed__locate_quote
- mcp__evimed__kb_search
- mcp__evimed__literature_search
- mcp__evimed__open_access_full_text
produces:
- contractKind: vcr-study-package
  outputs:
  - path: study-package.md
    required: true
  - path: results.json
    required: true
  - path: assumption-register.md
    required: true
  - path: execution-record.md
    required: true
  - path: cde-communication-pack.md
    required: false
  checks:
  - requiredOutputsExist
  - citationsResolvable
  - skillsLoaded
inputs:
  required:
  - studyId
  optional:
  - kind
  - audience
  - outputLanguage
autopilot:
  taskTypes: []
  costClass: medium
  unattendedInputs:
  - studyId
estimatedMinutes:
- 10
- 60
dataSources:
- literature
- clinical-trials
starterPrompts:
- 把这项研究整理成一份可以交出去的研究包。

display:
  title: "研究包与沟通资料"
  category: "虚拟临研"
  description: "把研究的定义、假设、结果与执行记录写成可检查、可复现的研究包，数字由结果渲染。"
  listed: false
  starterPrompts:
  - "把这项研究整理成一份可以交出去的研究包。"
  - "按 CDE 沟通交流指导原则再出一份资料包。"
  - "研究包封面要写清楚复核状态和结局封存的时间。"
  materials: "一项已经有结果的研究；没有结果的部分会照实写成缺口"
  estimatedMinutes:
    min: 10
    max: 60
  outputs:
  - "研究包（概要、输入清单、假设登记表、定义、结果、执行记录、验证与局限、决策记录）"
  - "可选的 CDE 沟通交流资料包"
  - "模型分析计划与模型分析报告各节的文字（结构、表格和数字由平台写）"
  knownLimits:
  - "报告里的数由平台按保存的结果渲染；手打的数字会被写成「未计算」并标出来。"
  - "过期的结果不会被删掉：要么重算，要么在封面上照实写明。"
  - "模型分析计划与报告只接受规定的几节文字；表格、登记项和数字由平台按研究记录写，冻结的计划不会被改写。"
