# Capability contract; conversation-native VCR reset, 2026-10-26.
# Module workflows are explicit specialists; ordinary conversation can load their skills and call shared tools.
id: vcr-package
version: 1.2.0
title: Virtual Clinical Research Package
category: Study Design
description: |
  Produce an explicitly requested study package, model-analysis document or regulator-facing preparation from saved evidence and computations, without new calculations or invented certainty.
whenToUse: |
  Virtual Clinical Research (虚拟临床研究): Use only for an explicitly requested package/report/model-analysis document. Narrow conversation tasks do not owe a full study package.
persona: |
  Work in the current conversation and answer in Chinese unless requested otherwise. Complete only the requested scope. Use preserved evidence and exact tools for numbers. Explain task-specific data requirements and missingness. Never invent patient facts, treatment exposure, clinical validation or regulatory acceptance. Matching stops at assessment; recruitment operations are retired. In formal reports use saved-result numeric references and retain verification/staleness labels; preserve useful partial work.
safetyClass: general
skills:
- vcr-package
- citation-integrity
- manuscript-humanize
tools:
- mcp__evimed__vcr_read
- mcp__evimed__vcr_write
- mcp__evimed__locate_quote
- mcp__evimed__kb_search
- mcp__evimed__kb_browse
- mcp__evimed__literature_search
- mcp__evimed__open_access_full_text
produces:
- contractKind: vcr-study-package
  outputs:
  - path: study-package.md
    role: report
    required: true
  - path: results.json
    role: data
    required: true
  - path: assumption-register.md
    role: document
    required: true
  - path: execution-record.md
    role: document
    required: true
  - path: cde-communication-pack.md
    role: document
    required: false
  checks:
  - requiredOutputsExist
  - citationsResolvable
  - skillsLoaded
inputs:
  required:
  - studyId
  optional:
  - kind
  - audience
  - outputLanguage
autopilot:
  taskTypes: []
  costClass: medium
  unattendedInputs:
  - studyId
estimatedMinutes:
- 10
- 60
dataSources:
- literature
- clinical-trials
starterPrompts:
- 把这项研究整理成一份可以交出去的研究包。

display:
  title: "研究包与沟通资料"
  category: "虚拟临床研究"
  description: 将已保存的证据和计算整理为所需研究文件，保留版本、来源与尚未解决的缺口。
  listed: false
  starterPrompts:
  - "把这项研究整理成一份可以交出去的研究包。"
  - "按 CDE 沟通交流指导原则再出一份资料包。"
  - "研究包封面要写清楚复核状态和结局封存的时间。"
  materials: "一项已经有结果的研究；没有结果的部分会照实写成缺口"
  estimatedMinutes:
    min: 10
    max: 60
  outputs:
  - "研究包（概要、输入清单、假设登记表、定义、结果、执行记录、验证与局限、决策记录）"
  - "可选的 CDE 沟通交流资料包"
  - "模型分析计划与模型分析报告各节的文字（结构、表格和数字由平台写）"
  knownLimits:
  - "报告里的数由平台按保存的结果渲染；手打的数字会被写成「未计算」并标出来。"
  - "过期的结果不会被删掉：要么重算，要么在封面上照实写明。"
  - "模型分析计划与报告只接受规定的几节文字；表格、登记项和数字由平台按研究记录写，冻结的计划不会被改写。"
