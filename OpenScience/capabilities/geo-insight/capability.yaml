# Capability manifest — the only definition of this capability.
#
# Steps 1–3 of a 「循证 GEO」 project (build spec 2026-09-25 §8.1): the thinking
# half of evidence, journey and questions. The GEO module dispatches it inside
# the GEO project and binds the project's first conversation to it; the platform
# measures what it locks (the baseline is a server worker, never this run).
# Public so a session can be bound to it, and kept off 科研工具 and the kernel's
# own tool list by `display.listed: false` — `visibility: internal` would make
# that binding answer 403.
id: geo-insight
version: 1.0.5
title: GEO Insight
category: Content Production
description: Steps 1–3 of an evidence-based GEO project for one medicine — verified identity and label, a claim
  library of verbatim-quoted statements, patient subtypes, journey and care nodes, and a four-pool question map
  with control groups, registered in the project and locked for measurement.
whenToUse: 「循证 GEO」项目的证据、旅程、问题三步交给我：输入一个药品名，我核验产品身份与说明书、建主张库、画患者旅程与就医节点、采真实问法并锁定四池测量问句。用户要完整方案时，对话里也只委派我这一步：问句锁定后平台自己批量测量（夜间），再按顺序自动安排信源、写稿、投放与监测，不要在同一次对话里委派后面的步骤。
persona: |
  你是循证 GEO 的证据与问题分析师。你先把产品认准——哪个厂家、哪个剂型规格、哪份说明书——再谈别的；
  主张库里每一句都能指回一段原文，措辞不比证据更强。真实问法只来自真人说过的话，采不到就写「无信号」，
  不替患者编原话。能自己定的默认值你直接定，写进假设清单，不去打扰用户；只有认不准是哪个产品时才问一句。
safetyClass: clinical
skills:
- geo-insight
- citation-integrity
- biomedical-database-search
tools:
- mcp__evimed__geo_read
- mcp__evimed__geo_write
- mcp__evimed__social_posts_search
- mcp__evimed__drug_label_search
- mcp__evimed__drug_term_normalize
- mcp__evimed__pharmacy_reference_search
- mcp__evimed__guideline_search
- mcp__evimed__literature_search
- mcp__evimed__clinical_trial_search
- mcp__evimed__open_access_full_text
- mcp__evimed__locate_quote
- mcp__evimed__web_search
- mcp__evimed__web_read
- mcp__evimed__term_normalize
- mcp__evimed__kb_search
- mcp__evimed__geo_visibility_probe
produces:
- contractKind: geo-insight-pack
  outputs:
  - path: geo-insight.md
    required: true
  - path: claims.json
    required: true
  - path: question-map.json
    required: true
  - path: journey.md
    required: false
  - path: revision-notes.md
    required: false
  checks:
  - requiredOutputsExist
  - citationsResolvable
  - skillsLoaded
inputs:
  required:
  - brandEntity
  optional:
  - coverageDays
  - engines
  - step
  - minimal
  - clientQuestions
  - competitors
autopilot:
  # Scheduling is the GEO module's own (its orchestrator dispatches this run);
  # the autopilot allocator has no GEO task type.
  taskTypes: []
  costClass: high
  unattendedInputs:
  - brandEntity
estimatedMinutes:
- 30
- 120
dataSources:
- drug-labels
- guidelines
- literature
- clinical-trials
- answering-engines
starterPrompts:
- 为信尔美（玛仕度肽注射液）做一套完整的循证 GEO 方案。

# What a researcher is shown, in Chinese. `listed: false` keeps it off 科研工具
# and the kernel's tool list: the 「循证 GEO」 module opens it by id, and the
# composer's chip for a GEO project's conversation reads this title — which is
# why it is the module's own name.
display:
  title: "循证 GEO"
  category: "写作与传播"
  description: "核验产品与说明书，建主张库，画患者旅程并锁定测量问句。"
  listed: false
  starterPrompts:
  - "为信尔美（玛仕度肽注射液）做一套完整的循证 GEO 方案。"
  - "AI 现在怎么说诺和盈（司美格鲁肽注射液）？先把证据和问题做出来。"
  - "只列问题：给连花清瘟胶囊出一版 30 个问句的最小测量集。"
  materials: "需要一个药品名：商品名、通用名或批准文号都可以"
  estimatedMinutes:
    min: 30
    max: 120
  outputs:
  - "产品身份与主张库"
  - "患者旅程与就医节点"
  - "四池问题地图与测量问句"
  knownLimits:
  - "真实问法依赖社媒采集通道；采不到时只用典型问句，并如实标注。"
