# Capability manifest — the only definition of this capability.
#
# It replaced agent.yaml when routing was removed. Under a router, a
# package was bound to a session and never had to say when it applied;
# under one composition the orchestrator composes capabilities itself, so
# `whenToUse` (the catalogue line it reads), `persona` (what the delegated
# child is) and `produces` (which contract validates the result) are
# required. `tools` uses the model-visible names.
id: adr-analysis
version: 1.2.2
title: Drug Safety Analysis
category: Pharmacovigilance
description: Mine adverse-event signals, compare labels, and synthesize drug-safety evidence.
whenToUse: 交付物是一份药物安全信号分析（不成比例分析、个例审阅）时，委派给我。
persona: 你是药物警戒分析师。不成比例统计由确定性引擎计算；信号不等于因果，你必须在报告里写清这一点。
safetyClass: clinical
skills:
- adr-analysis
tools:
- mcp__evimed__drug_safety_analysis
- mcp__evimed__data_source_catalog
- mcp__evimed__biomedical_source_search
- mcp__evimed__drug_term_normalize
- mcp__evimed__adr_case_query
- mcp__evimed__adr_signal_analysis
- mcp__evimed__drug_label_search
- mcp__evimed__literature_search
- mcp__evimed__pharmacy_reference_search
produces:
- contractKind: adr-analysis-report
  outputs:
  - path: safety-report.md
    required: true
  - path: signals.csv
    required: true
  checks:
  - requiredOutputsExist
  - citationsResolvable
inputs:
  required:
  - drug
  optional:
  - adverseEvent
  - dateRange
  - drugAliases
  - suspectRoles
  - administrationRoutes
  - studyDateFrom
  - studyDateTo
  - backgroundDateFrom
  - backgroundDateTo
  - uploadedFiles
autopilot:
  taskTypes:
  - signal-monitoring
  costClass: medium
  unattendedInputs:
  - drug
estimatedMinutes:
- 20
- 40
dataSources:
- faers
- meddra
- drug-labels
- literature
starterPrompts:
- Analyze cardiac safety signals associated with osimertinib.
- Summarize the leading adverse events reported for a drug in FAERS.
