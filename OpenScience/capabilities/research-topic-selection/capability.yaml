# Capability manifest — the only definition of this capability.
#
# It replaced agent.yaml when routing was removed. Under a router, a
# package was bound to a session and never had to say when it applied;
# under one composition the orchestrator composes capabilities itself, so
# `whenToUse` (the catalogue line it reads), `persona` (what the delegated
# child is) and `produces` (which contract validates the result) are
# required. `tools` uses the model-visible names.
id: research-topic-selection
version: 1.3.0
title: 科研选题
category: 科研规划
description: 梳理研究版图、矛盾、证据空白与可行性，把宽泛的生物医学方向转化为有证据依据且可检验的研究问题和优先议程。
whenToUse: 交付物是一份科研选题分析（问题图景、证据缺口、可行议题）时，委派给我。
persona: 你是科研选题分析师。你把一个方向拆成可做的问题，每个问题都要写清「为什么现在做」与「什么证据说明它还没被回答」。
safetyClass: general
skills:
- research-topic-selection
- autopilot-episode
tools:
- mcp__evimed__research_topic_selection
- mcp__evimed__biomedical_source_search
- mcp__evimed__literature_search
- mcp__evimed__open_access_full_text
- mcp__evimed__web_search
- mcp__evimed__data_source_catalog
- mcp__evimed__guideline_search
- mcp__evimed__bibliometric_analysis
- mcp__evimed__clinical_trial_search
- mcp__evimed__pharmacy_reference_search
produces:
- contractKind: research-topic-report
  outputs:
  - path: research-topic-report.md
    required: true
  - path: evidence-map.md
    required: true
  - path: research-topic-run.json
    required: true
  - path: research-portfolio.json
    required: true
  - path: evidence-records.json
    required: true
  - path: agenda-delta.json
    required: false
  checks:
  - requiredOutputsExist
  - citationsResolvable
  - skillsLoaded
inputs:
  required:
  - researchDirection
  optional:
  - availableData
  - population
  - studySetting
  - resourceConstraints
  - outputLanguage
  - uploadedFiles
autopilot:
  taskTypes:
  - hypothesis-suggestion
  costClass: medium
  unattendedInputs:
  - researchDirection
estimatedMinutes:
- 20
- 90
dataSources:
- literature
- clinical-trials
- internal-evidence
- uploaded-files
starterPrompts:
- 为危重症成人抗菌药物精准给药识别高价值、可行的研究选题。

# What a researcher is shown, in Chinese: read by people, not by the
# orchestrator (the fields above). The generator derives the shell's and the
# frame's capability table from this block, and adds what evals/ measured.
display:
  title: "科研选题"
  category: "研究设计与数据"
  description: "从宽泛方向中识别证据空白、科学矛盾与可执行的高价值研究问题。"
  starterPrompts:
  - "围绕重症患者抗菌药精准给药，提出有证据依据且可落地的科研选题。"
  - "老年多重用药与跌倒风险，有哪些值得做、三甲医院能做的研究问题？"
  estimatedMinutes:
    min: 20
    max: 90
  outputs:
  - "选题报告与证据版图"
  - "研究组合建议"
  knownLimits:
  - "可执行性按公开证据判断；你所在机构的资源、病例量与伦理条件需要你在问题里说明。"
