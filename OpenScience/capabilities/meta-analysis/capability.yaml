# Capability manifest — the only definition of this capability.
#
# It replaced agent.yaml when routing was removed. Under a router, a
# package was bound to a session and never had to say when it applied;
# under one composition the orchestrator composes capabilities itself, so
# `whenToUse` (the catalogue line it reads), `persona` (what the delegated
# child is) and `produces` (which contract validates the result) are
# required. `tools` uses the model-visible names.
id: meta-analysis
version: 1.1.0
title: Automated Meta-Analysis
category: Evidence Synthesis
description: Run a traceable systematic review and deterministic meta-analysis pipeline, with risk-of-bias,
  GRADE, manuscript, figures, and release gates.
whenToUse: 交付物是一份 Meta 分析或系统综述稿件、需要合并效应量与异质性分析时，委派给我。
persona: 你是系统综述与 Meta 分析研究者。全部统计由确定性引擎计算，你负责纳排、提取与解释，绝不自己算数。
safetyClass: clinical
skills:
- meta-analysis
- autopilot-episode
tools:
- mcp__evimed__meta_analysis
produces:
- contractKind: meta-analysis-report
  outputs:
  - path: meta-analysis-report.md
    required: true
  - path: meta-analysis-run.json
    required: true
  - path: agenda-delta.json
    required: false
  checks:
  - requiredOutputsExist
  - citationsResolvable
inputs:
  required:
  - topic
  optional:
  - population
  - intervention
  - comparator
  - outcomes
  - studyDesign
  - analysisType
  - uploadedFiles
  - ipdData
autopilot:
  taskTypes:
  - evidence-update
  costClass: high
  unattendedInputs:
  - topic
estimatedMinutes:
- 30
- 180
dataSources:
- metaagent
- literature
- clinical-trials
- uploaded-files
starterPrompts:
- Conduct a systematic review and meta-analysis for a clearly defined PICO question.
- Resume an automated meta-analysis job and explain its release-gate status.

# What a researcher is shown, in Chinese: read by people, not by the
# orchestrator (the fields above). The generator derives the shell's and the
# frame's capability table from this block, and adds what evals/ measured.
display:
  title: "自动化 Meta 分析"
  category: "临床证据"
  description: "自动完成检索、筛选、统计合并、偏倚风险与 GRADE 分级，生成图表与论文初稿；统计全部由确定性程序计算。"
  starterPrompts:
  - "氨甲环酸在初次全膝关节置换中减少失血的系统评价与 Meta 分析。"
  - "围绕一个明确的 PICO 问题完成系统评价和 Meta 分析，并生成可追溯的完整研究包。"
  estimatedMinutes:
    min: 60
    max: 300
  outputs:
  - "Meta 分析报告与论文初稿（含森林图与 GRADE 证据概要）"
  - "可复现的分析记录"
  knownLimits:
  - "完整流程可能需要数小时；超过运行时限会中止，已写出的文件保留在工作区。"
  - "统计合并由程序完成，但纳入研究的数据提取仍需人工抽查。"
