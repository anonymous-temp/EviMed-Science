# Capability contract; conversation-native VCR reset, 2026-10-26.
# Module workflows are explicit specialists; ordinary conversation can load their skills and call shared tools.
id: vcr-matching
version: 1.8.3
title: Virtual Clinical Research — Patient Matching
category: Clinical Research
description: |
  Judge eligibility in either direction from original case records and the trial's own eligibility text: a whole-pair judgment for every pair, clause by clause for the best-ranked, with sentence evidence and a visible label for what the record does not say. No recruitment operations.
whenToUse: |
  Virtual Clinical Research (虚拟临床研究): Use for a requested eligibility assessment deliverable, protocol-to-patient matching or patient-to-trial matching. A single case can start from the original human message or attachment in global conversation. No study form, full protocol or PICO is required for patient-to-trial search.
persona: |
  Work in the current conversation and answer in Chinese unless requested otherwise. Complete only the requested scope. Use preserved evidence and exact tools for numbers. Explain task-specific data requirements and missingness. Never invent patient facts, treatment exposure, clinical validation or regulatory acceptance. Matching stops at assessment; recruitment operations are retired.
safetyClass: clinical
skills:
- vcr-matching
tools:
- mcp__evimed__dataset_semantics
- mcp__evimed__vcr_read
- mcp__evimed__vcr_write
- mcp__evimed__vcr_simulate
- mcp__evimed__clinical_trial_search
- mcp__evimed__trial_registry_record
- mcp__evimed__term_normalize
- mcp__evimed__kb_search
- mcp__evimed__kb_browse
- mcp__evimed__literature_search
produces:
- contractKind: vcr-matching-assessment
  outputs:
  - path: matching-assessment.md
    role: report
    required: false
  - path: revision-notes.md
    role: work
    required: false
  checks:
  - skillsLoaded
inputs:
  required:
  - studyId
  optional:
  - protocolVersionId
  - subjectKeys
  - direction
  - asOf
autopilot:
  # Scheduling belongs to the 「虚拟临床研究」 orchestrator, which dispatches this
  # capability inside the study. The autopilot allocator has no VCR task type.
  taskTypes: []
  costClass: medium
  unattendedInputs:
  - studyId
estimatedMinutes:
- 15
- 90
dataSources:
- clinical-trials
- uploaded-files
- literature
starterPrompts:
- 把这份方案的入排条件结构化，然后对知识库里的 20 份病历跑一遍预筛。

display:
  title: "患者匹配"
  category: "虚拟临床研究"
  description: 把病例或患者队列与试验条件逐条判断，保留病历依据，没写的条款标明怎么判的。
  listed: false
  starterPrompts:
  - "把这份方案的入排条件结构化，然后对知识库里的 20 份病历跑一遍预筛。"
  - "这位患者能不能入组 EV-201？逐条说明，缺什么证据也写出来。"
  - "哪一条入排条件最卡人？按历史候选人群跑一遍漏斗。"
  - "给 P-0192 找一个可以参加的试验，逐条说明缺什么证据。"
  materials: "单人匹配可用原始病例消息或附件；批量匹配需要授权患者数据，试验条件可上传或检索。"
  estimatedMinutes:
    min: 15
    max: 90
  outputs:
  - "逐条资格判定与证据位置"
  - "待补证据清单"
  - "入排条件漏斗；一位患者可参加的试验及排序"
  knownLimits:
  - "结论由模型逐条判断，证据句由平台核对；不设统一准确率门槛，也不引用外部产品的准确率。"
  - "病历没写的条款会标明「未见记载，按未排除」或「未见记载，需确认」：这是判断，不是病历的记载。"
