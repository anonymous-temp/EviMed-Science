# Capability manifest — the only definition of this capability.
#
# It replaced agent.yaml when routing was removed. Under a router, a
# package was bound to a session and never had to say when it applied;
# under one composition the orchestrator composes capabilities itself, so
# `whenToUse` (the catalogue line it reads), `persona` (what the delegated
# child is) and `produces` (which contract validates the result) are
# required. `tools` uses the model-visible names.
id: drug-selection
version: 2.1.1
title: Drug Selection Evaluation
category: Formulary Decision Support
description: Compare candidate medicines across pharmaceutical properties, effectiveness, safety, economics,
  and other formulary attributes.
whenToUse: 交付物是在若干候选药品之间做遴选比较、需要一张可解释的打分表时，委派给我。
persona: 你是药品遴选分析师。你在给定的遴选维度上逐一比较候选药品，每个分值都要能追到证据，并写明这次比较不覆盖什么。
safetyClass: clinical
skills:
- drug-selection
tools:
- mcp__evimed__drug_term_normalize
- mcp__evimed__drug_selection_evaluation
- mcp__evimed__data_source_catalog
- mcp__evimed__biomedical_source_search
- mcp__evimed__drug_label_search
- mcp__evimed__guideline_search
- mcp__evimed__clinical_trial_search
- mcp__evimed__literature_search
- mcp__evimed__kb_search
- mcp__evimed__pharmacy_reference_search
produces:
- contractKind: drug-selection-report
  outputs:
  - path: drug-selection-report.md
    required: true
  - path: selection-scorecard.csv
    required: true
  - path: decision-summary.json
    required: true
  - path: evidence-snapshot.json
    required: true
  checks:
  - requiredOutputsExist
  - citationsResolvable
  - citedSourcesRecorded
inputs:
  required:
  - candidateDrugs
  - indication
  optional:
  - population
  - jurisdiction
  - selectionCriteria
  - selectionDomains
  - scoringRubric
  - scoringPolicyVersion
  - economicContext
  - productSpecifications
  - careSetting
  - decisionDate
  - budgetContext
  - uploadedFiles
autopilot:
  taskTypes: []
  costClass: medium
  unattendedInputs:
  - candidateDrugs
  - indication
estimatedMinutes:
- 20
- 50
dataSources:
- drug-labels
- guidelines
- clinical-trials
- literature
- internal-evidence
- uploaded-files
starterPrompts:
- Compare candidate medicines for a hospital formulary decision in one indication.
- Build an evidence-backed scorecard for selecting among equivalent medicines.

# What a researcher is shown, in Chinese: read by people, not by the
# orchestrator (the fields above). The generator derives the shell's and the
# frame's capability table from this block, and adds what evals/ measured.
display:
  title: "药品遴选评价"
  category: "药学评价"
  description: "结合 EviMed 证据与用户提供的量表辅助药品遴选；缺项不计零，仅在数据可比时排名。"
  starterPrompts:
  - "在阿哌沙班、利伐沙班、达比加群之间为非瓣膜性房颤抗凝遴选一个品种。"
  - "比较候选药品，先提示我补齐量表和关键数据，再生成可追溯评分与敏感性分析。"
  estimatedMinutes:
    min: 20
    max: 50
  outputs:
  - "遴选评价报告"
  - "评分表与决策摘要"
  knownLimits:
  - "只在候选药品的数据可比时给出排名；数据不齐时只给分维度比较。"
