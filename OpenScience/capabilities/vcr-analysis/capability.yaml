# Capability contract; conversation-native VCR reset, 2026-10-26.
# Module workflows are explicit specialists; ordinary conversation can load their skills and call shared tools.
id: vcr-analysis
version: 1.4.0
title: Virtual Clinical Research Analysis
category: Study Design
description: |
  Execute the requested population, individual prediction, comparator or trial-design analysis through deterministic tools. Preserve source and model scope, counts, uncertainty and exact result versions; do not start unrelated steps.
whenToUse: |
  Virtual Clinical Research (虚拟临床研究): Use for an explicitly requested VCR analysis deliverable or named specialist. Ordinary aggregate questions may use research_calculate directly. Cohorts and individual patients share one research workspace; computations are tools, not forms.
persona: |
  Work in the current conversation and answer in Chinese unless requested otherwise. Complete only the requested scope. Use preserved evidence and exact tools for numbers. Explain task-specific data requirements and missingness. Never invent patient facts, treatment exposure, clinical validation or regulatory acceptance. Matching stops at assessment; recruitment operations are retired.
safetyClass: general
skills:
- vcr-analysis
- citation-integrity
tools:
- mcp__evimed__vcr_read
- mcp__evimed__vcr_write
- mcp__evimed__vcr_simulate
- mcp__evimed__evidence_pool
- mcp__evimed__trial_registry_record
- mcp__evimed__curve_digitize
- mcp__evimed__literature_search
- mcp__evimed__clinical_trial_search
- mcp__evimed__open_access_full_text
- mcp__evimed__locate_quote
- mcp__evimed__kb_search
- mcp__evimed__kb_browse
- mcp__evimed__term_normalize
- mcp__evimed__web_read
# Three contract kinds. A run is held to the entries of the products it was
# dispatched for (`AgentRegistry.get(id, { products })`; the 虚拟临床研究
# orchestrator names them from the steps a run covers, `VCR_STEP_PRODUCTS`): a
# retry for the patients alone owes the cohort entry's two files and nothing of
# the comparator or the simulation. A run that names none — a conversation bound
# to this capability — is held to every entry flattened into one `outputs` list,
# whose paths have to be disjoint. That is why the report is `analysis-report.md`
# rather than three step-specific names: one analysis delivery is one report and
# one machine-readable result, and the file a particular product adds is that
# product's own entry.
produces:
- contractKind: vcr-cohort-snapshot
  outputs:
  - path: analysis-report.md
    role: report
    required: true
  - path: results.json
    role: data
    required: true
  checks:
  - requiredOutputsExist
  - skillsLoaded
- contractKind: vcr-comparator-analysis
  outputs:
  # Required *of this kind*, which is the only place it is asked for: the run
  # policy resolves a deliverable's expected outputs from the produces entry
  # whose contractKind it declared, and the control plane's gate does the same
  # for a run dispatched for named products, so a comparator delivery owes its
  # comparability table and a cohort delivery does not. The report and the
  # results file belong to the cohort entry above and cannot be repeated here —
  # the flattened output list refuses a duplicate path (2026-09-28 merge).
  - path: comparability.md
    role: document
    required: true
  checks:
  - requiredOutputsExist
  - skillsLoaded
- contractKind: vcr-simulation-report
  outputs:
  - path: simulation.json
    role: data
    required: true
  checks:
  - requiredOutputsExist
  - skillsLoaded
inputs:
  required:
  - step
  optional:
  - populationDefinition
  - comparatorRoute
  - designs
  - endpointType
  - targetMcse
  - dataTier
autopilot:
  taskTypes: []
  costClass: high
  unattendedInputs:
  - step
estimatedMinutes:
- 15
- 120
dataSources:
- literature
- clinical-trials
starterPrompts:
- 三个方案并排比一比：单臂加文献对照、2:1 随机、1:1 随机加一次期中分析。

display:
  title: "人群、对照与试验仿真"
  category: "虚拟临床研究"
  description: "按数据档位构建人群与对照，配置试验方案并交给引擎仿真，每个数都带蒙特卡洛误差。"
  listed: false
  starterPrompts:
  - "PFS 预计 HR 0.70、对照中位 6 个月、两年入组，要多少例？"
  - "这个单臂试验能不能用外部对照？不能的话缺什么。"
  - "把我们上传的队列生成一份可以外发的合成数据。"
  materials: "有研究定义就能开始；有数据授权会多出真实队列与外部对照两条路"
  estimatedMinutes:
    min: 15
    max: 120
  outputs:
  - "人群版本、筛选流程与画像"
  - "对照路线的可比性诊断，或「不可估计」与缺口清单"
  - "方案 A/B/C 的运行特征表，每个数带蒙特卡洛标准误"
  knownLimits:
  - "计算引擎未接入时，需要它的那一步报「暂不可用」，其余步骤与对话照常。"
  - "超出研究计算预算的仿真会停在确认处，确认一次后继续。"
