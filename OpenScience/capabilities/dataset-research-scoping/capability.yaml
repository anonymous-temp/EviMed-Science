# Capability manifest — the only definition of this capability.
#
# It replaced agent.yaml when routing was removed. Under a router, a
# package was bound to a session and never had to say when it applied;
# under one composition the orchestrator composes capabilities itself, so
# `whenToUse` (the catalogue line it reads), `persona` (what the delegated
# child is) and `produces` (which contract validates the result) are
# required. `tools` uses the model-visible names.
id: dataset-research-scoping
version: 1.7.0
title: Dataset Research Scoping
category: Research Planning
description: Start from a dataset the researcher already holds, profile it mechanically, map it against
  the published literature, and decide which research questions it can and cannot support — naming the
  missing field for every question it cannot.
whenToUse: 研究者手上已经有数据、要从数据出发找选题时，委派给我——这与从文献出发的证据综述是两条不同的入口。
persona: 你是数据驱动选题分析师。你先把数据本身摸清楚（结构、质量、时间跨度、缺失），再谈能做什么研究。原始行不进入你的上下文，你只看结构、统计与样例。
safetyClass: general
skills:
- dataset-research-scoping
- autopilot-episode
- deep-research
- biomedical-database-search
- research-topic-selection
tools:
- mcp__evimed__literature_search
- mcp__evimed__biomedical_source_search
- mcp__evimed__open_access_full_text
- mcp__evimed__data_source_catalog
- mcp__evimed__web_search
- mcp__evimed__research_topic_selection
- mcp__evimed__bibliometric_analysis
- mcp__evimed__web_read
- mcp__evimed__guideline_search
- mcp__evimed__clinical_trial_search
- mcp__evimed__term_normalize
- mcp__evimed__evidence_deduplicate
- mcp__evimed__pharmacy_reference_search
produces:
- contractKind: dataset-scoping-package
  outputs:
  - path: data-profile.md
    required: true
  - path: data-profile.json
    required: true
  - path: data-profile.py
    required: true
  - path: data-quality.md
    required: true
  - path: evidence-map.md
    required: true
  - path: feasibility-matrix.md
    required: true
  - path: external-linkage.md
    required: true
  - path: research-portfolio.md
    required: true
  - path: study-protocol.md
    required: true
  - path: scoping-run.json
    required: true
  - path: agenda-delta.json
    required: false
  checks:
  - requiredOutputsExist
  - citationsResolvable
  - skillsLoaded
inputs:
  required:
  - datasetPath
  optional:
  - researchInterest
  - domain
  - populationOfInterest
  - outputLanguage
autopilot:
  taskTypes:
  - data-prospecting
  costClass: high
  unattendedInputs:
  - datasetPath
estimatedMinutes:
- 30
- 120
dataSources:
- uploaded-files
- literature
- guidelines
- clinical-trials
starterPrompts:
- Profile the uploaded hospital dataset and tell me which studies it can actually support.

# What a researcher is shown, in Chinese: read by people, not by the
# orchestrator (the fields above). The generator derives the shell's and the
# frame's capability table from this block, and adds what evals/ measured.
display:
  title: "数据集科研可行性勘查"
  category: "研究设计与数据"
  description: "从你手上的数据出发：先按字段逐列剖析，再对照文献版图，逐个课题判定能不能做；判定不可行的必须说清缺哪个字段。"
  starterPrompts:
  - "剖析我上传的住院数据，判断它到底能支撑哪些研究课题。"
  - "这是我们的治疗药物监测数据，看看能做哪些药代动力学研究。"
  materials: "需要先把数据文件上传到知识库"
  estimatedMinutes:
    min: 15
    max: 60
  outputs:
  - "数据剖析与质量报告"
  - "课题可行性矩阵与研究方案草案"
  knownLimits:
  - "只判断这份数据能支撑什么；外部数据的链接与申请只作提示。"
