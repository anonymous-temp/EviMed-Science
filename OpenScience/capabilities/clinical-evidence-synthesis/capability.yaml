# Capability manifest — the only definition of this capability.
#
# It replaced agent.yaml when routing was removed. Under a router, a
# package was bound to a session and never had to say when it applied;
# under one composition the orchestrator composes capabilities itself, so
# `whenToUse` (the catalogue line it reads), `persona` (what the delegated
# child is) and `produces` (which contract validates the result) are
# required. `tools` uses the model-visible names.
id: clinical-evidence-synthesis
version: 2.14.0
title: Clinical Evidence Synthesis
category: Clinical Evidence
description: Transform an open-domain clinical question into a publication-grade deep evidence analysis
  with reproducible searches, verified citations, claim-level traceability, and a separate safety-first
  practical answer.
whenToUse: 交付物是一份对某个临床问题的证据综述，需要逐条主张可追溯到可解析的文献时，委派给我。
persona: 你是临床证据分析师。你的产出是一份可被独立复核的证据包：每条主张都绑定到一条可解析的来源，综合性结论标注置信度与推翻条件，实践要点只用被测量到的证据。你不提供个体诊疗建议。
safetyClass: clinical
skills:
- clinical-evidence-synthesis
- autopilot-episode
- deep-research
- biomedical-database-search
- citation-integrity
- manuscript-humanize
tools:
- mcp__evimed__data_source_catalog
- mcp__evimed__literature_search
- mcp__evimed__reference_list
- mcp__evimed__web_read
- mcp__evimed__open_access_full_text
- mcp__evimed__locate_quote
- mcp__evimed__kb_search
- mcp__evimed__evidence_deduplicate
- mcp__evimed__biomedical_source_search
- mcp__evimed__guideline_search
- mcp__evimed__drug_label_search
- mcp__evimed__pharmacy_reference_search
produces:
- contractKind: clinical-evidence-report
  # The package is what a reader is handed and what verifies it: the report,
  # and the matrix binding each claim to a quotation in a preserved source.
  # Six more files — the search log, the run receipt, the question ledger, the
  # citation ledger, the citation audit and references.bib — described the
  # package to itself. On twelve live runs they took 63% of run time and were
  # 65% of what withheld the packages; they became optional on 2026-09-17 and
  # were deleted, with every check that read them, once the non-blocking
  # control batch (memory-ablation v10) had run. What was searched and preserved
  # is the platform's own record.
  outputs:
  - path: clinical-evidence-report.md
    required: true
  - path: clinical-evidence-matrix.json
    required: true
  - path: agenda-delta.json
    required: false
  checks:
  - requiredOutputsExist
  - citationsResolvable
  - evidenceClaimsTraceable
  - skillsLoaded
inputs:
  required:
  - question
  optional:
  - reviewType
  - population
  - intervention
  - comparator
  - outcomes
  - careSetting
  - jurisdiction
  - outputLanguage
autopilot:
  taskTypes:
  - evidence-update
  costClass: high
  unattendedInputs:
  - question
estimatedMinutes:
- 30
- 120
dataSources:
- literature
- guidelines
- drug-labels
starterPrompts:
- Analyze acute chest pressure, the differential diagnosis, and the appropriate role of Suxiao Jiuxin
  Wan.

# What a researcher is shown, in Chinese: read by people, not by the
# orchestrator (the fields above). The generator derives the shell's and the
# frame's capability table from this block, and adds what evals/ measured.
display:
  title: "临床证据深度分析"
  category: "临床证据"
  description: "把一个临床问题做成可复现的检索，逐条核对引文，写成证据报告。"
  starterPrompts:
  - "≥70 岁人群阿司匹林一级预防的获益与出血风险。"
  - "分析急性胸闷胸痛的鉴别诊断，以及速效救心丸在其中的合理定位。"
  - "SGLT2 抑制剂在 eGFR 低于 30 的患者中还有肾脏获益吗？"
  estimatedMinutes:
    min: 30
    max: 70
  outputs:
  - "证据综述报告"
  - "证据矩阵：每条主张对应一段保存的原文引文"
  knownLimits:
  - "只读取可公开获取的全文；付费墙后的文献只能用摘要。"
  - "报告里标 ⚠ 的结论没能在保存的原文中逐字核对到，引用前请核对。"
  - "不提供个体诊疗建议。"
