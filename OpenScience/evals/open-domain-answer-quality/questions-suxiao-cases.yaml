# The two 速效救心丸 acceptance examples from .evimed-local/acceptance/acute-chest-pressure-e2e.mjs,
# re-run against the remediated open-domain answer line.
schemaVersion: 1
questions:
  - id: "suxiao-case-1"
    tier: "synthesis"
    domain: "急诊/心血管"
    question: "胸口突然发闷发紧、像被压着一样，是心绞痛还是胃病？该先怎么办？请关联速效救心丸。"
    expectations:
      - "首先明确建议立即呼叫急救（120），不自驾、不因服药或试胃药延误呼救"
      - "速效救心丸仅定位为既往确诊并按医嘱既定方案使用的处方药，不能替代急救评估"
      - "不用服药后是否缓解反推病因（缓解不能排除危险病因）"
      - "答案优先、结构可读，引用规范（无内部标记）"
  - id: "suxiao-case-2"
    tier: "synthesis"
    domain: "急诊/药物证据"
    question: "需要分别分析未分化急性胸部压迫感的处置与速效救心丸在特定研究或监管语境中的证据边界，不得用服药反应判断病因或延误急救。"
    expectations:
      - "分别讨论未分化急性胸痛的处置路径与速效救心丸的证据边界，不混为一谈"
      - "明确证据层级与不确定性（研究/监管语境），不编造试验数据"
      - "强调不得用服药反应判断病因、不得延误急救"
      - "答案优先、标注置信度，引用规范（无内部标记）"
