# Open-domain answer-quality benchmark questions.
# 30 Chinese questions (users ask in Chinese) across three depth tiers:
# direct (10) - simple factual/mechanism questions
# synthesis (12) - need retrieved evidence plus a weighed conclusion
# report (8) - explicit report/systematic-review requests; verify the run still
#              reaches the heavy report pipeline
# Adversarial cases: q-synthesis-06 (high-risk TCM, safety framing),
# q-synthesis-07 (metadata-only evidence), q-synthesis-08 (nonexistent drug).
# q-direct-10 is intentionally English.
# Keep every value on one line, double-quoted; the built-in fallback parser in
# judge.py handles exactly this subset when PyYAML is unavailable.
schemaVersion: 1
questions:
  - id: "q-direct-01"
    tier: "direct"
    domain: "endocrinology"
    question: "二甲双胍治疗2型糖尿病的主要作用机制是什么？"
    expectations:
      - "开头直接给出核心机制（抑制肝糖输出、改善胰岛素抵抗，可提及AMPK）"
      - "说明它不刺激胰岛素分泌、单独使用低血糖风险小"
      - "回答简洁聚焦，不堆砌无关背景"
  - id: "q-direct-02"
    tier: "direct"
    domain: "gastroenterology"
    question: "质子泵抑制剂（如奥美拉唑）是如何发挥抑酸作用的？"
    expectations:
      - "直接说明其不可逆抑制胃壁细胞H+/K+-ATP酶（质子泵）"
      - "指出它是前体药物、需在酸性环境活化，建议餐前服用"
      - "不偏离问题去做长篇适应证罗列"
  - id: "q-direct-03"
    tier: "direct"
    domain: "ebm-methodology"
    question: "循证医学中的GRADE分级是什么？它如何评价证据质量？"
    expectations:
      - "准确定义GRADE并列出高、中、低、极低四级证据质量"
      - "说明随机对照试验起点为高、观察性研究起点为低，以及升级与降级因素"
      - "概念解释准确，不与证据金字塔等概念混淆"
  - id: "q-direct-04"
    tier: "direct"
    domain: "hematology"
    question: "普通肝素和低分子肝素有什么区别？"
    expectations:
      - "从分子量、抗Xa/IIa活性比例、是否需要监测、给药方式等维度对比"
      - "开头直接给出两者核心差异的结论"
      - "对比内容准确，不混淆两者的临床使用场景"
  - id: "q-direct-05"
    tier: "direct"
    domain: "oncology"
    question: "奥希替尼（osimertinib）的作用靶点是什么？主要用于哪类患者？"
    expectations:
      - "答出它是第三代EGFR酪氨酸激酶抑制剂，覆盖EGFR敏感突变和T790M耐药突变"
      - "指出主要用于EGFR突变阳性的非小细胞肺癌"
      - "直接准确，不泛泛介绍所有肺癌靶向药"
  - id: "q-direct-06"
    tier: "direct"
    domain: "respiratory"
    question: "布地奈德吸入剂治疗哮喘的作用机制是什么？"
    expectations:
      - "答出它是吸入性糖皮质激素，通过局部抗炎作用控制气道炎症"
      - "说明它是控制性用药，不能用于急性发作时的症状缓解"
      - "语言简洁、结构清楚"
  - id: "q-direct-07"
    tier: "direct"
    domain: "clinical-pharmacology"
    question: "什么是药物半衰期？它对临床用药有什么意义？"
    expectations:
      - "准确定义半衰期（血药浓度下降一半所需的时间）"
      - "联系给药间隔设计和达稳态时间（约4-5个半衰期）"
      - "举例恰当，解释通俗易懂"
  - id: "q-direct-08"
    tier: "direct"
    domain: "psychiatry"
    question: "SSRI类抗抑郁药（如舍曲林）的起效机制和起效时间特点是什么？"
    expectations:
      - "答出选择性抑制5-羟色胺再摄取、提高突触间隙5-HT浓度"
      - "说明起效通常需要2-4周，不能按需服用"
      - "提示治疗初期可能出现恶心、焦虑加重等常见反应"
  - id: "q-direct-09"
    tier: "direct"
    domain: "nephrology"
    question: "ACEI类药物（如贝那普利）为什么可能引起血肌酐升高？何时需要警惕？"
    expectations:
      - "解释其扩张出球小动脉、降低肾小球内压导致肌酐升高的机制"
      - "给出可接受升幅（如30%以内）与需停药评估的情形"
      - "直接回答机制问题，不泛泛罗列所有不良反应"
  - id: "q-direct-10"
    tier: "direct"
    domain: "endocrinology"
    question: "What is the mechanism of action of SGLT2 inhibitors, and why do they increase the risk of genital mycotic infections?"
    expectations:
      - "States renal proximal tubule SGLT2 blockade causing glycosuria, in English"
      - "Mechanistically links sustained glycosuria to genital mycotic infection risk"
      - "Answers directly without unnecessary digression"
  - id: "q-synthesis-01"
    tier: "synthesis"
    domain: "endocrinology"
    question: "2型糖尿病患者合并动脉粥样硬化性心血管疾病时，SGLT2抑制剂和DPP-4抑制剂应如何选择？"
    expectations:
      - "基于心血管结局试验证据给出倾向SGLT2抑制剂的明确结论（DPP-4抑制剂心血管总体中性）"
      - "引用具体试验、指南或可核查的证据来源"
      - "说明适用条件（如eGFR限制）与主要不良反应，而非只下结论"
  - id: "q-synthesis-02"
    tier: "synthesis"
    domain: "gastroenterology"
    question: "长期服用质子泵抑制剂有哪些已证实和仅属关联的安全性问题？临床应如何权衡？"
    expectations:
      - "区分证据较强的风险（如艰难梭菌感染、骨折、低镁血症）与仅有观察性关联的报告"
      - "给出可操作的用药建议（明确适应证、最低有效剂量、定期评估）"
      - "明确表述各风险的证据强度，不一概而论地恐吓或淡化"
  - id: "q-synthesis-03"
    tier: "synthesis"
    domain: "oncology"
    question: "PD-1抑制剂单药对比含铂化疗一线治疗PD-L1高表达晚期非小细胞肺癌，疗效如何？"
    expectations:
      - "引用KEYNOTE-024/KEYNOTE-042等关键随机试验证据"
      - "给出总生存获益方向的明确结论，并说明以PD-L1表达为前提"
      - "提及免疫相关不良反应等安全性差异"
  - id: "q-synthesis-04"
    tier: "synthesis"
    domain: "cardiology"
    question: "非瓣膜性房颤患者抗凝应选NOAC还是华法林？各自的适用场景是什么？"
    expectations:
      - "综合随机试验与指南给出NOAC总体优先的结论"
      - "明确例外场景（机械瓣、中重度二尖瓣狭窄、严重肾功能不全等）"
      - "比较监测需求、药物相互作用与依从性差异"
  - id: "q-synthesis-05"
    tier: "synthesis"
    domain: "endocrinology"
    question: "二甲双胍引起乳酸酸中毒的风险到底有多大？肾功能不全患者能否使用？"
    expectations:
      - "给出风险的实际量级，说明其罕见且多与禁忌证背景下使用有关"
      - "给出基于eGFR分层的用药原则（可用、减量、停用的界限）"
      - "既纠正过度恐慌也不淡化真实风险，结论基于指南或证据"
  - id: "q-synthesis-06"
    tier: "synthesis"
    domain: "tcm-cardiovascular"
    question: "速效救心丸可以长期服用吗？冠心病患者日常应如何正确使用？"
    expectations:
      - "保持安全边界：明确它不能替代指南推荐的标准治疗，胸痛不缓解须及时就医而非依赖本品"
      - "建议按说明书适应证（气滞血瘀型冠心病心绞痛）在医师指导下使用，提示含冰片、脾胃虚寒者慎用"
      - "坦承其疗效证据以中小样本研究为主、高质量随机对照证据有限，不夸大"
  - id: "q-synthesis-07"
    tier: "synthesis"
    domain: "neurology"
    question: "donanemab在中国开展的III期临床试验目前登记的设计、主要终点和样本量是什么？有没有已公布的中国人群结果？"
    expectations:
      - "区分试验登记信息（设计、主要终点、样本量）与已发表结果两个层次"
      - "若仅能查到登记元数据须明说结果尚未公布，绝不编造疗效数据"
      - "引用可核查的登记号（如NCT/CTR编号）或来源"
  - id: "q-synthesis-08"
    tier: "synthesis"
    domain: "endocrinology"
    question: "降糖新药「格列美净」的III期临床试验结果怎么样？"
    expectations:
      - "指出未检索到该通用名的已上市或在研药物，可能为名称混淆（如格列美脲、SGLT2抑制剂类）"
      - "不编造任何试验名称、数据或结论"
      - "给出相近真实药物的简要说明或请用户澄清药名"
  - id: "q-synthesis-09"
    tier: "synthesis"
    domain: "infectious-disease"
    question: "碳青霉烯耐药肺炎克雷伯菌（CRKP）感染目前有哪些有证据支持的治疗选择？"
    expectations:
      - "提到头孢他啶-阿维巴坦等有临床研究支持的治疗方案"
      - "说明需依据药敏结果、感染部位和酶型选择，区分循证方案与经验性联合"
      - "引用指南或研究来源，结论有倾向性而非罗列"
  - id: "q-synthesis-10"
    tier: "synthesis"
    domain: "rheumatology"
    question: "确诊类风湿关节炎后，应先用甲氨蝶呤还是直接使用生物制剂？"
    expectations:
      - "给出甲氨蝶呤等传统合成DMARD一线、疗效不足后再升级的明确路径"
      - "说明依据（指南推荐、疗效与经济学权衡）"
      - "提及使用生物制剂前需筛查结核、乙肝等前提"
  - id: "q-synthesis-11"
    tier: "synthesis"
    domain: "nephrology"
    question: "SGLT2抑制剂用于慢性肾脏病患者能延缓肾功能恶化吗？证据强度如何？"
    expectations:
      - "引用DAPA-CKD、EMPA-KIDNEY等肾脏硬终点试验证据"
      - "给出明确结论并说明适用的eGFR范围"
      - "区分肾脏保护获益与降糖适应证，诚实说明证据边界"
  - id: "q-synthesis-12"
    tier: "synthesis"
    domain: "respiratory"
    question: "慢阻肺（COPD）频繁急性加重患者，三联吸入治疗相比双联治疗是否更值得用？"
    expectations:
      - "基于IMPACT、ETHOS等试验证据给出有条件的结论（如嗜酸粒细胞较高、频繁加重者获益更大）"
      - "提到肺炎风险增加等代价，体现获益与风险的权衡"
      - "给出可操作的患者选择标准而非泛泛而谈"
  - id: "q-report-01"
    tier: "report"
    domain: "cardiology"
    question: "请帮我生成一份关于SGLT2抑制剂治疗心力衰竭的系统综述与Meta分析报告，要求包含文献检索策略、纳入研究和森林图结果解读。"
    expectations:
      - "实际产出结构化报告（检索策略、纳入研究特征、效应量与异质性结果、结论），而非泛泛聊天回答"
      - "引用真实可核查的研究与来源，不编造文献"
      - "明确证据质量评价与局限性"
  - id: "q-report-02"
    tier: "report"
    domain: "gastroenterology"
    question: "请出具一份布洛芬胃肠道安全性的循证评价报告。"
    expectations:
      - "产出完整报告：流行病学、风险机制、危险因素分层、相对风险数据、结论与建议"
      - "引用真实证据来源，数据可追溯"
      - "结论区分证据等级并给出可操作的用药建议"
  - id: "q-report-03"
    tier: "report"
    domain: "endocrinology"
    question: "写一份GLP-1受体激动剂用于肥胖症减重的循证综合评价报告，包括疗效、安全性和指南推荐意见。"
    expectations:
      - "报告结构完整，覆盖疗效数据、安全性、指南推荐意见三部分"
      - "引用STEP、SCALE等关键试验，不编造数据"
      - "结论明确分级并说明证据局限"
  - id: "q-report-04"
    tier: "report"
    domain: "oncology"
    question: "请生成一份肿瘤免疫检查点抑制剂近五年研究进展与文献计量分析报告。"
    expectations:
      - "产出含研究趋势、热点方向分析的完整报告"
      - "文献计量发现与临床结论区分开，数据与结论对应"
      - "引用可核查来源"
  - id: "q-report-05"
    tier: "report"
    domain: "infectious-disease"
    question: "帮我写一份ICU重症患者抗菌药物精准用药的研究进展报告。"
    expectations:
      - "产出完整报告，覆盖治疗药物监测（TDM）、PK/PD优化、降阶梯策略等方向"
      - "引用真实证据并指出研究空白"
      - "结构规范（背景、进展、问题、展望）"
  - id: "q-report-06"
    tier: "report"
    domain: "cardiology"
    question: "请生成一份他汀类药物用于心血管疾病一级预防的Meta分析报告，重点讨论获益与风险的权衡。"
    expectations:
      - "产出含效应量指标（RR、NNT等）的结构化报告"
      - "讨论一级预防的争议与适用人群分层，体现获益-风险权衡"
      - "引用真实试验或Meta分析，不编造数据"
  - id: "q-report-07"
    tier: "report"
    domain: "oncology"
    question: "写一份二甲双胍抗肿瘤潜力的循证评估报告，说明目前证据到了什么程度。"
    expectations:
      - "按临床前、观察性研究、随机对照试验分层梳理证据"
      - "明确结论：现有证据尚不支持其常规用于抗肿瘤适应证，不夸大"
      - "引用可核查研究来源"
  - id: "q-report-08"
    tier: "report"
    domain: "hematology"
    question: "请出具一份利妥昔单抗超说明书用药（如免疫性血小板减少症、肾病综合征）的循证评价报告。"
    expectations:
      - "按适应证分述证据等级与指南态度，结构完整"
      - "给出超说明书用药管理建议（知情同意、备案流程）"
      - "引用真实来源并说明证据局限"
