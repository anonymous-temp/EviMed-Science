# @evimed/dsh-socket — the host-facing rows.
#
# Hidden knowledge: which rows can live in the bundle and which cannot. A row
# here ships inside the npm package and must therefore be identical in every
# deployment — so it may carry no path and no address. Everything that differs
# between the hosted container and a laptop (the MCP command, the preset root,
# the gateway URLs, the token variable, the skill directories) is generated by
# the deployment into the *profile* patch instead. That split is what lets one
# bundle plug into two very different power strips without a line changing.
#
# A patch has exactly two operations: `insert`, and field override by `id`.
# There is no `remove` — deletion is `disabled: true` — and an id that matches
# nothing only warns on stderr, which is why the startup probe re-checks every
# row we override rather than trusting the patch to have applied.

- insert:
    # Startup self-check. Gate-level seams missing, an overridden row that did
    # not take, or a sandbox that cannot enforce all crash the process here,
    # before a run can be accepted and quietly under-protected.
    - id: evimed-seam-probe
      name: '@evimed/dsh-socket/plugins/seam-probe'
    # The run mirror: the durable domain `evimed_run@1` plus its projection to
    # `.evimed-run/state.json`, which is the only run state the control plane
    # and the browser read. They never read DSH's own storage format, which
    # carries no compatibility promise.
    - id: evimed-evidence-store
      name: '@evimed/dsh-socket/plugins/evidence-store'

# Source hot-reload watches the working directory. In the hosted container the
# working directory is the user's workspace, so a run writing a file would
# reload plugins mid-turn; on a laptop there is no source to reload. Neither
# deployment wants it.
- id: hmr
  disabled: true

# DSH telemetry has no redaction rules and `FULL` mode ships message bodies,
# tool arguments and workspace paths off the box. Nothing that may see patient
# data can leave this on, and the environment variable alone is one deployment
# mistake away from being unset.
- id: session-telemetry-otel
  disabled: true

# Everything below arrived as a NEW DEFAULT in DSH 0.1.2 and had to be turned
# back off. They were not found by reading a changelog: the image's
# `--dump-config` baseline diff prints every resolved row and refuses the build
# when one moves, and these are what it printed.

# 0.1.2 moved this plugin's default mode from `DISABLED` to `FEEDBACK_ONLY`.
# The row above already disables the whole plugin, so the move could not reach
# us — but only because we disable the plugin rather than set its mode. Setting
# `mode: DISABLED` would have looked equivalent and would have quietly started
# shipping feedback telemetry the day the default moved. The test that pins
# this asserts the row is disabled, not that a mode is chosen.

# Direct HTTP fetching from inside the sandbox: a provider plugin that is new
# in 0.1.2 and registered by default. Every source this platform retrieves goes
# through the control plane's own gateway, which resolves DOIs, refuses private
# and link-local addresses before it fetches, and records what it fetched. A
# second, unrecorded egress path defeats all three at once, and it defeats them
# silently — a run that fetched directly looks exactly like one that did not.
#
# The primary defence is that `tool-web` is not in this composition at all (see
# the preset's "deliberately absent" list, which names web_fetch as an SSRF
# surface), so the model has no fetch tool to reach this provider with. This row
# is the second one, for the same reason telemetry is off in three places: a
# composition is one edit away from gaining a tool, and a provider sitting ready
# for it is not a state worth being one edit from.
#
# `web.fetchProvider` is deliberately left alone. It is a free-form string
# naming a registered provider, so writing `none` there would not be a
# configured refusal — it would be a name that happens to match nothing, which
# reads as a typo to the next person and stops protecting anything the day
# someone registers a provider by that name.
- id: web-fetch-http
  disabled: true

# The third condition, and it is third because upstream moved. 0.1.2-alpha.4
# turned `fetch` on by default "for the Python SDK, Headless, ACP and custom
# Profiles" — we are a custom profile — so the value this composition had been
# inheriting flipped underneath it while every file here stayed the same. The
# image's own dump-config comparison caught it, which is the only reason it is
# not still true and unnoticed.
#
# Pinned rather than accepted: an inherited default that changed once can change
# again, and the two defences above (the tool is absent, the provider is
# disabled) are exactly the ones a single edit can undo.
- id: tool-web
  config:
    fetch: false
    searchTimeoutMs: 60000

# Reports the deployment's enabled plugin list to the model provider on every
# request, new in 0.1.2. The plugin list is this platform's composition — which
# capability packages exist, which gates are mounted — and it is not the
# provider's business. It is also exactly the kind of thing that is impossible
# to un-send.
- id: plugin-package-inventory-deepseek
  disabled: true
