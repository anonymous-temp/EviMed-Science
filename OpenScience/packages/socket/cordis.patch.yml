# @evimed/dsh-socket — the host-facing rows.
#
# Hidden knowledge: which rows can live in the bundle and which cannot. A row
# here ships inside the npm package and must therefore be identical in every
# deployment — so it may carry no path and no address. Everything that differs
# between the hosted container and a laptop (the MCP command, the preset root,
# the gateway URLs, the token variable, the skill directories) is generated by
# the deployment into the *profile* patch instead. That split is what lets one
# bundle plug into two very different power strips without a line changing.
#
# A patch has exactly two operations: `insert`, and field override by `id`.
# There is no `remove` — deletion is `disabled: true` — and an id that matches
# nothing only warns on stderr, which is why the startup probe re-checks every
# row we override rather than trusting the patch to have applied.

- insert:
    # The native module registry discovers client metadata only from package roots.
    - id: evimed-runtime-ui
      name: '@evimed/dsh-socket'
    # Startup self-check. Gate-level seams missing, an overridden row that did
    # not take, or a sandbox that cannot enforce all crash the process here,
    # before a run can be accepted and quietly under-protected.
    - id: evimed-plugin-probe
      name: '@evimed/dsh-socket/plugins/plugin-probe'
    - id: evimed-seam-probe
      name: '@evimed/dsh-socket/plugins/seam-probe'
    # The run mirror: the durable domain `evimed_run@1` plus its projection to
    # `.evimed-run/state.json`, which is the only run state the control plane
    # and the browser read. They never read DSH's own storage format, which
    # carries no compatibility promise.
    - id: evimed-evidence-store
      name: '@evimed/dsh-socket/plugins/evidence-store'
    # The platform's provider for the kernel's `web` registry. The addresses are
    # read from container environment rather than written here, which is the
    # deployment-independent form the header asks for: the bundle names the
    # variable, the deployment sets it, and a laptop with neither gets a row
    # that registers nothing and boots.
    - id: evimed-web
      name: '@evimed/dsh-socket/plugins/web'
      config:
        searchUrl: !!js process.env.EVIMED_WEB_SEARCH_GATEWAY_URL
        fetchUrl: !!js process.env.EVIMED_PUBLIC_SOURCE_GATEWAY_URL
        tokenFile: !!js process.env.EVIMED_MODEL_GATEWAY_TOKEN_FILE

# Source hot-reload watches the working directory. In the hosted container the
# working directory is the user's workspace, so a run writing a file would
# reload plugins mid-turn; on a laptop there is no source to reload. Neither
# deployment wants it.
- id: hmr
  disabled: true

# The preset every session gets when it does not name one. Since 0.1.7 a
# preset is a row of the composition (`presets/evimed-universal.patch.yml`,
# listed after this file in package.json `dsh.bundle.patch`), and the registry
# that chooses among them is the `agent-preset-registry` row the web bundle
# inserts with `default: standard`. The control plane names the preset on every
# `session/create` as well; this is what holds for a session it did not create.
- id: agent-preset-registry
  config:
    default: evimed-universal

# Installing, removing and switching bundles at run time. New in 0.1.7 and
# enabled in every profile launch (its row reads `profileContext`, which a
# profile boot always provides). An EviMed runtime is a profile pre-initialized
# at build time and never written at run time; a plugin reaches it through the
# image build and the `dsh-cite` path, never through a running kernel, and this
# is exactly the hot-injection the routing-suite ruling refused.
- id: plugin-manager
  disabled: true

- id: ui-plugin-manager
  disabled: true

# A browser-driven PTY in the kernel's process, new in 0.1.7: a shell the page
# types into, outside the agent's sandbox, as the runtime's own user — which
# can read `$DSH_HOME/.credentials.yaml`. The agent's shell is the sandboxed
# `bash` tool; nothing else in a runtime runs a command.
- id: terminal-controller
  disabled: true

- id: ui-sidebar-terminal
  disabled: true

# Signing the kernel into a DeepSeek account, new in 0.1.7: an OAuth flow
# (`/oauth/callback`, `account/*`) that stores a DeepSeek credential in the
# runtime and a second model route (`deepseek-account`) that uses it. The
# runtime never holds a provider credential; every model call goes through the
# control plane's gateway on a short-lived workload token.
- id: deepseek-account
  disabled: true

- id: llm-deepseek-account
  disabled: true

- id: account-controller
  disabled: true

- id: ui-settings-account
  disabled: true

# Opening native host applications is not a capability of a hosted project.
- id: open-in-app
  disabled: true

# The hosted browser must not offer native host-application launch controls.
- id: ui-open-in-app
  disabled: true

# DSH telemetry has no redaction rules and `FULL` mode ships message bodies,
# tool arguments and workspace paths off the box. Nothing that may see patient
# data can leave this on, and the environment variable alone is one deployment
# mistake away from being unset.
- id: session-telemetry-otel
  disabled: true

# Everything below arrived as a NEW DEFAULT in DSH 0.1.2 and had to be turned
# back off. They were not found by reading a changelog: the image's
# `--dump-config` baseline diff prints every resolved row and refuses the build
# when one moves, and these are what it printed.

# 0.1.2 moved this plugin's default mode from `DISABLED` to `FEEDBACK_ONLY`.
# The row above already disables the whole plugin, so the move could not reach
# us — but only because we disable the plugin rather than set its mode. Setting
# `mode: DISABLED` would have looked equivalent and would have quietly started
# shipping feedback telemetry the day the default moved. The test that pins
# this asserts the row is disabled, not that a mode is chosen.

# Direct HTTP fetching from inside the sandbox: a provider plugin that is new
# in 0.1.2 and registered by default. Every source this platform retrieves goes
# through the control plane's own gateway, which resolves DOIs, refuses private
# and link-local addresses before it fetches, and records what it fetched. A
# second, unrecorded egress path defeats all three at once, and it defeats them
# silently — a run that fetched directly looks exactly like one that did not.
#
# The primary defence is that `tool-web` is not in this composition at all (see
# the preset's "deliberately absent" list, which names web_fetch as an SSRF
# surface), so the model has no fetch tool to reach this provider with. This row
# is the second one, for the same reason telemetry is off in three places: a
# composition is one edit away from gaining a tool, and a provider sitting ready
# for it is not a state worth being one edit from.
#
# `web.fetchProvider` is no longer left alone, and the reason it was is worth
# keeping: writing `none` there would not have been a configured refusal, it
# would have been a name matching nothing, which reads as a typo and stops
# protecting anything the day someone registers a provider by that name. What
# changed is that there is now a provider worth naming. `evimed-gateway` is
# registered by the `evimed-web` row above and goes to the control plane, so
# both fields name a real destination and that destination is the gateway.
#
# The `web-fetch-http` row stays disabled underneath it. Two conditions, for the
# same reason telemetry is off in three places.
- id: web-fetch-http
  disabled: true

# Both halves of the kernel's web registry name the platform's own provider, so
# every retrieval that reaches `ctx.web` goes through the control-plane gateway
# that resolves the destination, refuses private addresses before it fetches,
# and records what it fetched. Registered by the `evimed-web` row above.
- id: web
  config:
    searchProvider: evimed-gateway
    fetchProvider: evimed-gateway

# The third condition, and it is third because upstream moved. 0.1.2-alpha.4
# turned `fetch` on by default "for the Python SDK, Headless, ACP and custom
# Profiles" — we are a custom profile — so the value this composition had been
# inheriting flipped underneath it while every file here stayed the same. The
# image's own dump-config comparison caught it, which is the only reason it is
# not still true and unnoticed.
#
# Pinned rather than accepted: an inherited default that changed once can change
# again, and the two defences above (the tool is absent, the provider is
# disabled) are exactly the ones a single edit can undo.
- id: tool-web
  config:
    fetch: false
    searchTimeoutMs: 60000

# Uploads the session log itself — every message, tool call and tool result,
# incrementally — as a `dsh_session_log` field on every model request. Its
# default moved from `enabled: false` (0.1.5) to `enabled: true` (0.1.7), so
# this composition would have started sending whole research sessions, patient
# material included, to the model provider without a line of ours changing.
# Disabled as a row, like telemetry, so a later default cannot flip it back on;
# the model gateway refuses the field as well.
- id: session-log-deepseek
  disabled: true

# Reports the deployment's enabled plugin list to the model provider on every
# request, new in 0.1.2. The plugin list is this platform's composition — which
# capability packages exist, which gates are mounted — and it is not the
# provider's business. It is also exactly the kind of thing that is impossible
# to un-send.
- id: plugin-package-inventory-deepseek
  disabled: true
