# evimed-universal — the only agent composition in the system.
#
# Hidden knowledge: what the model can see. A preset, not a profile, decides the
# model-visible surface, so "strip the coding tools out of DSH" is not work —
# it is the absence of a row. Nothing below is a product line and nothing below
# is a mode: every session mounts this exact composition, and which capabilities
# a run uses is decided by the model at plan time, because a session's preset
# cannot be changed once it has produced content.
#
# Every row carries an explicit `id`. A row without one is read as a delete plus
# an insert on every config read, which remounts it and loses its state.

# Deployment values reach these rows through the environment, not through the
# profile patch. A profile's `cordis.patch.yml` patches the host composition;
# these rows are mounted in agent scope from this file, so a patch that names
# them is reported as an unmatched target on stderr and dropped — the plugins
# would then run on their schema defaults while the deployment believed it had
# configured them. `!!js` is how a row reads what the container was given.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是 EviMed 的医学研究助手，基于 {{model}} 模型，工作目录 {{cwd}}。你具备广泛的医学知识。
      简单问题直接回答；需要交付物的任务，先用 evimed_plan 写下计划（含澄清或假设），把专业工作用 evimed_delegate
      委派给能力目录中的能力，综合后用 evimed_complete_run 交付。检索顺序：先查记忆与胶囊，再查文献，最后查网页。
      所有事实性主张尽量附文献依据；不编造文献；不提供具体诊疗建议。

# One realm for the four rows that share state.
#
# Three of them publish services — `evimedCapabilities`, `evimedCapsuleMethods`,
# `evimedEvidence` — and a preset row may not publish into the process-global
# scope: the kernel refuses to mount the preset, saying a preset service must
# sit behind an `isolate` realm or move to the host composition. It is right to
# refuse. One container serves one project but not one session, and a
# process-global evidence service would be shared by every session in it, so
# two runs would write one ledger.
#
# `evimed-run-policy` is inside the realm because it is the only consumer: it
# reads the capability manifest and the capsule methods when it validates a
# delegation. Everything else these rows use — `tools`, `agents`, `sessions`,
# `subagents`, `systemPrompt` — is not named here and so still resolves from
# the parent, which is what `isolate` means.
- id: evimed-core
  name: cordis:group
  group: true
  isolate:
    evimedCapabilities: true
    evimedCapsuleMethods: true
    evimedEvidence: true
  config:
    # Orchestration guidance: the capability catalogue, the contract-kind summary,
    # the retrieval order and the citation-hygiene rules. Order 100–199 is DSH's
    # tool-guidance band.
    - id: evimed-guidance
      config:
        capabilitiesDir: !!js process.env.EVIMED_CAPABILITIES_DIR
        askUserEnabled: !!js process.env.EVIMED_ASK_USER === '1'
        capsuleActive: !!js process.env.EVIMED_CAPSULE_ACTIVE === '1'
        reviewEnabled: !!js process.env.EVIMED_REVIEW_ENABLED === '1'
      name: '@evimed/dsh-socket/plugins/guidance'

    # "When is a run finished, and when is it acceptable" — the plan, the
    # delegation, the delivery gate, the completion check, the path guard, the
    # attempt ceiling and the run budget, all in one plugin because they are one
    # piece of knowledge.
    - id: evimed-run-policy
      config:
        deliveryAttemptLimit: !!js Number(process.env.EVIMED_DELIVERY_ATTEMPT_LIMIT ?? 3)
        maxParallelChildren: !!js Number(process.env.EVIMED_MAX_PARALLEL_CHILDREN ?? 30)
        maxSteps: !!js Number(process.env.EVIMED_MAX_STEPS ?? 200)
        maxTokens: !!js Number(process.env.EVIMED_MAX_TOKENS ?? 400000)
        capabilitiesDir: !!js process.env.EVIMED_CAPABILITIES_DIR
        skillsDir: !!js process.env.EVIMED_CAPABILITY_SKILLS_DIR
        bundleVersion: !!js process.env.EVIMED_BUNDLE_VERSION
      name: '@evimed/dsh-socket/plugins/run-policy'

    # Evidence ingestion. An observer on the tool pipeline: it can never change what
    # the model sees, which is the point — the ledger may not edit the run it records.
    - id: evimed-evidence
      config:
        evidenceStaleMinutes: !!js Number(process.env.EVIMED_EVIDENCE_STALE_MINUTES ?? 10)
      name: '@evimed/dsh-socket/plugins/evidence'

    # The capsule's runtime face: recall, note, and the user's own distilled methods
    # registered as skills from a deployment-owned read-only directory.
    - id: evimed-capsule
      config:
        methodsDir: !!js process.env.EVIMED_CAPSULE_METHODS_DIR
        recallUrl: !!js process.env.EVIMED_CAPSULE_GATEWAY_URL
        tokenFile: !!js process.env.EVIMED_WORKLOAD_TOKEN_FILE
      name: '@evimed/dsh-socket/plugins/capsule'

# Batch screening as one tool call: the model asks for a screening, the code
# decides the batch size, the concurrency, the tool restriction and the ledger.
- id: evimed-screening
  config:
    batchSize: !!js Number(process.env.EVIMED_SCREENING_BATCH_SIZE ?? 50)
    maxParallelChildren: !!js Number(process.env.EVIMED_MAX_PARALLEL_CHILDREN ?? 30)
  name: '@evimed/dsh-socket/plugins/screening'

# Cross-deliverable semantic review. Produces notices, never a verdict: on 29
# real deliveries the semantic judge produced 129 findings of which 3 landed on
# a human annotation, and five runs at temperature 0 disagreed with each other.
- id: evimed-review
  name: '@evimed/dsh-socket/plugins/review'
  disabled: !!js process.env.EVIMED_REVIEW_ENABLED !== '1'

# --- framework tools the model needs to do the work -------------------------
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    # Required with no default — the plugin refuses to mount without it, and
    # because this row is in the *agent* scope that refusal arrives when a
    # session is created, not when the host composition boots. `false` is what
    # the kernel's own presets set: an over-cap glob keeps the
    # modification-time-ordered head rather than sampling across the tree,
    # which for a run's workspace means the files it just wrote come first.
    sampleOverCapGlobResults: false
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# Skills ship with the preset and are found by relative path. Default root
# discovery is off: it would treat `.dsh/skills` in the *workspace* as a skill
# root, and the workspace is where users upload files — an uploaded SKILL.md
# would become an instruction.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false
    # Absolute, and not by accident. The loader resolves each root with
    # `path.resolve`, so a relative one lands under `process.cwd()` — which in a
    # runtime container is `/workspace`. These four were written `./skills/...`
    # and therefore pointed into the user's upload directory: none of the
    # shipped skills were found, and an uploaded `skills/core/x/SKILL.md` would
    # have been read as an instruction — the very thing the note above says
    # default root discovery is disabled to prevent.
    customSkillDirs:
      - !!js process.env.EVIMED_PRESET_SKILLS_DIR + '/core'
      # Our own agent packages that are not delegated capabilities --
      # today just `open-domain-answer`. Ahead of the ecosystem roots for
      # the same reason `core` is: the first root wins a name collision.
      - !!js process.env.EVIMED_PRESET_SKILLS_DIR + '/evimed'
      - !!js process.env.EVIMED_PRESET_SKILLS_DIR + '/curated-scientific'
      - !!js process.env.EVIMED_PRESET_SKILLS_DIR + '/office'
      # Community skills, vendored at pinned commits and last in the order: the
      # first root wins a name collision, so nothing taken from the ecosystem
      # can displace a skill we wrote. What is in here is recorded in
      # runtime/skills/community/sources.json, one entry per skill.
      - !!js process.env.EVIMED_PRESET_SKILLS_DIR + '/community'
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# Asking the user is a hosted-deployment decision, so the row is present and the
# profile patch decides. Hosted runs default to writing the assumption into the
# plan's clarifications instead.
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'
  disabled: !!js process.env.EVIMED_ASK_USER !== '1'

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable
    # `send_message`, `interrupt_agent`, `list_agents`. Since 0.1.2-alpha.4 this
    # row is also what a child uses to reach its parent: the one-way `report`
    # tool was removed upstream and @deepseek-ai/dsh-tool-subagent-report has no
    # build after alpha.3, so the row that mounted it is gone rather than
    # replaced.
    #
    # What that costs and what it does not. The old row carried
    # `reportDelivery: quiet` because delivery had to be a deployment policy —
    # a model able to pick `next-step` can interrupt its own synthesis at will.
    # The new tool takes no configuration at all, so that property now holds by
    # construction rather than by our setting it. What changed underneath is
    # the shape: `send_message` returns acceptance and never a reply, and a
    # message to a live parent arrives at its nearest step boundary through
    # Steer (an idle parent starts a turn). So there are no quiet reports any
    # more, because there are no reports — there are addressed messages, and a
    # child can now wake its parent. That was already true of settlement
    # notifications; it is newly true of anything a child chooses to say.
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'
    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn
    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

# Deliberately absent, each for a reason:
#   tool-todo            a second planning surface; the plan is task-plan.json alone
#   agent-instructions   it injects AGENTS.md from the workspace and from every
#                        directory the run touches — an uploaded file would
#                        become an instruction
#   str_replace_editor   tool-fs covers editing
#   tool-web             web_fetch is an SSRF surface and web_search needs the
#                        real DeepSeek key in the container; retrieval goes
#                        through MCP so the runtime never names a host
#   plan-mode            planning is a tool call, not a mode
#   tool-ralph           it waits in the foreground and evaluates nothing
#   tool-lsp, code-runtime   this is not a coding agent
#   tool-goal            state, not scheduling; cross-day scheduling is the
#                        control plane's job
