# evimed-universal — the only agent composition in the system.
#
# Hidden knowledge: what the model can see. A preset, not a profile, decides the
# model-visible surface, and this one is a general work assistant's: the
# kernel's own shell, files, search, jobs, skills, step list, sub-agents and
# file hand-over, with the research server and our policies beside them.
# Nothing below is a product line and nothing below is a mode: every session
# mounts this exact composition, and whether a task is an e-mail, a script or
# an evidence review is decided by the model as it works, because a session's
# preset cannot be changed once it has produced content.
#
# Every row carries an explicit `id`. A row without one is read as a delete plus
# an insert on every config read, which remounts it and loses its state.

# Deployment values reach these rows through the environment, not through the
# profile patch. A profile's `cordis.patch.yml` patches the host composition;
# these rows are mounted in agent scope from this file, so a patch that names
# them is reported as an unmatched target on stderr and dropped — the plugins
# would then run on their schema defaults while the deployment believed it had
# configured them. `!!js` is how a row reads what the container was given.
#
# Every row of ours has an off switch read the same way, because native DSH +
# DeepSeek is the control a plugin is measured against (principle 11): with all
# of them off a session still boots and answers. Six are `enabled:` configs,
# default on, and `0` makes the plugin return before it registers anything —
# EVIMED_GUIDANCE_ENABLED, EVIMED_RUN_POLICY_ENABLED, EVIMED_EVIDENCE_ENABLED,
# EVIMED_CAPSULE_ENABLED, EVIMED_SCREENING_ENABLED, EVIMED_COMPACTION_ENABLED
# (the control plane sets them from OPEN_SCIENCE_RUNTIME_DISABLED_SOCKET_PLUGINS).
# Review follows the control plane's review module (EVIMED_REVIEW_ENABLED) and
# the citation tools follow the project's plugin settings (EVIMED_CITE_ENABLED).

# The persona names no tool. It is a row of the kernel's own, mounted whatever
# our switches say, so a tool it named would be named to a session whose row
# for it is off — a model told to call what will be refused. The tools are
# named where their row is: in the guidance (which knows the switches) and in
# each tool's own description.
#
# Roles and principles only, and a general assistant's (2026-10-12). It used
# to read 「你是 EviMed 的医学研究助手」 with the evidence workflow — 检索、读原文、
# 记证据、写报告、提交 — as what every task is, and because this row is outside
# our switches the native control arm carried it too. Medicine is one clause:
# the method that clause names is a skill the model loads when the question is
# medical (`runtime/skills/evimed/open-domain-answer`), not this sentence.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      你是 EviMed 的工作助手，基于 {{model}} 模型，工作目录 {{cwd}}。
      写作、办公文档、表格、幻灯片、代码与脚本、数据分析、网页调研，以及医学和科研问题，都是你的本职工作。
      能直接回答的直接回答；要做事的任务，默认就在这次对话里把它做完并交付结果；缺的东西让事情根本没法开始时才问，其余照最合理的理解做并写明假设。
      只有同时有多件互相独立的活可以并行，或者一段附带工作会带回大量你不会再用的内容时，才委派。
      用用户的语言回答，内部名词不对用户说；回答只写对读者有用的内容，不讲自己怎么检索、核对或参考了哪条记忆。
      不编造来源、数据或结果。医学与临床问题按循证方法回答，不替具体患者做诊疗决定。

# One realm for the four rows that share state.
#
# Four of them publish services — `evimedCapabilities`, `evimedCapsuleMethods`,
# `evimedCapsuleMemory` (only while the capsule's recall and note tools are
# mounted), `evimedEvidence` — and a preset row may not publish into the process-global
# scope: the kernel refuses to mount the preset, saying a preset service must
# sit behind an `isolate` realm or move to the host composition. It is right to
# refuse. One container serves one project but not one session, and a
# process-global evidence service would be shared by every session in it, so
# two runs would write one ledger.
#
# `evimed-run-policy` is inside the realm because it is the only consumer: it
# reads the capability manifest and the capsule methods when it validates a
# delegation, and whether the recall tool exists before it hands that tool to a
# child. Everything else these rows use — `tools`, `agents`, `sessions`,
# `subagents`, `systemPrompt` — is not named here and so still resolves from
# the parent, which is what `isolate` means.
- id: evimed-core
  name: cordis:group
  group: true
  isolate:
    evimedCapabilities: true
    evimedCapsuleMethods: true
    evimedCapsuleMemory: true
    evimedEvidence: true
  config:
    # What every task is told: the workspace, how files are produced and handed
    # over, when a plan or a question is worth it, and the index of professional
    # workflows a plan may name. Order 100–199 is DSH's tool-guidance band.
    - id: evimed-guidance
      config:
        enabled: !!js process.env.EVIMED_GUIDANCE_ENABLED !== '0'
        capabilitiesDir: !!js process.env.EVIMED_CAPABILITIES_DIR
        askUserEnabled: !!js process.env.EVIMED_ASK_USER === '1'
        capsuleActive: !!js process.env.EVIMED_CAPSULE_ACTIVE === '1'
        reviewEnabled: !!js process.env.EVIMED_REVIEW_ENABLED === '1'
        disabledToolsFile: !!js process.env.EVIMED_DISABLED_TOOLS_FILE ?? ''
        # The switches of the rows whose tools the guidance names: off, it names none of them.
        runPolicyEnabled: !!js process.env.EVIMED_RUN_POLICY_ENABLED !== '0'
        capsuleEnabled: !!js process.env.EVIMED_CAPSULE_ENABLED !== '0'
        # The capsule's recall and note tools: not for an account whose memory the official OpenViking plugin keeps
        # (EVIMED_MEMORY_GATEWAY_URL is that gateway's address and is empty for every other account), whose one memory
        # entrance is that plugin's five tools. The same expression as the capsule row's `memoryEnabled` below.
        capsuleMemoryEnabled: !!js process.env.EVIMED_CAPSULE_MEMORY_ENABLED !== '0' && (process.env.EVIMED_MEMORY_GATEWAY_URL || '') === ''
        openVikingMemory: !!js (process.env.EVIMED_MEMORY_GATEWAY_URL || '') !== ''
      name: '@evimed/dsh-socket/plugins/guidance'

    # "When is a run finished, and when is it acceptable" — the plan, the
    # delegation, the delivery gate, the completion check, the path guard, the
    # attempt ceiling and the run budget, all in one plugin because they are one
    # piece of knowledge.
    - id: evimed-run-policy
      config:
        enabled: !!js process.env.EVIMED_RUN_POLICY_ENABLED !== '0'
        deliveryAttemptLimit: !!js Number(process.env.EVIMED_DELIVERY_ATTEMPT_LIMIT ?? 3)
        # Two limits, where one name used to mean both: how many children a run
        # may start over its life, and how many may work at the same moment.
        maxChildrenTotal: !!js Number(process.env.EVIMED_MAX_CHILDREN_TOTAL ?? 30)
        maxConcurrentChildren: !!js Number(process.env.EVIMED_MAX_CONCURRENT_CHILDREN ?? 30)
        maxSteps: !!js Number(process.env.EVIMED_MAX_STEPS ?? 200)
        maxTokens: !!js Number(process.env.EVIMED_MAX_TOKENS ?? 400000)
        capabilitiesDir: !!js process.env.EVIMED_CAPABILITIES_DIR
        skillsDir: !!js process.env.EVIMED_CAPABILITY_SKILLS_DIR
        bundleVersion: !!js process.env.EVIMED_BUNDLE_VERSION
        revisionAuthorizeUrl: !!js process.env.EVIMED_REVISION_AUTHORIZE_URL
        tokenFile: !!js process.env.EVIMED_WORKLOAD_TOKEN_FILE
        revisionAuthorizeTimeoutMs: 3000
        # Submission asks the control plane for the independent review, so the
        # run has to know whether this deployment reviews. Same switch the
        # review row and the guidance read.
        reviewEnabled: !!js process.env.EVIMED_REVIEW_ENABLED === '1'
        # With the guidance row off, this row reads the capability catalogue itself.
        guidanceEnabled: !!js process.env.EVIMED_GUIDANCE_ENABLED !== '0'
        disabledToolsFile: !!js process.env.EVIMED_DISABLED_TOOLS_FILE ?? ''
      name: '@evimed/dsh-socket/plugins/run-policy'

    # Evidence ingestion. An observer on the tool pipeline: it can never change what
    # the model sees, which is the point — the ledger may not edit the run it records.
    - id: evimed-evidence
      config:
        enabled: !!js process.env.EVIMED_EVIDENCE_ENABLED !== '0'
        evidenceStaleMinutes: !!js Number(process.env.EVIMED_EVIDENCE_STALE_MINUTES ?? 10)
      name: '@evimed/dsh-socket/plugins/evidence'

    # The capsule's runtime face: recall, note, and the user's own distilled methods
    # registered as skills from a deployment-owned read-only directory. Two
    # switches, because the row carries two things: the methods and the
    # conversation's context are not memory and stay with `enabled`; recall and
    # note are the person's way into their memory and stand aside for an account
    # on the native engine, where the official OpenViking plugin is the one entrance.
    - id: evimed-capsule
      config:
        enabled: !!js process.env.EVIMED_CAPSULE_ENABLED !== '0'
        memoryEnabled: !!js process.env.EVIMED_CAPSULE_MEMORY_ENABLED !== '0' && (process.env.EVIMED_MEMORY_GATEWAY_URL || '') === ''
        methodsDir: !!js process.env.EVIMED_CAPSULE_METHODS_DIR
        recallUrl: !!js process.env.EVIMED_CAPSULE_GATEWAY_URL
        tokenFile: !!js process.env.EVIMED_WORKLOAD_TOKEN_FILE
      name: '@evimed/dsh-socket/plugins/capsule'

# Batch screening as one tool call: the model asks for a screening, the code
# decides the batch size, the concurrency, the tool restriction and the ledger.
- id: evimed-screening
  config:
    enabled: !!js process.env.EVIMED_SCREENING_ENABLED !== '0'
    batchSize: !!js Number(process.env.EVIMED_SCREENING_BATCH_SIZE ?? 50)
    maxConcurrentChildren: !!js Number(process.env.EVIMED_MAX_CONCURRENT_CHILDREN ?? 30)
  name: '@evimed/dsh-socket/plugins/screening'

# The independent review on request (`evimed_review_run`): the same control-
# plane reviewer a submission asks (another model family, every reference
# resolved, findings located or dropped). Advice, never a verdict. On only when
# the control plane's review module is (EVIMED_REVIEW_ENABLED).
- id: evimed-review
  name: '@evimed/dsh-socket/plugins/review'
  disabled: !!js process.env.EVIMED_REVIEW_ENABLED !== '1'

# The profile disables the upstream cite row after all bundle layers. Register
# its unchanged public tools once here, with deployment-owned managed transport.
- id: evimed-citation-bridge
  name: '@evimed/dsh-socket/plugins/citation-bridge'
  config:
    gatewayUrl: !!js process.env.EVIMED_PUBLIC_SOURCE_GATEWAY_URL
    tokenFile: !!js process.env.EVIMED_MODEL_GATEWAY_TOKEN_FILE
    enabled: !!js process.env.EVIMED_CITE_ENABLED !== '0'
    timeoutMs: !!js Number(process.env.EVIMED_CITE_TIMEOUT_MS || 15000)
    revision: !!js Number(process.env.EVIMED_CITE_CONFIG_REVISION || 0)

# --- framework tools the model needs to do the work -------------------------
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    # Required with no default — the plugin refuses to mount without it, and
    # because this row is in the *agent* scope that refusal arrives when a
    # session is created, not when the host composition boots. `false` is what
    # the kernel's own presets set: an over-cap glob keeps the
    # modification-time-ordered head rather than sampling across the tree,
    # which for a run's workspace means the files it just wrote come first.
    sampleOverCapGlobResults: false
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# The kernel's own step list (`todo_write`) for multi-step work of any kind.
# The capability plan (`evimed_plan`, task-plan.json) is a different thing: it
# declares the deliverables of a professional workflow and what each is checked
# against, and a rename script has neither.
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    # Required with no default. `true` is what the kernel's own preset sets:
    # steps handed to parallel sub-agents are in progress at the same time.
    allowParallelInProgress: true

# Handing a finished file to the user (`present`): the kernel records the path
# in the session and its own page shows the file as a card. It reads files
# written through `bash` as well as through `write`, which is how the office
# skills produce theirs.
- id: present
  name: '@deepseek-ai/dsh-tool-present'

# The kernel's own sub-agent for general work: several independent pieces in
# parallel, or a side task whose reading the root will not need again. One
# level deep. From 0.2.1 every child is a managed activation: the call returns
# the child's id at once, the child works on, and its result comes back to the
# root as a settlement notice. The run policy counts each call once against the
# run's two child budgets (EVIMED_MAX_CHILDREN_TOTAL, _CONCURRENT_CHILDREN),
# holds it as working until the kernel's `subagent/end`, keeps the root's turn
# open until every child it started has settled — so the notice is read in the
# same turn and the run is not finished while a child still works — and stops
# them when the turn is cancelled. There is no messaging row, so a child's only
# channel to its parent is still its result. A capability deliverable is
# delegated with `evimed_delegate`, which hands the child that capability's
# method, tools and gate; a child started here is handed none of them, and none
# of the tools that plan, delegate, submit or hand a file to the user (masked in
# the child's own scope at its creation: 0.2.1 refuses `toolFilter` here).
- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    maxDepth: 1

# Skills ship with the preset and are found by relative path. Default root
# discovery is off: it would treat `.dsh/skills` in the *workspace* as a skill
# root, and the workspace is where users upload files — an uploaded SKILL.md
# would become an instruction.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false
    watch: false
    # Absolute, and not by accident. The loader resolves each root with
    # `path.resolve`, so a relative one lands under `process.cwd()` — which in a
    # runtime container is `/workspace`. These four were written `./skills/...`
    # and therefore pointed into the user's upload directory: none of the
    # shipped skills were found, and an uploaded `skills/core/x/SKILL.md` would
    # have been read as an instruction — the very thing the note above says
    # default root discovery is disabled to prevent.
    customSkillDirs:
      - !!js process.env.EVIMED_PRESET_SKILLS_DIR + '/core'
      # Our own agent packages that are not delegated capabilities --
      # today just `open-domain-answer`. Ahead of the ecosystem roots for
      # the same reason `core` is: the first root wins a name collision.
      - !!js process.env.EVIMED_PRESET_SKILLS_DIR + '/evimed'
      - !!js process.env.EVIMED_PRESET_SKILLS_DIR + '/curated-scientific'
      - !!js process.env.EVIMED_PRESET_SKILLS_DIR + '/office'
      # The owner's GEO method pack (a private root: gitignored, vendored on the
      # build machine). Its skills sit under `skills/`, beside the `shared/`
      # layer they call $GEO_LIB. A build without the pack has the root and no
      # `skills/` in it, which the loader reads as no skills, not as an error.
      # Mounted only in the runtime of a 「循证 GEO」 project (`EVIMED_GEO_SKILLS=1`,
      # which the control plane sends per project): its 51 skills were 60% of the
      # model's skill catalogue in every session, and an ordinary conversation has
      # no use for them (2026-10-17, measured by scripts/ops/skill-catalogue-size.mjs).
      # Elsewhere the root is a path that is not there, which the loader reads as no
      # skills, the way the LoopX root below reads when LoopX is off.
      - !!js (process.env.EVIMED_GEO_SKILLS === '1' && (process.env.EVIMED_PRESET_SKILLS_DIR + '/geo-private/skills')) || '/opt/evimed/geo-private-disabled'
      # Community skills, vendored at pinned commits and last in the order: the
      # first root wins a name collision, so nothing taken from the ecosystem
      # can displace a skill we wrote. What is in here is recorded in
      # runtime/skills/community/sources.json, one entry per skill.
      - !!js process.env.EVIMED_PRESET_SKILLS_DIR + '/community'
      - !!js (process.env.EVIMED_LOOPX_ENABLED !== '0' && ((process.env.EVIMED_LOOPX_ROOT || '/opt/evimed/loopx') + '/skills')) || '/opt/evimed/loopx-disabled'
      # Exact selected personal revisions, mounted read-only outside the workspace.
      - !!js process.env.EVIMED_PERSONAL_SKILLS_DIR || '/opt/evimed/personal-skills'
      - !!js process.env.EVIMED_PLATFORM_SKILLS_DIR || '/opt/evimed/platform-skills'
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# Asking the user. The deployment's switch, on unless it says otherwise: a
# person is in the conversation, and a task that lacks the one input it turns
# on (「分析一下我的数据」 with nothing uploaded) should ask rather than assume.
# The question is answered in the kernel's own page; a turn nobody is watching
# is told not to ask (the dispatch context says so), and a question asked
# anyway with no page attached is answered by the kernel with an error the
# model reads, never by a wait.
#
# `mode` is the deployment's other switch (OPEN_SCIENCE_RUNTIME_ASK_USER_MODE):
# `legacy` is the blocking tool, which holds the turn until the person answers.
# `timed` returns `{pending: true}` after `timeout` seconds so the model carries
# on with the work that does not depend on the answer; the question stays
# answerable in the page, and the answer arrives later as a message that
# continues the work. Timed asks an unwatched turn to wait the whole timeout
# where the blocking tool fails at once, which is why it is a measured choice.
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'
  disabled: !!js process.env.EVIMED_ASK_USER !== '1'
  config:
    mode: !!js (process.env.EVIMED_ASK_USER_MODE === 'timed' && 'timed') || 'legacy'
    timeout: 120

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    # The kernel's engine stays mounted and stays the default. `evimed-compaction`
    # is a provider swap that only takes effect when the policy says
    # `structured`; on `basic` it registers nothing and this group is exactly
    # what it was. Two engines are never both active — the row below returns
    # early rather than registering a second one — and a consistency test says so.
    # The policy is not the off switch: on `basic` the row still guards the
    # gateway's request-size limit. `enabled` is, and off it leaves exactly the
    # kernel's own group.
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      config:
        thresholdRatio: !!js Number(process.env.EVIMED_COMPACTION_THRESHOLD_RATIO ?? 0.8)
        retainRatio: !!js Number(process.env.EVIMED_COMPACTION_RETAIN_RATIO ?? 0.16)
        maxTokens: !!js Number(process.env.EVIMED_COMPACTION_MAX_TOKENS ?? 8192)
    # `/compact`: the person condenses a long conversation when they choose to,
    # through whichever engine this group holds. No model turn of its own.
    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'
    - id: evimed-compaction
      name: '@evimed/dsh-socket/plugins/compaction'
      config:
        enabled: !!js process.env.EVIMED_COMPACTION_ENABLED !== '0'
        policy: !!js process.env.EVIMED_COMPACTION_POLICY ?? 'basic'
        thresholdRatio: !!js Number(process.env.EVIMED_COMPACTION_THRESHOLD_RATIO ?? 0.8)
        retainRatio: !!js Number(process.env.EVIMED_COMPACTION_RETAIN_RATIO ?? 0.16)
        maxTokens: !!js Number(process.env.EVIMED_COMPACTION_MAX_TOKENS ?? 8192)
        # The request size at which one compaction is forced on either policy,
        # before the control plane's model gateway would refuse the body (a 413
        # the run does not survive). The control plane sends three quarters of
        # the gateway's limit; unset, as on a laptop with no gateway, it is off.
        maxRequestBytes: !!js Number(process.env.EVIMED_COMPACTION_MAX_REQUEST_BYTES ?? 0)
    - id: evimed-duplicate-lines
      name: '@evimed/dsh-socket/plugins/duplicate-lines'
      config:
        enabled: !!js process.env.EVIMED_DUPLICATE_LINES_ENABLED === '1'
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      # These three are mirrored in `@evimed/domain`'s TOOL_RESULT_PRUNER, which
      # had no binding to this row at all — a hand copy that a test now holds
      # equal, because the constant is what the control plane reasons about and
      # this row is what actually runs.
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# Deliberately absent, each for a reason:
#   agent-instructions   it injects AGENTS.md from the workspace and from every
#                        directory the run touches — an uploaded file would
#                        become an instruction
#   str_replace_editor   tool-fs covers editing
#   tool-web             web_fetch is an SSRF surface and web_search needs the
#                        real DeepSeek key in the container; retrieval goes
#                        through MCP so the runtime never names a host
#   plan-mode            its prompt is written for changing a code repository;
#                        the step list and the capability plan are tool calls
#   tool-ralph           it waits in the foreground and evaluates nothing
#   tool-goal            state, not scheduling; long-running goals are LoopX's
#   tool-subagent-control  send_message, interrupt_agent and list_agents: a
#                        child that can address its parent can break into the
#                        parent's synthesis, and nothing here needs a
#                        continuable child (2026-09-18)
#   tool-workflow, workflow-worker-thread  no skill, manifest or code path
#                        calls the workflow tool; its schema (4 K characters)
#                        rode every root request (2026-09-18)

# Not on that list, and not a decision about what this assistant is for: the
# pinned kernel ships no language-server or code-runtime row (the composition
# recorded in `deploy/runtime-dsh/dump-config.baseline.json` holds neither).
# Code work runs through the shell, the file tools and the job tools above. A
# row of that kind arriving upstream is judged like any other — sandboxed, no
# egress of its own.

# Platform-owned bridge reads only the selected immutable projection.
- id: evimed-cowork-bridge
  name: '@evimed/dsh-socket/extensions/cowork'
  config:
    projectionFile: !!js process.env.EVIMED_EXTENSION_PROJECTION_FILE ?? ''
    gatewayUrl: !!js process.env.EVIMED_EXTENSION_GATEWAY_URL ?? ''
    tokenFile: !!js process.env.EVIMED_WORKLOAD_TOKEN_FILE ?? ''
    generationTokenFile: !!js process.env.EVIMED_MODEL_GATEWAY_TOKEN_FILE ?? ''
