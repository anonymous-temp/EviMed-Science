id: clinical-evidence-synthesis
version: 1.0.3
title: Clinical Evidence Synthesis
category: Clinical Evidence
description: Transform an open-domain clinical question into a concise academic analysis with claim-level source traceability and a separate safety-first practical answer.
skill: clinical-evidence-synthesis
estimatedMinutes: [10, 45]
starterPrompts:
  - Analyze acute chest pressure, the differential diagnosis, and the appropriate role of Suxiao Jiuxin Wan.
requiredInputs:
  - question
optionalInputs:
  - population
  - intervention
  - comparator
  - outcomes
  - careSetting
  - jurisdiction
  - outputLanguage
requiredTools:
  - evimed_official_page_fetch
optionalTools:
  - evimed_literature_search
  - evimed_biomedical_source_search
  - evimed_open_access_full_text
  - evimed_guideline_search
  - evimed_drug_label_search
  - evimed_pharmacy_reference_search
  - evimed_evidence_deduplicate
dataSources:
  - literature
  - guidelines
  - drug-labels
outputs:
  - path: clinical-evidence-report.md
    required: true
  - path: clinical-evidence-matrix.json
    required: true
  - path: clinical-evidence-run.json
    required: true
completionChecks:
  - requiredOutputsExist
  - citationsResolvable
  - evidenceClaimsTraceable
