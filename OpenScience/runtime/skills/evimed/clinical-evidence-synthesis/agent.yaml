id: clinical-evidence-synthesis
version: 2.9.0
title: Clinical Evidence Synthesis
category: Clinical Evidence
description: Transform an open-domain clinical question into a publication-grade deep evidence analysis with reproducible searches, verified citations, claim-level traceability, and a separate safety-first practical answer.
skill: clinical-evidence-synthesis
companionSkills:
  - deep-research
  - biomedical-database-search
  - citation-integrity
  - manuscript-humanize
estimatedMinutes: [30, 120]
starterPrompts:
  - Analyze acute chest pressure, the differential diagnosis, and the appropriate role of Suxiao Jiuxin Wan.
requiredInputs:
  - question
optionalInputs:
  - population
  - intervention
  - comparator
  - outcomes
  - careSetting
  - jurisdiction
  - outputLanguage
requiredTools:
  - data_source_catalog
  - literature_search
  - official_page_fetch
  - open_access_full_text
  - evidence_deduplicate
optionalTools:
  - biomedical_source_search
  - guideline_search
  - drug_label_search
  - pharmacy_reference_search
dataSources:
  - literature
  - guidelines
  - drug-labels
outputs:
  - path: clinical-evidence-report.md
    required: true
  - path: clinical-evidence-matrix.json
    required: true
  - path: clinical-evidence-search.json
    required: true
  - path: citation-ledger.csv
    required: true
  - path: references.bib
    required: true
  - path: citation-audit.md
    required: true
  - path: clinical-evidence-run.json
    required: true
  - path: question-coverage.json
    required: true
completionChecks:
  - requiredOutputsExist
  - citationsResolvable
  - evidenceClaimsTraceable
  - skillsLoaded
