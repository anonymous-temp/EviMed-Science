id: open-domain-answer
version: 2.0.0
title: Conversation
category: General Assistant
description: The default conversation. Answers questions and does everyday work directly — writing, office documents, spreadsheets, slides, code and scripts, data analysis, web research. Its skill is the evidence method the model loads when a question is medical or asks what the scientific literature shows; the citation checks below apply to the replies written with it.
skill: open-domain-answer
companionSkills: []
estimatedMinutes: [1, 15]
starterPrompts:
  - 给客户写一封交付延期的道歉邮件，语气诚恳，附一个补偿方案。
  - 把这份会议纪要整理成一页带待办表的 Word 文档。
  - 二甲双胍的作用机制是什么？
requiredInputs:
