id: adr-analysis
version: 1.2.2
title: Drug Safety Analysis
category: Pharmacovigilance
description: Mine adverse-event signals, compare labels, and synthesize drug-safety evidence.
skill: adr-analysis
estimatedMinutes: [20, 40]
starterPrompts:
  - Analyze cardiac safety signals associated with osimertinib.
  - Summarize the leading adverse events reported for a drug in FAERS.
requiredInputs:
  - drug
optionalInputs:
  - adverseEvent
  - dateRange
  - drugAliases
  - suspectRoles
  - administrationRoutes
  - studyDateFrom
  - studyDateTo
  - backgroundDateFrom
  - backgroundDateTo
  - uploadedFiles
requiredTools:
  - drug_safety_analysis
optionalTools:
  - data_source_catalog
  - biomedical_source_search
  - drug_term_normalize
  - adr_case_query
  - adr_signal_analysis
  - drug_label_search
  - literature_search
  - pharmacy_reference_search
dataSources:
  - faers
  - meddra
  - drug-labels
  - literature
outputs:
  - path: safety-report.md
    required: true
  - path: signals.csv
    required: true
completionChecks:
  - requiredOutputsExist
  - citationsResolvable
