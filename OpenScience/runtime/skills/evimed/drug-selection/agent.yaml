id: drug-selection
version: 2.1.1
title: Drug Selection Evaluation
category: Formulary Decision Support
description: Compare candidate medicines across pharmaceutical properties, effectiveness, safety, economics, and other formulary attributes.
skill: drug-selection
estimatedMinutes: [20, 50]
starterPrompts:
  - Compare candidate medicines for a hospital formulary decision in one indication.
  - Build an evidence-backed scorecard for selecting among equivalent medicines.
requiredInputs:
  - candidateDrugs
  - indication
optionalInputs:
  - population
  - jurisdiction
  - selectionCriteria
  - selectionDomains
  - scoringRubric
  - scoringPolicyVersion
  - economicContext
  - productSpecifications
  - careSetting
  - decisionDate
  - budgetContext
  - uploadedFiles
requiredTools:
  - drug_term_normalize
  - drug_selection_evaluation
optionalTools:
  - data_source_catalog
  - biomedical_source_search
  - drug_label_search
  - guideline_search
  - clinical_trial_search
  - literature_search
  - pharmacy_reference_search
dataSources:
  - drug-labels
  - guidelines
  - clinical-trials
  - literature
  - internal-evidence
  - uploaded-files
outputs:
  - path: drug-selection-report.md
    required: true
  - path: selection-scorecard.csv
    required: true
  - path: decision-summary.json
    required: true
  - path: evidence-snapshot.json
    required: true
completionChecks:
  - requiredOutputsExist
  - citationsResolvable
  - citedSourcesRecorded
